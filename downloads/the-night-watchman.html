tands there holding it.<\/p>", "arg": "TOLLPAID"}, {"t": "cond", "kind": "lacks", "h": "<p>There is a list somewhere. You have not seen it. You do not need to have seen it, because the thing at the bottom of the slope has just read it out.<\/p>", "arg": "TOLLPAID"}, {"t": "choice", "label": "Continue", "target": "407"}]}, "407": {"act": 3, "region": "The Thing At The Ford", "blocks": [{"t": "p", "h": "<p>\"You knew,\" you say to Hett.<\/p>"}, {"t": "p", "h": "<p>\"No.\" He is looking at the ice. \"I worked out the cold takes the able-bodied and I sent my lads to Aldermere on an errand I invented, and I have felt like a coward about it every day for a year.\" A short breath that is not a laugh. \"Turns out I wasn't saving them. Turns out there was only ever one name left on it and it was mine, and I have spent a year standing guard over a debt that was always going to be mine to pay.\"<\/p>"}, {"t": "cond", "kind": "has", "h": "<p>He hands you back the list, and you fold it away against your chest.<\/p>", "arg": "TOLLPAID"}, {"t": "p", "h": "<p>\"Well,\" says Hett Vance. \"That's a relief, honestly.\"<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you are proficient in Insight:<\/i> that is not bravado and it is not despair. That is a man setting down something he has carried alone for a year, and he is going to move the moment you stop looking at him.<\/p>"}, {"t": "choice", "label": "Continue", "target": "408"}]}, "408": {"act": 3, "region": "The Thing At The Ford", "blocks": [{"t": "p", "h": "<p>And then he starts down the slope.<\/p>"}, {"t": "p", "h": "<p>He does it without any speech at all, which is how you know he means it: walking down toward the ford at three in the morning to settle a village's account, because he has spent twenty years arranging his whole life around this exact moment arriving, and he is not going to flinch at it now that it finally has.<\/p>"}, {"t": "p", "h": "<p>You have about four seconds.<\/p>"}, {"t": "choice", "label": "Stop him", "target": "409"}, {"t": "choice", "label": "Let him go", "target": "412"}]}, "409": {"act": 3, "region": "The Thing At The Ford", "blocks": [{"t": "p", "h": "<p>You get a hand on his arm.<\/p>"}, {"t": "p", "h": "<p>He does not shake it off. He stands there with your hand on his sleeve, in the frost, halfway down a slope, and he does not look at you, and he says:<\/p>"}, {"t": "p", "h": "<p>\"Don't. Please. I have wanted this to be simple for a year.\"<\/p>"}, {"t": "choice", "label": "\"It isn't yours to pay.\"", "target": "410"}, {"t": "choice", "label": "\"The job isn't beating it. You told me that.\"", "target": "411"}]}, "410": {"act": 3, "region": "The Thing At The Ford", "blocks": [{"t": "p", "h": "<p>\"It is, though,\" Hett says. \"That's the thing nobody will say out loud in this village. Somebody's name was always going to be on that paper. Alder made the call, Doran carried the box, Sefa feeds the stones, Anselm rings the bell, and every single one of them has been paying it in instalments for a year so that nobody had to pay it in full.\" He finally looks at you. \"I can pay it in full. That's not brave. That's just the shortest way.\"<\/p>"}, {"t": "choice", "label": "\"The job isn't beating it. You told me that.\"", "target": "411"}]}, "411": {"act": 3, "region": "The Thing At The Ford", "blocks": [{"t": "p", "h": "<p>\"You told me there were four rules,\" you say. \"You gave me three and you said the fourth was the one you couldn't teach me, and that I'd know it when I needed it.\"<\/p>"}, {"t": "p", "h": "<p>Hett Vance stops.<\/p>"}, {"t": "p", "h": "<p>\"I know it now. The job isn't beating the dark. The job is being a light that keeps moving so the village knows the night's still got somebody in it.\" Your hand is still on his sleeve. \"That's you, and you're about to stop. You're not the watch right now. You're the shortest way.\"<\/p>"}, {"t": "p", "h": "<p>The silence goes on a while.<\/p>"}, {"t": "p", "h": "<p>\"Ah, hell,\" says Hett.<\/p>"}, {"t": "choice", "label": "Continue", "target": "413"}]}, "412": {"act": 3, "region": "The Thing At The Ford", "blocks": [{"t": "p", "h": "<p>You let him go.<\/p>"}, {"t": "p", "h": "<p>He gets nine steps down the slope before you understand that you are not going to be able to live with it, and you go after him, and you are faster than a man of fifty in frost, and you get in front of him.<\/p>"}, {"t": "p", "h": "<p>He looks at you for a long moment.<\/p>"}, {"t": "p", "h": "<p>\"You're going to be a nuisance about this,\" he says. \"Aren't you.\"<\/p>"}, {"t": "choice", "label": "Continue", "target": "413"}]}, "413": {"act": 3, "region": "The Thing At The Ford", "blocks": [{"t": "p", "h": "<p>At the bottom of the slope, the thing wearing Doran Welk waits with its hands loose at its sides, patient as weather, because it is weather.<\/p>"}, {"t": "p", "h": "<p>It has all night. It has, precisely, until dawn, and so do you, and here is the one thing you must understand about the rest of this night: <b>you cannot kill it.<\/b> Understand that plainly, because the book is not going to pretend otherwise at any point in the next hour. There is no stat block for the cold. Nothing you do to that borrowed body does anything to the thing standing behind it. You are a watchman with a lantern and a bell-clapper and a night to get through.<\/p>"}, {"t": "p", "h": "<p>What is left to you is not victory. It is the four hours until the sun, and what you choose to do with them.<\/p>"}, {"t": "choice", "label": "Continue", "target": "415"}]}, "415": {"act": 3, "region": "The Thing At The Ford", "blocks": [{"t": "p", "h": "<p><b>The last watch.<\/b><\/p>"}, {"t": "p", "h": "<p><i>Choose your ending. Each is complete. There is no correct one, and the book will not tell you afterward which you should have taken.<\/i><\/p>"}, {"t": "choice", "label": "<b>Pay it.<\/b> Take the box down to the ford and finish what Doran started", "target": "420", "req": "TOLLPAID"}, {"t": "choice", "label": "<b>Ring it.<\/b> Get to the shrine and hold the vigil until dawn", "target": "440", "req": "RELIEVED"}, {"t": "choice", "label": "<b>Refuse it.<\/b> Get behind a door with the rest of them and give it nothing", "target": "460", "req": "DOORHELD"}, {"t": "choice", "label": "<b>Go and get her.<\/b> Across the ice to the Drowned Lane", "target": "480", "req": "TAKEN"}, {"t": "choice", "label": "<b>Stand the watch.<\/b> No plan. Walk your round until the sun comes up. <i>(always available)<\/i>", "target": "500"}]}, "420": {"act": 3, "region": "Pay It", "blocks": [{"t": "p", "h": "<p>The strongbox is where you left it, or where you carried it to, and it is heavier than a box of coppers has any right to be.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you are proficient in Athletics:<\/i> you have carried enough dead weight to know when it is lying to you. You counted what is in this box yourself, and it does not weigh what you counted, and there is nothing to be done with that except carry it down the hill anyway.<\/p>"}, {"t": "p", "h": "<p>You turn the wick up as far as it goes before you lift the box, because you want your hands seen while you do this. <b>The lamp drinks a unit of oil.<\/b><\/p>", "ops": [{"op": "oil", "d": -1}]}, {"t": "cond", "kind": "lampdark", "h": "<p>There is no wick left to turn. You carry the box down by the grey light coming up off the ice, and Hett Vance walks the last of it beside you with his own lantern held out at arm's length, over your hands, so that whatever is waiting can see them.<\/p>"}, {"t": "p", "h": "<p>You carry it down the slope past Hett Vance, who says your name once and then does not say anything else, and you set it down on the frozen stones at the edge of the ford in front of a dead man, and you step back.<\/p>"}, {"t": "p", "h": "<p>\"Ah,\" it says, pleased. \"There. That's the arrangement.\"<\/p>"}, {"t": "choice", "label": "Continue", "target": "421"}]}, "421": {"act": 3, "region": "Pay It", "blocks": [{"t": "p", "h": "<p>It does not touch the box.<\/p>"}, {"t": "p", "h": "<p>\"You've misunderstood, but only slightly, and it's a common one.\" Doran's hands stay loose at his sides. \"The coin was never the thing. The coin is how a village agrees to a number without having to say the number out loud. Eleven, watchman. The box is just where the village keeps its debt of eleven names, so nobody has to look at it.\"<\/p>"}, {"t": "p", "h": "<p>It tips the borrowed head.<\/p>"}, {"t": "p", "h": "<p>\"So. You've brought me the box. Whose name is in it?\"<\/p>"}, {"t": "choice", "label": "Continue", "target": "422"}]}, "422": {"act": 3, "region": "Pay It", "blocks": [{"t": "p", "h": "<p>This is the moment. You knew it was coming from the second you picked the box up.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you write Hett Vance's name, or say nothing and let the list stand as written:<\/i> → <a class=\"eref\" data-go=\"423\">423<\/a><\/p>", "target": "423"}, {"t": "cond", "kind": "other", "h": "<p><i>If you write your own:<\/i> → <a class=\"eref\" data-go=\"425\">425<\/a><\/p>", "target": "425"}, {"t": "cond", "kind": "other", "h": "<p><i>If you refuse to answer at all:<\/i> → <a class=\"eref\" data-go=\"427\">427<\/a><\/p>", "target": "427"}]}, "423": {"act": 3, "region": "Pay It", "blocks": [{"t": "p", "h": "<p>You say nothing.<\/p>"}, {"t": "p", "h": "<p>Which is an answer. The list is in your coat and there are two names on it not crossed out and one of them is standing thirty feet behind you, and you say nothing at all, and the silence does the work.<\/p>"}, {"t": "p", "h": "<p>\"Right,\" it says, and starts up the slope.<\/p>"}, {"t": "choice", "label": "Continue", "target": "424"}]}, "424": {"act": 3, "region": "Pay It", "blocks": [{"t": "p", "h": "<p>You do not remember deciding to move.<\/p>"}, {"t": "p", "h": "<p>You get in front of it on a frozen slope with a lantern in one hand, and Hett Vance shouts something behind you, and the cold comes off the thing in front of you like an open door in winter, and you stand in it.<\/p>"}, {"t": "p", "h": "<p>It stops. It looks at you with a dead man's eyes and something in it is genuinely, mildly curious.<\/p>"}, {"t": "p", "h": "<p>\"You had a whole night to work out you can't stop me,\" it says.<\/p>"}, {"t": "p", "h": "<p>\"I know.\"<\/p>"}, {"t": "p", "h": "<p>\"Then move.\"<\/p>"}, {"t": "p", "h": "<p>\"No.\"<\/p>"}, {"t": "choice", "label": "Continue", "target": "428"}]}, "425": {"act": 3, "region": "Pay It", "blocks": [{"t": "p", "h": "<p>You take the list out of your coat and you scratch out Hett Vance's name with your thumbnail, gouging the paper until it cannot be read, and under it, in frost and lamp-black because you have nothing else, you put your own name.<\/p>"}, {"t": "p", "h": "<p>Then you hold it out.<\/p>"}, {"t": "p", "h": "<p>The thing wearing Doran Welk looks at the paper for a long moment, and then it laughs, and it is Doran's laugh, and it is the single most horrible sound of the night.<\/p>"}, {"t": "p", "h": "<p>\"Eleven's eleven,\" it says. \"It was never particular.\"<\/p>"}, {"t": "choice", "label": "Continue", "target": "426"}]}, "426": {"act": 3, "region": "Pay It", "blocks": [{"t": "p", "h": "<p>Hett Vance comes down that slope like a landslide.<\/p>"}, {"t": "p", "h": "<p>He does not make it. He gets four strides and his boots go out from under him on the frost and he goes down hard on the frozen stones, and by the time he is up you have already stepped forward, and the cold closes over you like water.<\/p>"}, {"t": "p", "h": "<p>It does not hurt. That is the thing nobody tells you. It is enormously, gently cold, and it is like lying down after a very long day.<\/p>"}, {"t": "choice", "label": "Continue", "target": "429"}]}, "427": {"act": 3, "region": "Pay It", "blocks": [{"t": "p", "h": "<p>\"No,\" you say. \"I'm not writing a name in your book. Find your own eleven.\"<\/p>"}, {"t": "p", "h": "<p>\"I have found eleven. It is written down. You are holding it.\"<\/p>"}, {"t": "p", "h": "<p>\"Then it's a piece of paper,\" you say, and you get a flame from somewhere, your own lamp if it is lit and Hett's if it is not, and you hold the list over it and let it catch.<\/p>"}, {"t": "p", "h": "<p>It goes up fast. Eleven names in a careful hand, nine crossed out, gone in about four seconds, and the ash goes up into the dark over the frozen river.<\/p>"}, {"t": "choice", "label": "Continue", "target": "428"}]}, "428": {"act": 3, "region": "Pay It", "blocks": [{"t": "p", "h": "<p>Nothing happens.<\/p>"}, {"t": "p", "h": "<p>You half-expected something to happen. There is no sound, no flash, and the cold does not lift. If you burned the list, you understand after a moment that all you have done is burn a piece of paper, and it says, mildly, \"That was somebody's careful handwriting. Alder's, I think. She'll be upset.\" If you are standing in its path, it stops walking, and it does not try to push past you or go around you.<\/p>"}, {"t": "p", "h": "<p>And then it waits, because it can, because dawn is not here yet and it has nowhere to be and neither do you. It does not go up the slope for Hett Vance. It stands where it is, and you stand where you are, and the last watch of the night turns out to be exactly what the job always was: staying between the cold and the village until the sun comes up.<\/p>"}, {"t": "cond", "kind": "lampdark", "h": "<p>You hold the line anyway, by the grey light that comes up off the ice, and it looks at your dead lantern for a long moment with something uncomfortably close to approval.<\/p>"}, {"t": "choice", "label": "Continue", "target": "520"}]}, "429": {"act": 3, "region": "Pay It", "blocks": [{"t": "p", "h": "<p>You come back at dawn.<\/p>"}, {"t": "p", "h": "<p>That is not a metaphor and it is not a resurrection. You wake on the frozen stones at the edge of the ford with the sun on your face and Hett Vance slapping at your cheek and shouting, and you are alive, and you are extremely cold, and you have been out for four hours.<\/p>"}, {"t": "cond", "kind": "tier", "h": "<p>You take no lasting harm. It accepted what you offered, held you in the cold for four hours, and then it gave you back and left you on the ice.<\/p>", "arg": "ember"}, {"t": "cond", "kind": "tier", "h": "<p>Your hair has gone white at the temple and stays that way. <b>The dawn will read this: SCARRED.<\/b><\/p>", "arg": "lantern", "ops": [{"op": "grant", "words": ["SCARRED"], "mark": true}]}, {"t": "cond", "kind": "tier", "h": "<p>You do not come back at dawn. Go to <a class=\"eref\" data-go=\"535\">535<\/a>.<\/p>", "arg": "dark", "target": "535"}, {"t": "choice", "label": "Continue", "target": "520"}], "tierOwn": {"535": "dark"}}, "440": {"act": 3, "region": "Ring It", "blocks": [{"t": "p", "h": "<p>You go up the slope at a dead run for the shrine, and behind you Hett Vance does the only useful thing left, which is to stand in the middle of the road and make himself the most interesting object in Brackenford.<\/p>"}, {"t": "p", "h": "<p>\"Oi,\" you hear him say, conversationally, to the thing at the ford. \"Vance. That's me. That's the name you want. Come on, then.\"<\/p>"}, {"t": "p", "h": "<p>You do not look back. That is the hardest thing you have ever done and it takes about a second and a half.<\/p>"}, {"t": "choice", "label": "Continue", "target": "441"}]}, "441": {"act": 3, "region": "Ring It", "blocks": [{"t": "p", "h": "<p>The shrine door is where you left it, open or broken, and inside, Brother Anselm is asleep on the floor in the altar cloth for the first time in thirty days.<\/p>"}, {"t": "p", "h": "<p>The rope hangs in the dark with a band of blood on it at the height of a man's hands.<\/p>"}, {"t": "p", "h": "<p>You told him you would take the vigil. You did not know what you were agreeing to. You are about to find out, and what you find out is this: it is not difficult. It is not clever. There is a rope, and there is dawn, and the entire job is to still be here when the sun comes up.<\/p>"}, {"t": "p", "h": "<p>You set your lantern at the foot of the rope, where it will burn until morning. <b>The lamp drinks a unit of oil.<\/b><\/p>", "ops": [{"op": "oil", "d": -1}]}, {"t": "cond", "kind": "lampdark", "h": "<p>You ring with no light at all, and the dark listens.<\/p>"}, {"t": "choice", "label": "Continue", "target": "442"}]}, "442": {"act": 3, "region": "Ring It", "blocks": [{"t": "p", "h": "<p>You ring.<\/p>"}, {"t": "p", "h": "<p>Not the alarm Anselm rang. The proper one: one stroke, a pause the length of a breath, another, unhurried. The dusk pattern, at four in the morning, because it is the only pattern you know and because the point is not the hour, the point is that it is still happening.<\/p>"}, {"t": "p", "h": "<p>The sound goes out over a shuttered village.<\/p>"}, {"t": "p", "h": "<p>And out on the road, the thing that was walking toward Hett Vance stops walking toward Hett Vance.<\/p>"}, {"t": "choice", "label": "Continue", "target": "443"}]}, "443": {"act": 3, "region": "Ring It", "blocks": [{"t": "p", "h": "<p>It comes for the shrine.<\/p>"}, {"t": "p", "h": "<p>You hear it arrive. You hear it come up the step and stop at the door, and you keep ringing, one stroke, breath, one stroke, and the cold comes through the doorway ahead of it and the candle stubs on the floor go out in a wave from the door inward.<\/p>"}, {"t": "p", "h": "<p>\"Anselm,\" it says, from the step, in Doran Welk's kind voice. \"Brother. Are you awake in there?\"<\/p>"}, {"t": "p", "h": "<p>On the floor, in the altar cloth, Anselm does not stir. He is thirty days gone and eight hours into the first sleep of it and nothing in this world is waking him.<\/p>"}, {"t": "choice", "label": "Keep ringing", "target": "444"}, {"t": "choice", "label": "Answer it", "target": "445"}]}, "444": {"act": 3, "region": "Ring It", "blocks": [{"t": "p", "h": "<p>You keep ringing.<\/p>"}, {"t": "p", "h": "<p>That is the whole of it, for four hours. It talks the entire time. It uses Doran's voice, and then, when that stops working, it uses others: a shepherd's, warm, asking to be let in; a woman's, level, saying you've not asked after the dog; a child's, from six feet outside the door, crying and asking why nobody is coming.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If your passive Wisdom (Perception) is 14 or higher:<\/i> somewhere in the second hour the thing you noticed at the ford stops being a detail and becomes the only thing you can hear. Not one of those voices takes a breath before it speaks. Not one of them ever has.<\/p>"}, {"t": "check", "dc": 15, "ability": "Wisdom", "skill": null, "kind": "save", "h": "<p><i>Make a DC 15 Wisdom saving throw at the end of each of the first three hours. Ember Watch: DC 12. Dark Watch: DC 17.<\/i><\/p>", "tdc": {"ember": 12, "dark": 17}, "repeat": 3}, {"t": "p", "h": "<p><b>On each failure:<\/b> take 1d6 psychic damage. You do not stop ringing. The skin of your palms splits and bleeds on the rope, in a band at exactly the height of Anselm's.<\/p>"}, {"t": "p", "h": "<p><b>Fail-forward:<\/b> if you drop to 0 hit points here on Ember or Lantern, you do not die. Brother Anselm wakes at the wrong sound. He does not say anything and he does not take the rope from you; he puts his hands on it above yours and holds it up while you get your feet back, and the bell does not miss a stroke. Take one level of exhaustion, write the dawn mark <span class=\"cw\">SCARRED<\/span>, and go on to <a class=\"eref\" data-go=\"447\">447<\/a>. On Dark Watch, a man who goes down on that rope is not found until the doors open: go to <a class=\"eref\" data-go=\"535\">535<\/a>.<\/p>", "ops": [{"op": "grant", "words": ["SCARRED"], "mark": true}]}, {"t": "p", "h": "<p><b>If you fail all three:<\/b> → <a class=\"eref\" data-go=\"446\">446<\/a><br><b>Otherwise:<\/b> → <a class=\"eref\" data-go=\"447\">447<\/a><\/p>"}], "failFwd": "447", "ffShared": true}, "445": {"act": 3, "region": "Ring It", "blocks": [{"t": "p", "h": "<p>\"He's asleep,\" you say. \"You'll have to make do with me.\"<\/p>"}, {"t": "p", "h": "<p>A pause on the step.<\/p>"}, {"t": "p", "h": "<p>\"You're not on the list.\"<\/p>"}, {"t": "p", "h": "<p>\"No,\" you agree, and pull the rope. \"I'm the watch.\"<\/p>"}, {"t": "p", "h": "<p>And the thing outside the door of the Shrine of the Quiet Hand is quiet for a moment, and then it says, almost warmly, \"Ah. He's given it to you. That was quick of him,\" and it settles in to wait, and so do you.<\/p>"}, {"t": "choice", "label": "Continue", "target": "444"}]}, "446": {"act": 3, "region": "Ring It", "blocks": [{"t": "p", "h": "<p>Somewhere in the third hour you stop being able to tell which of the voices outside are real.<\/p>"}, {"t": "p", "h": "<p>You keep hauling. That is the only fact you can be sure of and you hold on to it the way Anselm told you he held on to the weight of the brass: a man can hold a weight when he cannot hold anything else.<\/p>"}, {"t": "p", "h": "<p>When Hett Vance finally gets the door open at sunrise you swing at him. <b>The dawn will read this: SCARRED.<\/b><\/p>", "ops": [{"op": "grant", "words": ["SCARRED"], "mark": true}]}, {"t": "choice", "label": "Continue", "target": "447"}]}, "447": {"act": 3, "region": "Ring It", "blocks": [{"t": "p", "h": "<p>And then it is light.<\/p>"}, {"t": "p", "h": "<p>There is no moment. That is what nobody tells you about dawn: it does not arrive, it accumulates, and at some point you notice you can see the far wall and that you have been able to see it for some time.<\/p>"}, {"t": "p", "h": "<p>The voices outside stopped at some point too. You could not say when.<\/p>"}, {"t": "p", "h": "<p>Your hands are ruined. The rope has a second band of blood on it now, a little above the first, because you are taller than Anselm.<\/p>"}, {"t": "choice", "label": "Continue", "target": "520"}]}, "460": {"act": 3, "region": "Refuse It", "blocks": [{"t": "p", "h": "<p>You get behind a door.<\/p>"}, {"t": "p", "h": "<p>Specifically: you go up the square hammering on shutters and shouting the same four words at every window, <i>stay in, bar it, stay in, bar it<\/i>, and then you go through the scullery of the Broken Wheel where Mara Tullamore has left the latch off every night for a year, and you drop the bar behind you, and you sit down on the floor of the common room with your back against the wood.<\/p>"}, {"t": "p", "h": "<p>Mara is already sitting against the front door. She looks at you.<\/p>"}, {"t": "p", "h": "<p>\"Two of us, then,\" she says.<\/p>"}, {"t": "p", "h": "<p>Your lantern goes on the bar, lit, and stays lit until dawn, because a barred common room with the lamp out is not something either of you is prepared to sit in. <b>The lamp drinks a unit of oil.<\/b><\/p>", "ops": [{"op": "oil", "d": -1}]}, {"t": "cond", "kind": "lampdark", "h": "<p>Mara feeds the fire instead, all night, one log at a time.<\/p>"}, {"t": "choice", "label": "Continue", "target": "461"}]}, "461": {"act": 3, "region": "Refuse It", "blocks": [{"t": "p", "h": "<p>It comes up the square about twenty minutes later.<\/p>"}, {"t": "p", "h": "<p>You hear it go along the row, unhurried, and you hear it try every door on the way, not violently, just a hand on a latch and then moving on, and you hear about a dozen households in Brackenford discover in real time what it sounds like when somebody tests your door at four in the morning.<\/p>"}, {"t": "p", "h": "<p>Nobody opens. Nobody in this village has ever once been embarrassed about a barred door, and tonight that is what saves them.<\/p>"}, {"t": "choice", "label": "Continue", "target": "462"}]}, "462": {"act": 3, "region": "Refuse It", "blocks": [{"t": "p", "h": "<p>Then it comes to the Wheel and it starts on the voices.<\/p>"}, {"t": "p", "h": "<p>It does Tobin first, because it knows what worked. It stands out there in the frost and it asks Mara to let him in, in his voice, warmly, and it uses every small domestic thing a man knows about his own house, because it was listening the first time and it has learned.<\/p>"}, {"t": "p", "h": "<p>Mara Tullamore sits with her back against her own front door and her hands flat on the boards and does not move.<\/p>"}, {"t": "cond", "kind": "has", "h": "<p><i>She has done this once tonight already and she does not need you for it.<\/i><\/p>", "arg": "DOORHELD"}, {"t": "cond", "kind": "other", "h": "<p><i>If you fight with a shield:<\/i> you set it against the boards and put your shoulder behind it out of pure drilled habit, and then you spend four hours learning there is never any weight on the other side. It does not push. It does not lean. It only ever asks.<\/p>"}, {"t": "choice", "label": "Sit with her", "target": "463"}, {"t": "choice", "label": "Talk to it through the door", "target": "464"}]}, "463": {"act": 3, "region": "Refuse It", "blocks": [{"t": "p", "h": "<p>You sit with her.<\/p>"}, {"t": "p", "h": "<p>You do not say anything, because there is nothing to say, and at some point in the second hour she puts her hand out flat on the floor between you, palm down, and you put yours next to it, not touching, and that is the entire conversation.<\/p>"}, {"t": "p", "h": "<p>Outside, it works through the voices it has. Tobin. Doran. Anselm's careful liturgical cadence. A child. Hett Vance, which is when your stomach drops, because he is not behind a door tonight, and you will not know whether it is only borrowing his voice until you find him at sunrise.<\/p>"}, {"t": "p", "h": "<p>It never gets angry. That is the part you will tell people about and they will not understand: it never once got angry. It stood outside a door for four hours being reasonable.<\/p>"}, {"t": "choice", "label": "Continue", "target": "465"}]}, "464": {"act": 3, "region": "Refuse It", "blocks": [{"t": "p", "h": "<p>\"You're wasting a night,\" you tell it through the wood.<\/p>"}, {"t": "p", "h": "<p>\"I've got the night,\" it says. \"That is precisely what I've got and it is the only thing I have ever had. You have four hours of standing between me and a door, and I have every winter there will ever be.\" A pause. \"I don't say that to frighten you. I say it because you seem to think this is a contest.\"<\/p>"}, {"t": "p", "h": "<p>\"It's not a contest,\" you say. \"It's a door.\"<\/p>"}, {"t": "p", "h": "<p>It thinks about that.<\/p>"}, {"t": "p", "h": "<p>\"Yes,\" it says. \"All right. That is fair.\"<\/p>"}, {"t": "choice", "label": "Continue", "target": "465"}]}, "465": {"act": 3, "region": "Refuse It", "blocks": [{"t": "p", "h": "<p>At some point the voices stop.<\/p>"}, {"t": "p", "h": "<p>Neither of you notices when. You work it out afterward, comparing memories, and your two guesses are half an hour apart.<\/p>"}, {"t": "p", "h": "<p>The light comes up grey behind the shutters, and Mara Tullamore gets up off the floor of her own inn, and puts the bar up, and opens the door on an empty square with frost on it and no prints in the frost at all.<\/p>"}, {"t": "p", "h": "<p>Then she goes and takes the clean mug off the table by the fire and puts it back on the rail behind the bar, where it lives.<\/p>"}, {"t": "choice", "label": "Continue", "target": "520"}]}, "480": {"act": 3, "region": "Go And Get Her", "blocks": [{"t": "p", "h": "<p>You go across the ice.<\/p>"}, {"t": "p", "h": "<p>Hett Vance shouts your name once. You do not stop, because there is a six-year-old in a nightshirt somewhere in the Drowned Lane and everything else in this village is behind a door, and this is you breaking rule three, the one Hett gave you in plain words at dusk, and you knew exactly which rule it was when you took the first step.<\/p>"}, {"t": "p", "h": "<p>At the edge of the ice you turn the wick up as far as it goes, because whatever is over there, you want it to see the watch coming. <b>The lamp drinks a unit of oil.<\/b><\/p>", "ops": [{"op": "oil", "d": -1}]}, {"t": "cond", "kind": "lampdark", "h": "<p>You cross with no light, the ice reads as one grey sheet, and your checks in the Drowned Lane are made at disadvantage until you find light.<\/p>"}, {"t": "p", "h": "<p>The Wend under your boots is a grey floor that creaks and does not give. You pass within fifteen feet of the thing wearing Doran Welk. It does not stop you. It turns its head and watches you go by with an expression of mild professional interest, the way a man watches somebody else's dog run off.<\/p>"}, {"t": "choice", "label": "Continue", "target": "481"}]}, "481": {"act": 3, "region": "Go And Get Her", "blocks": [{"t": "p", "h": "<p>The Drowned Lane is a row of half-sunk houses with reeds growing through the floors, and it has been empty for a generation, and it is not empty.<\/p>"}, {"t": "p", "h": "<p>The larder is the first thing you find, by lamplight or by the grey coming up off the ice: the line of broken reed-stems and fence-posts along the bank with small neat corpses pushed down onto the points, and it is longer than it was at dusk, and there is nothing on the newest stake yet.<\/p>"}, {"t": "p", "h": "<p>The nothing on the newest stake is the best thing you have ever seen.<\/p>"}, {"t": "choice", "label": "Continue", "target": "482"}]}, "482": {"act": 3, "region": "Go And Get Her", "blocks": [{"t": "p", "h": "<p>She is in the third house along, in the one with the light.<\/p>"}, {"t": "p", "h": "<p>It is not a light. You worked that out on the bridge hours ago and you are only now standing close enough to see what it actually is: the walls of that room are furred an inch thick with hoarfrost, floor to ceiling, and your lantern is coming back off all of it at once.<\/p>"}, {"t": "p", "h": "<p>The child is sitting in the middle of the floor with her arms around her knees. She is grey with cold and she is alive and her eyes track you when you come through the door.<\/p>"}, {"t": "p", "h": "<p>Above her, in the rafters, something shifts its weight.<\/p>"}, {"t": "choice", "label": "Continue", "target": "483"}]}, "483": {"act": 3, "region": "Go And Get Her", "blocks": [{"t": "p", "h": "<p>The rafters above you move, twice, and you understand that they were here the whole time. This is a fight in a close dark room, with a child on the far side of it. <b>Roll initiative.<\/b> Here is the nest.<\/p>"}, {"t": "p", "h": "<p><b>FEN-SHRIKE (two)<\/b><\/p>"}, {"t": "p", "h": "<p>Medium beast. AC 13. Speed 30 ft., fly 50 ft. HP as the Watch Lamp line below.<br><b>Beak.<\/b> Melee attack, +5 to hit, reach 5 ft. Hit: 1d8+3 piercing damage.<br><b>Silent Rush.<\/b> Advantage on its first attack roll against a creature that has not yet acted in combat.<\/p>", "card": true}, {"t": "p", "h": "<p><b>How the nest fights.<\/b><br>This is a nest, not a hunt, and the roles are different here.<br>Round 1: both drop from the rafters. The first attacks you with Silent Rush. The second lands between you and the child and does not attack at all: it stands over her with its beak lowered, and it will attack the instant you move toward her.<br>Round 2 onward: the attacker fights normally and does not withdraw. This is their larder and they are not giving it up.<br>On Dark Watch, the third shrike drops from the rafters on round three and attacks whoever is nearest. It shares the pair's morale: when they break, all three break together.<br>The guard never leaves the child and never pursues. If you drop the attacker, the guard fights on alone from where it stands.<\/p>", "card": true}, {"t": "cond", "kind": "nell", "h": "<p>The guard cannot watch both of you, and Nell knows which of you is the distraction. Your check to get past the guard to the child is made with advantage.<\/p>"}, {"t": "p", "h": "<p>If you get the child behind you (your action and a successful DC 13 Dexterity (Acrobatics) or Strength (Athletics) check to get past the guard, or simply killing it), they break for the moor within one round: the pair on Ember and Lantern, all three on Dark.<br><b>If you retreat:<\/b> you can leave. The door is behind you and nothing in this room follows you through it. The guard does not move. The child does not make a sound. Go to <a class=\"eref\" data-go=\"486\">486<\/a>, and know that you walked out.<br><b>Fail-forward:<\/b> if you drop to 0 hit points here on Ember or Lantern, you do not die. Go to <a class=\"eref\" data-go=\"486\">486<\/a>. On Dark Watch, a death here is a death: go to <a class=\"eref\" data-go=\"535\">535<\/a>.<\/p>"}, {"t": "lamp", "ember": "14 HP each; the guard is slow to react and you may take the child on round two without a check.", "lantern": "22 HP each.", "dark": "22 HP each, and there is a third in the rafters that drops on round three."}, {"t": "cond", "kind": "other", "h": "<p><i>If you win:<\/i> → <a class=\"eref\" data-go=\"484\">484<\/a><\/p>", "target": "484"}, {"t": "cond", "kind": "other", "h": "<p><i>If you go down on Ember or Lantern:<\/i> → <a class=\"eref\" data-go=\"486\">486<\/a><\/p>", "target": "486"}, {"t": "cond", "kind": "other", "h": "<p><i>If you go down on Dark Watch:<\/i> → <a class=\"eref\" data-go=\"535\">535<\/a><\/p>", "target": "535"}], "failFwd": "486", "ffShared": true}, "484": {"act": 3, "region": "Go And Get Her", "blocks": [{"t": "p", "h": "<p>You get her up inside your coat with her face against your collarbone and her hands like ice on your neck, and she does not make a sound the entire way, which is worse than screaming.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you have a healing spell or a healer's kit:<\/i> you do what you can for her one-handed while you walk, and it helps, and it is nowhere near enough, because the cold is not in one place where a spell can go and find it. So you put her hands inside your shirt against your own skin as well. Somewhere over the middle of the ford they start to hurt her, and hurting is exactly what you wanted.<\/p>"}, {"t": "p", "h": "<p>Going back across the ford is the longest four minutes of your life. Halfway over you pass the thing wearing Doran Welk again, standing on the ice in the middle of the crossing, facing the village.<\/p>"}, {"t": "p", "h": "<p>It looks at the shape inside your coat.<\/p>"}, {"t": "p", "h": "<p>\"That one wasn't mine,\" it says. \"Those are just birds. They come because I do.\" A pause, and then, and you will think about this for years: \"Not everything in the dark is me, watchman. You'd all be a great deal safer if it were.\"<\/p>"}, {"t": "choice", "label": "Continue", "target": "485"}]}, "485": {"act": 3, "region": "Go And Get Her", "blocks": [{"t": "p", "h": "<p>You get her to the near bank and up the slope and Hett Vance takes her off you at the top without a word, and somewhere behind you the ice starts complaining again as the thing goes back the way it came, unhurried, because dawn is coming and it has all the winters there will ever be.<\/p>"}, {"t": "p", "h": "<p>The mother is at a door with her arms out and her mouth open and no sound coming.<\/p>"}, {"t": "p", "h": "<p><b>The dawn will read this: CARRIED.<\/b><\/p>", "ops": [{"op": "grant", "words": ["CARRIED"], "mark": true}]}, {"t": "choice", "label": "Continue", "target": "520"}]}, "486": {"act": 3, "region": "Go And Get Her", "blocks": [{"t": "cond", "kind": "other", "h": "<p><i>If you walked out:<\/i> you get as far as the doorway before you understand you are not going to be able to live with it, and you turn around, and that is when the floor comes up at you.<\/p>"}, {"t": "p", "h": "<p>One way or the other, you go down in a frozen room in an abandoned house with a child six feet away.<\/p>"}, {"t": "p", "h": "<p>What wakes you is being dragged. Hett Vance came across that ice after you, alone, in the dark, because of course he did, and he has got you by the collar of your coat and the child under his other arm and he is hauling both of you toward the door.<\/p>"}, {"t": "p", "h": "<p>\"Rule three,\" he says through his teeth. \"Rule three, you great idiot, you come and get me.\"<\/p>"}, {"t": "p", "h": "<p>Take one level of exhaustion and <b>The dawn will read this: CARRIED and SCARRED.<\/b><\/p>", "ops": [{"op": "grant", "words": ["CARRIED", "SCARRED"], "mark": true}]}, {"t": "choice", "label": "Continue", "target": "485"}]}, "500": {"act": 3, "region": "Stand The Watch", "blocks": [{"t": "p", "h": "<p>You do not have a plan.<\/p>"}, {"t": "p", "h": "<p>You have a lantern with about two hours of oil in it, a bell-clapper, a tabard that belonged to somebody else, and a route: up from the ford through the square, along the top past the inn, down the back by Greel's yard, out to the broken bridge, and back to the water.<\/p>"}, {"t": "p", "h": "<p>So you walk it.<\/p>"}, {"t": "p", "h": "<p><b>The lamp drinks a unit of oil.<\/b> The round takes what the round takes.<\/p>", "ops": [{"op": "oil", "d": -1}]}, {"t": "cond", "kind": "lampdark", "h": "<p>You walk the round with no light, and the thing keeps you company at ten feet instead of thirty, which it appears to consider polite.<\/p>"}, {"t": "choice", "label": "Continue", "target": "501"}]}, "501": {"act": 3, "region": "Stand The Watch", "blocks": [{"t": "p", "h": "<p>It follows you.<\/p>"}, {"t": "p", "h": "<p>Not closely. It walks the round with you at about thirty feet, on the other side of the street, in a dead man's coat, keeping pace, and at the first post it stops when you stop and waits while you ring in.<\/p>"}, {"t": "p", "h": "<p>Two strokes, brass on brass, out over the shuttered roofs.<\/p>"}, {"t": "p", "h": "<p>\"Why do you do that?\" it asks.<\/p>"}, {"t": "choice", "label": "\"So they know I'm here.\"", "target": "502"}, {"t": "choice", "label": "Don't answer. Ring the next post", "target": "503"}]}, "502": {"act": 3, "region": "Stand The Watch", "blocks": [{"t": "p", "h": "<p>\"So they know I'm here.\"<\/p>"}, {"t": "p", "h": "<p>\"They're asleep.\"<\/p>"}, {"t": "p", "h": "<p>\"Some of them.\" You start walking. \"Some of them are lying awake listening for it, and they'll hear it, and they'll go back to sleep. That's the job.\"<\/p>"}, {"t": "p", "h": "<p>It considers this for most of a street.<\/p>"}, {"t": "p", "h": "<p>\"That is a very small job,\" it says at last, and it is not being cruel, it is genuinely appraising the size of it.<\/p>"}, {"t": "p", "h": "<p>\"Yes,\" you say.<\/p>"}, {"t": "choice", "label": "Continue", "target": "503"}]}, "503": {"act": 3, "region": "Stand The Watch", "blocks": [{"t": "p", "h": "<p>You walk the round.<\/p>"}, {"t": "p", "h": "<p>You do it four times between three and dawn, which is more than the schedule asks for, and you ring in at every post every time, and the thing walks it with you and does not touch you, because you are not on the list and it is, in its way, extremely well organised.<\/p>"}, {"t": "p", "h": "<p>Somewhere in the third circuit it says, \"You know I'll be back within the month.\"<\/p>"}, {"t": "p", "h": "<p>\"I know.\"<\/p>"}, {"t": "p", "h": "<p>\"And you'll be doing this.\"<\/p>"}, {"t": "p", "h": "<p>\"Yes.\"<\/p>"}, {"t": "choice", "label": "Continue", "target": "504"}]}, "504": {"act": 3, "region": "Stand The Watch", "blocks": [{"t": "check", "dc": 13, "ability": "Constitution", "skill": null, "kind": "save", "h": "<p><i>Make a DC 13 Constitution saving throw. Ember Watch: DC 10. Dark Watch: DC 15.<\/i><\/p>", "tdc": {"ember": 10, "dark": 15}}, {"t": "outcome", "which": "success", "blocks": [{"t": "p", "h": "<p>You are still upright. Cold has got into your hands and you cannot feel the clapper, so you hold it in your fist and swing your whole arm.<\/p>"}]}, {"t": "outcome", "which": "failure", "blocks": [{"t": "p", "h": "<p>Take 1d6 cold damage and one level of exhaustion. You go down on one knee at the Greel's Yard post, and you get up, and you ring it, and the sound is fine, and that is the only part anybody else will ever hear.<\/p>"}, {"t": "p", "h": "<p><b>Fail-forward:<\/b> if that leaves you at 0 hit points on Ember or Lantern, you finish the round on your hands and knees between the last two posts, and Goodwife Alder's door opens at the exact moment you need it to, which is the only time in her life she will admit to having been awake. Write the dawn mark <span class=\"cw\">SCARRED<\/span> and go on to <a class=\"eref\" data-go=\"505\">505<\/a>. On Dark Watch, a watchman who goes down on the round in that cold is not getting up: go to <a class=\"eref\" data-go=\"535\">535<\/a>.<\/p>", "ops": [{"op": "grant", "words": ["SCARRED"], "mark": true}]}, {"t": "cond", "kind": "other", "h": "<p><i>If you have Second Wind:<\/i> somewhere in the fourth hour you reach for it out of habit, and it is there, and it will buy you a breath and nothing else, because it was built for the worst thirty seconds of a fight and this is not a fight, it is a schedule. Spend it or do not. The round is the same length either way.<\/p>"}]}, {"t": "choice", "label": "Continue", "target": "505"}], "failFwd": "505", "ffShared": true, "own": {"505": "failure", "535": "failure"}}, "505": {"act": 3, "region": "Stand The Watch", "blocks": [{"t": "p", "h": "<p>On the last circuit, at the bridge post, it is not with you.<\/p>"}, {"t": "p", "h": "<p>You ring in and turn around and the street behind you is empty and grey, and you understand two things at once: that the light has been coming up for some time, and that you did not see it go.<\/p>"}, {"t": "p", "h": "<p>There are no prints in the frost.<\/p>"}, {"t": "choice", "label": "Continue", "target": "520"}]}, "520": {"act": 3, "region": "Dawn", "blocks": [{"t": "p", "h": "<p>The sun comes up over the Hollow Marches at about seven, and it is a plain, ordinary, entirely unremarkable winter sunrise, and there is not one person in Brackenford who will ever be able to explain to an outsider why they cried at it.<\/p>"}, {"t": "p", "h": "<p>The ford thaws by nine. It does it fast, the way it froze: the grey floor goes to slush and then to brown water sliding over flat stones, loud again, and the sound of it coming back is the sound of the village letting out a breath it has been holding since dusk.<\/p>"}, {"t": "p", "h": "<p>Doran Welk's chair is still lying on its side on the bank. Somebody sets it upright.<\/p>"}, {"t": "choice", "label": "Continue", "target": "521"}]}, "521": {"act": 3, "region": "Dawn", "blocks": [{"t": "p", "h": "<p><i>This is your night. Read the lines you have earned.<\/i><\/p>"}, {"t": "cond", "kind": "has", "h": "<p>You fought something on the round tonight, close enough to feel it, and you have not thought about it once since it happened. You will, in about a week, at an inconvenient moment. When it comes, let it come, and let it pass, because it does pass. Standing between this village and a hunting thing is a weight a person can carry.<\/p>", "arg": "BLOODED"}, {"t": "cond", "kind": "has", "h": "<p>The child from the wellhead is asleep in her own bed and will remember none of this correctly, and her mother will remember all of it, and will not be able to say a word to you for eleven days and will then say far too many at once. Every one of those words will amount to thank you.<\/p>", "arg": "SHELTERED"}, {"t": "cond", "kind": "has", "h": "<p>You went across the ice for one person and left a whole village behind a door to do it. Hett Vance will have opinions about that for the rest of his life, and he has not managed to say a single one of them out loud yet, because the girl is alive. That is the whole argument, and you won it.<\/p>", "arg": "CARRIED"}, {"t": "cond", "kind": "has", "h": "<p><i>Ada Charlock's name is not read at the counting, because her mother cannot stand to hear it and the village cannot stand to say it. You keep the watch anyway, every night after. Both of those facts are yours to carry now, and carrying them is the job.<\/i><\/p>", "arg": "TAKEN", "chain": true}, {"t": "cond", "kind": "has", "h": "<p>Brother Anselm slept for the first time in thirty days because you told him to, and woke without knowing what the night had done to the village he let go of. He has not said thank you. He has opened the doors. The shrine takes its first morning congregation in a month, and you sleep through the whole service, and he does not let anyone wake you.<\/p>", "arg": "RELIEVED"}, {"t": "cond", "kind": "has", "h": "<p>Mara Tullamore put the clean mug back on the rail behind the bar. She has not set it out since. She will not discuss it. But your drink is poured before you reach the bar now, every night, and that is the discussion.<\/p>", "arg": "DOORHELD"}, {"t": "cond", "kind": "has", "h": "<p>You know the number. You are one of five people alive who does, and by noon Goodwife Alder will know that you know, because Goodwife Alder always knows, and there will be an invitation to tea. Go. She does not waste tea, and this village is about to need the two of you agreeing on what happens next.<\/p>", "arg": "TOLLPAID"}, {"t": "cond", "kind": "has", "h": "<p>Whatever it took out of you, it did not take all of it, and you got up. What it left on you is not a wound. It is a receipt, and the village reads it every time you pass, and stands you drinks accordingly.<\/p>", "arg": "SCARRED"}, {"t": "cond", "kind": "has", "h": "<p>You knew before anyone. By noon the whole village knows you knew, because Doran's chair was empty and somebody asked who saw the ford last, and the answer was the new watchman, at dusk, on his first round. Nobody says lucky. Everybody thinks it.<\/p>", "arg": "ICEBOUND"}, {"t": "cond", "kind": "has", "h": "<p>Six men come back from Aldermere in the spring, and Hett Vance meets them at the ford and does not explain the year, and none of them asks, and all of them look at you a moment too long. He spent his militia to keep them alive. You are the only one who knows it was spending.<\/p>", "arg": "VOUCHED"}, {"t": "cond", "kind": "has", "h": "<p>You carried the story of the clean mug through the whole of the night, and tonight the village learned what Mara Tullamore had known for a year. At noon she sets a plate in front of you that you did not order, and neither of you says a word about it, and that is how the two of you will discuss it forever.<\/p>", "arg": "MUGSET"}, {"t": "cond", "kind": "has", "h": "<p>Bryn is back in Greel's yard by eight, stacking crates, twelve years old and the only other soul who saw it coming and tried to say so. You nod to him over the fence on your next round. The nod he gives back is one watchman to another.<\/p>", "arg": "WITNESS"}, {"t": "cond", "kind": "has", "h": "<p>Within the week you write the warning out fresh, in your own hand, and nail it to the notice board yourself: <i>do not be on the far bank when it stops.<\/i> You did not understand it when the night began. You understand it completely now, and the next watchman is going to need it.<\/p>", "arg": "BLACKNAIL"}, {"t": "cond", "kind": "has", "h": "<p>You stood at a shut door at dusk and made a frightened man on the other side of it feel spoken to. You will keep that habit for the rest of your life, and it will save it twice.<\/p>", "arg": "HANDSIGN"}, {"t": "cond", "kind": "has", "h": "<p>On the third morning you cross the ford with Hett and a torch and burn the stakes in the Drowned Lane down to the mud, and neither of you says anything over them, and it is a funeral anyway.<\/p>", "arg": "LARDER"}, {"t": "cond", "kind": "nell", "h": "<p>She sleeps for a day and a half in front of the Broken Wheel's fire, and wakes up a village dog: fed at five doors, owned at none, and on the round every night after, with whoever carries the lamp.<\/p>"}, {"t": "choice", "label": "Continue", "target": "522"}]}, "522": {"act": 3, "region": "Dawn", "blocks": [{"t": "p", "h": "<p>They bury Doran Welk on the third day, and the whole village comes, including the ones who spent a year calling him a thief to his face over a copper.<\/p>"}, {"t": "p", "h": "<p>Goodwife Alder speaks. She is gracious and warm and says almost nothing, and it is the single most careful piece of work you have ever watched anybody do, and at the end of it she catches your eye across the grave for about half a second.<\/p>"}, {"t": "p", "h": "<p>Afterward, Hett Vance walks you back down the hill.<\/p>"}, {"t": "choice", "label": "Continue", "target": "523"}]}, "523": {"act": 3, "region": "Dawn", "blocks": [{"t": "p", "h": "<p>\"There's a tabard going spare,\" he says. \"Doran's size. Bit big on you.\"<\/p>"}, {"t": "p", "h": "<p>\"That's not funny.\"<\/p>"}, {"t": "p", "h": "<p>\"No,\" he agrees. \"I've been up all night for two nights and I've stopped being able to tell.\" He stops walking. \"I'm asking, though. Properly. There's supposed to be six of us and there's one, and last night there were two, and I would very much like there to be two again.\"<\/p>"}, {"t": "choice", "label": "Take it", "target": "524"}, {"t": "choice", "label": "Ask him something first", "target": "525"}, {"t": "choice", "label": "Say no", "target": "526"}]}, "524": {"act": 3, "region": "Dawn", "blocks": [{"t": "p", "h": "<p>You take the tabard.<\/p>"}, {"t": "p", "h": "<p>It is too big and it belonged to a broad, tired man who tested every coin against his teeth and carried a box up a hill for a village that resented him for it, and you will wear it for the next eleven years.<\/p>"}, {"t": "choice", "label": "Continue", "target": "530"}]}, "525": {"act": 3, "region": "Dawn", "blocks": [{"t": "p", "h": "<p>\"How long have we got?\"<\/p>"}, {"t": "p", "h": "<p>\"Before it's back?\" Hett looks up at the hill, at the square black shape of Caer Brack against a clean cold morning sky. \"Within the month, if Sefa's count is right, and her count has not been wrong in thirty years. And here is the thing about it that nobody's ready for. It doesn't lie. It just waits until you've stopped being able to bear it and then it's reasonable at you.\"<\/p>"}, {"t": "p", "h": "<p>He shrugs.<\/p>"}, {"t": "p", "h": "<p>\"Sefa'll say two weeks. Alder'll say we've time. Anselm's got his doors open, which he hasn't in a month, so make of that what you like.\" He starts walking again. \"So: not long. Are you in?\"<\/p>"}, {"t": "choice", "label": "Take it", "target": "524"}, {"t": "choice", "label": "Say no", "target": "526"}]}, "526": {"act": 3, "region": "Dawn", "blocks": [{"t": "p", "h": "<p>You say no, and Hett Vance takes it exactly the way you would want a man to take it, which is to say completely, immediately, and without a single word of argument.<\/p>"}, {"t": "p", "h": "<p>\"Right,\" he says. \"Then thank you. I'll not pretend I'm not sorry.\"<\/p>"}, {"t": "p", "h": "<p>You give him back the lantern at the bottom of the hill.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you can cast a light cantrip:<\/i> you walk the last of it home by your own light, which is a small thing and not nothing, and you will think about the difference between a light you carry and a light you were handed for a long time after tonight.<\/p>"}, {"t": "p", "h": "<p>You are two streets away when you hear him, out of sight, announcing the hour to an empty street the way he has done for a year, and you stop walking, and you stand there in the road for a long moment.<\/p>"}, {"t": "p", "h": "<p>The book is not going to tell you what you did next. That one is yours.<\/p>"}, {"t": "choice", "label": "Continue", "target": "530"}]}, "530": {"act": 3, "region": "Dawn", "blocks": [{"t": "p", "h": "<p><b>Here ends the night watch.<\/b><\/p>"}, {"t": "p", "h": "<p>You were the watch for one night, on the night the ford froze, and you did not beat anything. There is nothing under the hill that is any weaker this morning than it was yesterday.<\/p>"}, {"t": "cond", "kind": "has", "h": "<p>The stair you stood ninety yards from is still swept, and the candle at the bottom of it is still burning, and you are one of the few people alive who can say so. The debt still stands however you left it at the ford this morning, and somewhere out on the moor an old woman is counting stones and getting an answer she does not like.<\/p>", "arg": "TOLLPAID"}, {"t": "p", "h": "<p>But the village woke up.<\/p>"}, {"t": "p", "h": "<p>That is the whole of it, and it is not nothing, and Hett Vance was right about the size of the job and wrong about what it is worth.<\/p>"}, {"t": "p", "h": "<p><b>THE END.<\/b><\/p>", "end": true}, {"t": "p", "h": "<p><i>You can play this night again. Take a different route at dusk, keep different company in the dead hours, and stand somewhere else when it comes across the ice. There are four other endings and none of them is the correct one.<\/i><\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you would rather keep going, turn to <b>Appendix A: After the Dawn<\/b>, and keep playing Brackenford freehand. The village has two weeks of quiet at most before the cold tries again, and now you know what walks it.<\/i><\/p>"}]}, "535": {"act": 3, "region": "Dawn", "blocks": [{"t": "p", "h": "<p><b>Dark Watch only.<\/b><\/p>"}, {"t": "p", "h": "<p>You do not come back at dawn.<\/p>"}, {"t": "p", "h": "<p>They find you at first light, wherever the night left you. However it took you, the cold got there first: there is frost in the seams of your coat and packed white in the folds of your ears, and the ground beneath you never thawed.<\/p>"}, {"t": "p", "h": "<p>Hett Vance carries you up the slope himself and will not let anybody take the other end.<\/p>"}, {"t": "p", "h": "<p>They bury you on the third day, next to Doran Welk, and the whole village comes. Goodwife Alder speaks. She is gracious and warm and says almost nothing, and she does not catch anybody's eye.<\/p>"}, {"t": "cond", "kind": "has", "h": "<p>They find the list folded in your coat when they lay you out, and so the village finally learns its own number, and what its watchman spent the last night carrying. Goodwife Alder keeps the paper. Nobody votes on that.<\/p>", "arg": "TOLLPAID"}, {"t": "cond", "kind": "has", "h": "<p>Mara Tullamore bars the Broken Wheel at dusk for a year to the day, and opens it again every dawn, and that is her attendance at your grave, and it does not miss once.<\/p>", "arg": "DOORHELD"}, {"t": "cond", "kind": "has", "h": "<p>Brother Anselm rings the dusk bell and the dawn bell without missing, and adds one extra stroke to each, and never explains it, and nobody in Brackenford ever has to ask.<\/p>", "arg": "RELIEVED"}, {"t": "cond", "kind": "has", "h": "<p>Hett Vance writes six letters to Aldermere that winter and burns five of them. The one he sends says only: <i>the errand is over. It has a watchman's name now. Come home.<\/i><\/p>", "arg": "VOUCHED"}, {"t": "cond", "kind": "nell", "h": "<p>Nell will not leave the churchyard for two days. Then she walks your round, alone, on schedule, every night, and the village feeds her at five doors for the rest of her life, and nobody ever calls her anything but the watchman's dog.<\/p>"}, {"t": "cond", "kind": "has", "h": "<p>The ledger is settled, or near enough that the village will pretend it is. Brackenford gets a quiet winter, the ford runs all season, and in the spring the children paddle in it.<\/p>", "arg": "TOLLPAID"}, {"t": "cond", "kind": "else", "h": "<p><i>Nothing is settled. The count is whatever it was before you went out, less one, and the village does not know the number and will not learn it from you. Somebody else will walk the round tomorrow night and the night after that.<\/i><\/p>", "chain": true}, {"t": "cond", "kind": "has", "h": "<p>There is a six-year-old on the far bank that nobody has gone for, and Hett Vance goes across the ice himself the moment they have carried you up the slope, and whatever he finds over there he never once describes.<\/p>", "arg": "TAKEN"}, {"t": "p", "h": "<p>You were the watch for one night. However the night took you, it was the night that took you: the cold counts what it collects, and it collected you. Eleven was always going to be somebody.<\/p>"}, {"t": "p", "h": "<p><b>THE END.<\/b><\/p>", "end": true}, {"t": "p", "h": "<p><i>Bury the watchman properly, then make another one and go back to <a class=\"eref\" data-go=\"001\">001<\/a>. The night runs differently for a different person, and Brackenford is going to need somebody on the round again in about two weeks.<\/i><\/p>"}]}}, "start": "001"}</script>

let S=null; // run state

 clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2600);}
function mod(v){return Math.floor((v-10)/2)}

/* ---------------- state ops ---------------- */
function teach(key,extra){if(!S.taught)S.taught={};if(S.taught[key])return "";S.taught[key]=1;return extra}
function grant(words,mark){words.forEach(w=>{const list=mark?S.marks:S.cw;
 if(w==="SHELTERED"&&S.cw.includes("TAKEN"))return;
 if(w==="TAKEN"&&S.cw.includes("SHELTERED"))return;
 if(!list.includes(w)){list.push(w);
  toast((mark?"The dawn will read this: ":"The night remembers: ")+'<span class="cw">'+w+"</span>"
   +teach("cw","<br><small>Codewords are the night's memory. The file writes them for you, and later entries change because you carry them.</small>"));}});save();render();}
function tick(n){if(S.dawn>=12)return; // dawn is already here; the night stops counting
 S.dawn=Math.min(12,S.dawn+n);
 if(S.dawn>=12){toast("The twelfth box is ticked. <b>The last of the dark is running out.</b> Finish the scene you are in, then follow the banner above: the thing at the ford is done waiting.");save();render();return}
 toast("The Dawn Track ticks. "+(12-S.dawn)+" of the night remains."
  +teach("dawn","<br><small>The Dawn Track measures the night. Twelve ticks and dawn arrives wherever you stand. The file ticks it for you; watch the bar above.</small>"));save();render();}
function oil(d){if(d<0&&S.oil===0){toast("The lamp is already dark.");return}
 S.oil=Math.max(0,Math.min(S.oilMax,S.oil+d));

 save();render();} // EVERY state mutator re-renders: a stale HUD is a lie (Codex r5 F3)
function applyOps(ops,key){ops.forEach((o,i)=>{const k=key+"#"+i;
 if(S.opsDone.includes(k))return;S.opsDone.push(k);
 if(o.op==="grant")grant(o.words,o.mark);
 if(o.op==="tick")tick(o.n);
 if(o.op==="oil")oil(o.d);});save();}

/* ---------------- navigation ---------------- */
function actOf(no){const e=NW.entries[no];return e?e.act:1}
function goto(no){let e=NW.entries[no];if(!e){toast("No entry "+no);return}
 // the full Dawn Track forces the finale: leaving your current ground pre-Act-3
 // routes to 312 (the ice starts talking; Hett comes back to stand with you)
 if(S.dawn>=12&&e.act<3&&!["310","311","312","313","314","315"].includes(no)
    &&NW.entries[S.at]&&e.region!==NW.entries[S.at].region&&!S.acted.dawnforced){
  S.acted.dawnforced=1;toast("Dawn is here. The night ends where you stand: the ford.");
  no="312";e=NW.entries[no];}
 const prevAct=actOf(S.at);S.at=no;
 S.lastRoll=null; // "the d20 you just rolled" expires when you walk away from it
 if(!S.seen.includes(no))S.seen.push(no);
 S.journal.push(no);
 const a=e.act;
 if(!S.actSeen.includes(a)){S.actSeen.push(a);
  const t=TIERS[S.tier];S.thp=t.thp(3);
  if(S.thp>0)toast("A new watch begins. Temporary hit points: "+S.thp);
  if(a>1)toast("You may change your Watch Lamp at any rest. Menu &rarr; Night Sheet.");}
 if(no==="090")S.acted.cold=1;
 if(no==="220"&&!S.acted.hubCap)S.acted.hubCap=TIERS[S.tier].visits;
 if(no==="220"&&S.hubUsed===0)toast("The dead hours: "+TIERS[S.tier].visits+" visits before the night moves on.");
 window.scrollTo(0,0);save();render();}
function hubVisit(target){if(["230","250","270","290"].includes(target)){
  if(!S.acted["hub"+target]){S.acted["hub"+target]=1;S.hubUsed++;}}
 goto(target);}

function customForm(){const c=SET.custom||(SET.custom={name:"",cls:"",abil:{str:10,dex:10,con:10,int:10,wis:10,cha:10},prof:2,saves:[],skills:[],ac:14,hp:24});

function beginNight(){const t=TIERS[SET.tier];
 const ch=SET.pick==="custom"?SET.custom:JSON.parse(JSON.stringify(PREGENS[SET.pick]));
 if(SET.pick!=="custom")ch.blurbUsed=1;
 S.tier=SET.tier;S.ch=ch;S.nell=SET.nell;S.oilMax=t.oil;S.oil=t.oil;S.rekMax=t.rekindle;S.rek=t.rekindle;
 S.hp=ch.hp;S.thp=0;S.screen="play";S.at=NW.start;S.seen=["001"];S.journal=["001"];
 S.actSeen=[1];S.thp=t.thp(3);save();render();

function hudHTML(){const t=TIERS[S.tier];
 const pips=(n,max,cls)=>Array.from({length:max},(_,i)=>`<span class="pip ${cls} ${i<n?"on":""}"></span>`).join("");
 return `<div id="hud">

   <button style="font-size:12px;padding:2px 8px" onclick="adjHP(-1)">&minus;</button><button style="font-size:12px;padding:2px 8px" onclick="adjHP(1)">+</button></div>
