<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Night Watchman &middot; a Solo Keeper from the Long Island Dungeon Master</title>
<style>
:root{
  --frame:#211d19; --frame2:#2a251f; --cream:#efe4cd; --cream-dim:#c9bda3;
  --parch:#f2e6c6; --parch2:#e9dab4; --ink:#2a2318; --ink-dim:#5a4d38;
  --gold:#c9a55c; --cold:#9fd8e8; --ember:#e08840; --blood:#a33c2f;
  --ok:#5a7d4a; --bad:#a33c2f;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--frame);color:var(--cream);font:18px/1.65 Georgia,'Iowan Old Style','Palatino Linotype',serif}
#app{max-width:1160px;margin:0 auto;padding:0 16px 90px}
a{color:var(--gold)}
h1,h2,h3,h4{font-weight:normal;letter-spacing:.02em}
.cw{font-variant:small-caps;letter-spacing:.08em;font-weight:bold;color:var(--gold)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid #4a4232;background:var(--frame2);color:var(--cream);padding:8px 14px}
button:hover{border-color:var(--gold)}
button.primary{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:bold}
button:disabled{opacity:.4;cursor:not-allowed}
/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:40;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(#211d19f2,#211d19e6);border-bottom:1px solid #3a332a;padding:8px 4px;backdrop-filter:blur(3px)}
#topbar .brand{font-variant:small-caps;letter-spacing:.1em;color:var(--gold);margin-right:auto}
#topbar button{padding:5px 10px;font-size:15px}
/* ---------- HUD ---------- */
#hud{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--frame2);
  border:1px solid #3a332a;border-radius:10px;padding:8px 12px;margin:10px 0;font-size:15px}
.hudgroup{display:flex;gap:6px;align-items:center}
.hudlabel{color:var(--cream-dim);font-variant:small-caps;letter-spacing:.06em;font-size:13px}
.pip{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid #6a5c40;margin:0 1px;vertical-align:middle}
.pip.on{background:var(--gold);border-color:var(--gold)}
.pip.oil{border-radius:50%}
.pip.oil.on{background:var(--ember);border-color:var(--ember);box-shadow:0 0 6px #e0884066}
.hp{color:var(--cream)} .hp b{color:var(--gold)}
#cwrow{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
.chip{font-size:13px;font-variant:small-caps;letter-spacing:.08em;border:1px solid var(--gold);
  color:var(--gold);border-radius:20px;padding:1px 10px;background:#c9a55c14}
.chip.mark{border-color:var(--cold);color:var(--cold)}
/* ---------- entry ---------- */
.region{color:var(--cream-dim);font-variant:small-caps;letter-spacing:.14em;font-size:14px;margin:18px 2px 0}
.eno{font-size:40px;color:var(--gold);margin:2px 0 10px;font-variant:small-caps}
.entry p{margin:0 0 1em}
.entry i{color:var(--cream-dim)}
.eref{cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--gold)}
.cond{border-left:3px solid var(--gold);padding:2px 0 2px 14px;margin:0 0 1em;background:#c9a55c0d;border-radius:0 8px 8px 0}
.cond p{margin:0}
.cond.ghost{opacity:.45;border-left-color:#4a4232}
.condtag{display:block;font-size:12px;font-variant:small-caps;letter-spacing:.1em;color:var(--gold);opacity:.8}
.card{background:var(--parch);color:var(--ink);border-radius:10px;padding:12px 16px;margin:0 0 1em;
  border:1px solid #c9b183;box-shadow:0 2px 8px #0006}
.card p{margin:0 0 .6em} .card p:last-child{margin:0}
.card i{color:var(--ink-dim)} .card .cw,.card a{color:#7a5a17}
.lampbox{background:var(--parch2);color:var(--ink);border-radius:10px;padding:10px 16px;margin:0 0 1em;border:1px dashed #a98f5c}
.lampbox .tiername{font-variant:small-caps;letter-spacing:.1em;font-weight:bold}
.lampbox .others{font-size:14px;color:var(--ink-dim);margin-top:6px}
.checkbox{background:var(--parch);color:var(--ink);border-radius:10px;padding:12px 16px;margin:0 0 1em;border:1px solid #c9b183}
.checkbox i{color:var(--ink-dim)}
.rollrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.rollrow .dcnote{font-size:14px;color:var(--ink-dim)}
.die{display:inline-block;min-width:44px;text-align:center;font-size:26px;background:#fff9ea;border:2px solid #7a5a17;border-radius:8px;padding:4px 8px;color:var(--ink)}
.die.dim{opacity:.45;text-decoration:line-through}
.rollout{margin-top:8px;font-size:16px}
.rollout .verdict{font-weight:bold;font-variant:small-caps;letter-spacing:.08em}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.outcome{border:1px solid #3a332a;border-radius:10px;padding:10px 14px;margin:0 0 1em}
.outcome .oc-h{font-variant:small-caps;letter-spacing:.1em;color:var(--cream-dim);font-size:14px}
.outcome.hit{border-color:var(--gold);background:#c9a55c0d}
.outcome.dim{opacity:.5;pointer-events:none}
.outcome.pending{opacity:.65;pointer-events:none}
.choices{margin:18px 0 8px;display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:baseline;text-align:left;background:var(--frame2);
  border:1px solid #4a4232;border-radius:10px;padding:10px 14px;width:100%}
.choice:hover{border-color:var(--gold)}
.choice .arr{color:var(--gold)}
.choice .tno{margin-left:auto;color:var(--cream-dim);font-size:14px}
.choice.locked{opacity:.45}
.choice .reqtag{font-size:12px;font-variant:small-caps;color:var(--cream-dim);border:1px dotted #6a5c40;border-radius:10px;padding:0 8px}
/* ---------- panels ---------- */
.panel{position:fixed;inset:0;z-index:60;background:#141210ee;overflow:auto;padding:30px 16px;display:none}
.panel.open{display:block}
.panel .inner{max-width:860px;margin:0 auto;background:var(--frame2);border:1px solid #4a4232;border-radius:14px;padding:24px 28px}
.panel h3{color:var(--gold);margin-top:0}
.panel table{border-collapse:collapse;margin:10px 0;width:100%}
.panel td,.panel th{border:1px solid #4a4232;padding:5px 9px;text-align:left;font-size:15px}
.panel .close{float:right}
.setuprow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.tiercard,.pcard{flex:1 1 240px;background:var(--frame);border:1px solid #4a4232;border-radius:12px;padding:14px;cursor:pointer}
.tiercard.sel,.pcard.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.tiercard h4,.pcard h4{margin:0 0 6px;color:var(--gold)}
.tiercard p,.pcard p{font-size:14px;margin:0;color:var(--cream-dim)}
input,select{font:inherit;background:#141210;border:1px solid #4a4232;color:var(--cream);border-radius:6px;padding:4px 8px;width:100%}
.abilgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0}
.abilgrid label{font-size:12px;font-variant:small-caps;color:var(--cream-dim)}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:2px 14px;font-size:14px}
.skillgrid label{display:flex;gap:6px;align-items:center}.skillgrid input{width:auto}
/* ---------- inline icons ---------- */
.ico{display:inline-block;width:1.1em;height:1.1em;vertical-align:-0.18em}
.ico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico svg .f{fill:currentColor;stroke:none}
.ico.big{width:64px;height:64px;color:var(--gold);filter:drop-shadow(0 0 12px #c9a55c44)}
.ico.region{width:1.35em;height:1.35em;margin-right:6px;color:var(--gold)}
.ico.hud{margin-right:3px;color:var(--gold);opacity:.9}
.ico.tagico{width:1em;height:1em;margin-right:4px}
.card .cardico{float:right;width:34px;height:34px;color:#a98f5c;opacity:.75;margin:2px 0 6px 10px}
.checkbox .cardico{float:right;width:30px;height:30px;color:#a98f5c;opacity:.8;margin:0 0 6px 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--parch);color:var(--ink);
  border-radius:10px;padding:10px 18px;box-shadow:0 4px 18px #000a;opacity:0;transition:opacity .3s;pointer-events:none;max-width:80vw;text-align:center}
#toast.show{opacity:1}
/* ---------- map ---------- */
#map svg{width:100%;height:auto;background:var(--frame);border-radius:10px;border:1px solid #3a332a}
.mnode{fill:#3a332a;stroke:#6a5c40}
.mnode.seen{fill:var(--gold);stroke:var(--gold)}
.mlabel{fill:var(--cream-dim);font-size:11px;font-family:Georgia,serif}
.mlabel.seen{fill:var(--cream)}
/* ---------- cover ---------- */
#cover{text-align:center;padding:60px 10px 30px}
#cover h1{font-size:52px;margin:10px 0 4px;color:var(--gold);font-variant:small-caps;letter-spacing:.06em}
#cover .lanterns{font-size:26px;letter-spacing:.3em;margin:8px 0}
#cover .sub{color:var(--cream-dim)}
#cover .byline{max-width:520px;margin:18px auto;color:var(--cream-dim);font-style:italic}
.footnote{color:var(--cream-dim);font-size:13px;text-align:center;margin-top:40px}
@media(max-width:700px){.eno{font-size:30px}#cover h1{font-size:34px}}
</style></head><body>
<script>window.NW={"meta": {"title": "The Night Watchman", "rating": 2, "sub": "A solo adventure for one character. No Dungeon Master required.", "byline": "From the Long Island Dungeon Master. Written by hand, by a human, over thirty years of running games for other people. Every word of it."}, "primer": [{"title": "What this is", "h": "<p>This is a night, not a dungeon.<\/p><p>You are the new night watchman of the village of Brackenford: one lantern, one route, five posts, and the hours between dusk and dawn. You answered a notice on the board because nobody else did. Tonight the ford freezes over, which happens perhaps three times a year and never used to happen at all, and by midnight you will be the only person in the village who is not behind a door.<\/p><p>There is no Dungeon Master. The book is the Dungeon Master. It will describe what you see, ask you what you do, tell you when to roll, and remember what you did. You supply the character, the dice, and the nerve.<\/p><p>You cannot win this adventure. There is nothing at the end of it that you defeat. Read that now rather than discovering it at four in the morning: this is a night you survive and a village you keep, and the book is honest with you about that from the first page. There are five endings and not one of them is the correct one.<\/p>"}, {"title": "What you need", "h": "<p>- <b>A 3rd-level character<\/b> for the world's most popular roleplaying game. Yours, built normally, any class, 2014 or 2024 rules. Or take a ready-made character from Appendix B and start in two minutes.<br>- <b>Dice.<\/b> The usual set.<br>- <b>A dog, if you want one.<\/b> Nell is an optional companion: she costs you nothing, nine entries notice her, and three of them let her do something no person could. Her block is in Appendix B. Decide now, because the night starts asking at your first post.<br>- <b>Nothing to track.<\/b> This file keeps the night sheet itself: codewords, the clock, the oil, the dice arithmetic. Appendix D has a printable sheet if you ever take the night to paper.<\/p>"}, {"title": "Why 3rd level", "h": "<p>Because a lone character at 1st level dies to a single lucky hit, and a book that kills you on page four has not told you a story, it has wasted your evening. At 3rd level your character has chosen a subclass, which means this book can notice what you actually are. It does, constantly. A Battle Master reads a frozen street differently from a cleric of the dawn, and the entries know it.<\/p><p>If your character is a different level, play them as they are and change nothing. The encounters are tuned for 3rd level, and the Watch Lamp choice below will make up the difference.<\/p>"}, {"title": "What you track", "h": "<p>Four things, and two short lists the night itself hands you. If you find yourself keeping more than that, the book has failed and you should stop doing it.<\/p><p>The two lists are simply where you have been: <b>which posts you have rung in at<\/b> on your first circuit, and <b>which crises you have answered<\/b> in the dead hours. Both entries remind you as you go, and there is room for both on the night sheet in Appendix D.<\/p><p><b>Your character sheet.<\/b> Hit points, spell slots, the usual.<\/p><p><b>Codewords.<\/b> Single words in small caps. When an entry grants one, the file writes it down for you. Later entries look for them, sometimes hours later. The codewords are the night's memory, and they are how this book knows what kind of person you were at two in the morning. In the last stretch of the night the book may also hand you a <b>dawn mark<\/b>, which is simply a codeword you gain near the very end of the night, and that only the final dawn entries ever check. Same box on the sheet. You will not need to remember it long.<\/p><p><b>The Dawn Track.<\/b> Twelve boxes. The file ticks one for you whenever an entry says so. Investigating things costs night. Standing in the cold getting your breath back costs night. You are not being punished. You are being timed, the way a night times you. <b>If the twelfth box ticks before you have reached the Last Watch, the night's final act:<\/b> finish the scene you are in, then go to entry <a class=\"eref\" data-go=\"312\">312<\/a>. The last of the dark is running out, and the thing at the ford is done waiting. If it ticks during the Last Watch, keep playing: the dawn takes the finale as it finds it.<\/p><p><b>Lamp oil.<\/b> You start with four units if you play at Lantern Watch, the standard tier described in the next section. When an entry says the lamp drinks a unit, the file marks one off; the cold makes it drink, and so do certain choices. You can never carry more than your starting number. When the last one goes, your lamp is dark: outdoors you have disadvantage on Wisdom (Perception) checks, and some entries have a line that only happens to a dark lamp, and you do not want those lines. A dark lamp relights from any lit fire in the village, or by spending a Rekindle token, which is explained just below. Not from wishing.<\/p>"}, {"title": "Choose your Watch Lamp", "h": "<p>Three ways to play the same night. Pick one now. You can change it later, on any quiet ground: any entry that is not a fight and is not asking you for a roll. You cannot change it in the middle of a scene that is testing you, and you cannot change it once you are on the floor.<\/p><p><b>Ember Watch.<\/b> You want the night and not its teeth. You start each act with 10 + your level in temporary hit points, you carry two Rekindle tokens, every printed DC drops by 2 unless the entry prints an Ember number of its own, in which case use the number the entry gives you, you get five oil, and you cannot die. At 0 hit points someone finds you and drags you to safety before dawn, and the night goes on without you. In the dead hours of the night, four crises break out at once and a watchman can normally reach only two of them; at this tier you reach three, so you will also see more of this village than anyone else.<\/p><p><b>Lantern Watch.<\/b> The night as written. 5 + your level in temporary hit points at the start of each act, one Rekindle token, DCs as printed, four oil. You can lose. Every dying moment has a rescue that costs you something.<\/p><p><b>Dark Watch.<\/b> The night does not care about you. No temporary hit points, no Rekindle, DCs as printed with some late-night entries raising them further, three oil, and enemies win initiative ties. Death is death, and there is an ending written for it. Bury the watchman and make another one.<\/p><p><b>If you drop to 0 hit points.<\/b> Some entries write their own answer to this and say so plainly; follow the entry when it does. Everywhere else, this is the rule, and it depends only on your lamp:<\/p><p><b>On Ember Watch<\/b> you cannot die tonight. Somebody finds you, and you wake somewhere warm with the night finished without you. Take the dawn mark <span class=\"cw\">SCARRED<\/span> and read on to the dawn.<\/p><p><b>On Lantern Watch<\/b> you make death saving throws as normal, and the village is not empty: whoever is nearest gets to you before the third failure. It costs you a level of exhaustion and it costs you whatever you were in the middle of doing, and that is the whole price. Get up and keep going.<\/p><p><b>On Dark Watch<\/b> you die, and the book has an ending written for it. Go to <a class=\"eref\" data-go=\"535\">535<\/a>.<\/p><p><b>Rekindle token.<\/b> Spend one to reroll the d20 you have just rolled (only the most recent roll qualifies), or to stabilise yourself at 0 hit points, or to refill one unit of lamp oil. One mechanic, three uses, two boxes on your sheet.<\/p><p><b>Watch Lamp sidebars.<\/b> Combat and hazard entries end with a single line giving the numbers for all three tiers at once, always in the same order:<\/p><blockquote><p><b>Watch Lamp<\/b> · <b>Ember:<\/b> the shrike has 14 HP and does not use Silent Rush. · <b>Lantern:<\/b> 22 HP. · <b>Dark:<\/b> 22 HP, and it tries to push you off the arch.<\/p><\/blockquote><p>Read your own and ignore the other two. They are mostly numbers: hit points, distances, whether a thing presses its advantage. Two of them do reach further than that, and you should know which before you choose. <b>Ember Watch reaches three of the four crises in the dead hours instead of two<\/b>, so it sees more of the village. <b>Dark Watch puts real teeth in three scenes<\/b>: the fight on the bridge can throw you into the water, the pair on the square can take the child before you get there, and there is a third thing in the rafters of the last house. Nothing else changes.<\/p>"}, {"title": "How to play, if you have never done this alone", "h": "<p>You read an entry. It tells you what you see. At the bottom it offers you choices, or asks for a roll, and each option gives you a number. Go to that entry. That is the whole engine.<\/p><p>Three things worth knowing, because they are the three that trip people up:<\/p><p><b>When the book asks for a check, it means it.<\/b> Both outcomes are written. Failure is never a wall in this adventure and never a restart; it is a different, usually worse, way forward. You are allowed to fail. Some of the best parts of this night are on the failure side.<\/p><p><b>When the book is silent, you decide.<\/b> It cannot cover everything and it will not try. If you want to know what a room smells like or what a man's hands are doing and the book has not said, decide, and be generous, and err toward whatever makes the night more interesting. You will not break anything. There is no wrong answer that the book is secretly marking.<\/p><p><b>You will want to fix it.<\/b> You will not be able to. Around midnight this adventure puts four emergencies in front of you and lets you reach two, and the fact that you had to choose is the point rather than a flaw. Choose, and live with it, and do not go back and re-read the ones you missed until you have finished the night. They will be there next time.<\/p>"}, {"title": "A worked example", "h": "<blockquote><h4>041<\/h4><p>You put your eye to the gap in the shutter.<\/p><p>Candles. Dozens, most of them guttered to stubs and left where they died. At the far end, past the altar, a shape sits upright in a chair facing the door with its hands on its knees.<\/p><p><i>Make a DC 13 Wisdom saving throw. On a failure, you step back from the shutter fast enough to scrape your lantern on the stone, and you take no damage, but the Dawn Track ticks.<\/i><\/p><p>→ Knock. <a class=\"eref\" data-go=\"043\">043<\/a><br>→ Ring in and go. <a class=\"eref\" data-go=\"047\">047<\/a><\/p><\/blockquote><p>You roll a <b>d20<\/b> and add your Wisdom modifier, because this is a Wisdom saving throw, and this book always names the die and the number. Say your Wisdom is 13, so your modifier is +1. The die comes up 9. Nine plus one is ten, and ten is under thirteen, so you have failed.<\/p><p>Failing is not a wall. You tick a box on the Dawn Track, which means the night got a little shorter while you stood in a square getting your breath back, and then you make the same choice you had before: knock, or walk away.<\/p><p>Nobody is watching. Take the whole evening.<\/p><p>Turn to <a class=\"eref\" data-go=\"001\">001<\/a>.<\/p>"}], "appendices": [{"title": "Appendix A: After the Dawn", "h": "<p><i>A small oracle, so the night does not have to be the end of it.<\/i><\/p><p>Brackenford has two weeks of quiet at most before the cold tries again. If you want to keep playing it without a Dungeon Master and without another book, you need exactly two things: a way to ask questions, and a way to be surprised. Here they are on one page.<\/p><h4>Asking the night a question<\/h4><p>Frame anything as a yes or no question and roll d6.<\/p><table><thead><tr><th>d6<\/th><th>Answer<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><b>No, and<\/b> something worse. Add a complication you did not expect.<\/td><\/tr><tr><td>2<\/td><td><b>No.<\/b><\/td><\/tr><tr><td>3<\/td><td><b>No, but<\/b> something small goes your way.<\/td><\/tr><tr><td>4<\/td><td><b>Yes, but<\/b> it costs you.<\/td><\/tr><tr><td>5<\/td><td><b>Yes.<\/b><\/td><\/tr><tr><td>6<\/td><td><b>Yes, and<\/b> more than you asked for.<\/td><\/tr><\/tbody><\/table><p>If the answer seems very likely, roll twice and take the higher. If it seems very unlikely, roll twice and take the lower. That is the entire system and it is enough.<\/p><h4>Being surprised<\/h4><p>Whenever you roll a 1 or a 6 on the question above, or any time the night has gone quiet and you do not know what happens next, roll d8:<\/p><table><thead><tr><th>d8<\/th><th>The night offers<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Somebody who should be inside is outside.<\/td><\/tr><tr><td>2<\/td><td>A thing that was shut is open. Nobody will admit to opening it.<\/td><\/tr><tr><td>3<\/td><td>An offering has been taken, and it was not the weather.<\/td><\/tr><tr><td>4<\/td><td>Somebody tells you the truth, at a bad moment, for their own reasons.<\/td><\/tr><tr><td>5<\/td><td>The cold arrives early, and everything you had planned is now happening in it.<\/td><\/tr><tr><td>6<\/td><td>A person you have written off turns out to have been doing something all along.<\/td><\/tr><tr><td>7<\/td><td>Somebody asks you for a promise you should not make.<\/td><\/tr><tr><td>8<\/td><td>It is quiet. Genuinely quiet. Take the win and use the hour.<\/td><\/tr><\/tbody><\/table><h4>Where to point it<\/h4><p>The Brackenford Starter Setting has eight keyed locations, eight named villagers, a notice board table, and four simmering tensions, and this night has just moved every one of them. Roll on the notice board table. Ask who is collecting the toll now that Doran is dead. Ask what Goodwife Alder wants over tea. Ask what Sefa's count comes to this week.<\/p><p>The Wilderness Pack's tables cover the moor and the road, if you go out to the stones.<\/p><p>Do not go down the swept stair yet. That one has its own book coming.<\/p>"}, {"title": "Appendix B: two watchmen, ready to play", "h": "<p><i>If you would rather not build a character, take one of these and go. Both are 3rd level and both are built from SRD options only.<\/i><\/p><h4>Cerrig, who took the tabard for the coin<\/h4><p><b>Human Fighter 3 (Champion).<\/b> AC 17 (chain mail, shield). HP 28. Speed 30 ft.<br>STR 16 (+3) DEX 12 (+1) CON 14 (+2) INT 10 (+0) WIS 13 (+1) CHA 11 (+0)<br>Proficiency +2. Saves: Strength +5, Constitution +4.<br>Skills: Athletics +5, Perception +3, Survival +3, Insight +3. Passive Perception 13.<br><b>Longsword<\/b> +5, 1d8+3 slashing (1d10+3 two-handed). <b>Spear<\/b> +5, 1d6+3. <b>Light crossbow<\/b> +3, 1d8+1.<br><b>Second Wind<\/b> (1/rest): bonus action, regain 1d10+3 HP.<br><b>Action Surge<\/b> (1/rest): one additional action.<br><b>Improved Critical:<\/b> critical hits on 19 and 20.<br><b>Fighting Style, Defence:<\/b> +1 AC (included).<br><i>You are twenty-three, you needed the money, and you have not told anybody that you have never hit a person in your life.<\/i><\/p><h4>Wren, who took it because somebody had to<\/h4><p><b>Half-elf Cleric 3 (Life Domain).<\/b> AC 18 (chain mail, shield). HP 24. Speed 30 ft.<br>STR 13 (+1) DEX 10 (+0) CON 14 (+2) INT 11 (+0) WIS 16 (+3) CHA 14 (+2)<br>Proficiency +2. Saves: Wisdom +5, Charisma +4. Spell save DC 13, spell attack +5.<br>Skills: Insight +5, Medicine +5, Persuasion +4, Perception +5. Passive Perception 15. Darkvision 60 ft.<br><b>Mace<\/b> +3, 1d6+1 bludgeoning.<br><b>Cantrips:<\/b> <i>guidance<\/i>, <i>light<\/i>, <i>sacred flame<\/i>, <i>spare the dying<\/i>.<br><b>Spells (4 first-level, 2 second-level):<\/b> <i>bless<\/i>, <i>cure wounds<\/i>, <i>healing word<\/i>, <i>shield of faith<\/i>, <i>lesser restoration<\/i>, <i>spiritual weapon<\/i>, <i>aid<\/i>, <i>prayer of healing<\/i>.<br><b>Disciple of Life:<\/b> healing spells restore an extra 2 + spell level.<br><b>Channel Divinity (1/rest):<\/b> Turn Undead, or Preserve Life (15 HP of healing, split among creatures you choose).<br><i>You keep the Quiet Hand, in the small way a layperson does. You have met Brother Anselm twice. He frightened you both times.<\/i><\/p><h4>The watch-dog (optional companion)<\/h4><p><i>Take her or leave her. She costs you nothing and she makes the night warmer, in every sense. Nine entries notice her, and in three of them she does something no person in this village could.<\/i><\/p><p><b>Nell.<\/b> Medium beast. AC 12. HP 11. Speed 40 ft.<br>STR 13 (+1) DEX 14 (+2) CON 12 (+1) INT 3 (-4) WIS 12 (+1) CHA 7 (-2)<br>Perception +3, passive Perception 13. Keen Hearing and Smell: advantage on Perception checks relying on hearing or smell.<br><b>Bite<\/b> +3, 1d6+1 piercing.<br><b>On your turn<\/b> you may use a bonus action to command Nell to Attack, Help, or Guard (she takes the Dodge action and moves to stand over a creature of your choice).<br>If you give her no command she Dodges and stays with you.<br><b>On Ember Watch, Nell cannot die.<\/b> At 0 hit points she yelps, bolts, and turns up at the ford at dawn, filthy and delighted.<\/p>"}, {"title": "Appendix C: what the watchman knows", "h": "<p><i>A page for the player who wants to walk in cold. Everything here is common knowledge in Brackenford. None of it is a spoiler.<\/i><\/p><p><b>The village.<\/b> A few hundred souls at a river crossing on the edge of wild country. The road comes in from the south and crosses the River Wend at the ford, because the bridge lost its far arch a generation ago and was never repaired. Up the far slope: the square with the well and the notice board, the Shrine of the Quiet Hand at its edge, Greel's yard running down toward the river, and the Broken Wheel at the top with the lights on. Above everything, on the hill, the ruined keep of Caer Brack, which nobody goes into and everybody can see.<\/p><p><b>The far bank.<\/b> Across the ford, the Drowned Lane: one row of half-sunk houses, abandoned a generation ago, nobody crosses to it after dark.<\/p><p><b>The people you might meet tonight.<\/b> Hett Vance, the militia captain with no militia, who hired you. Doran Welk, who collects a copper at the ford and takes the blame for it. Mara Tullamore at the Broken Wheel, whose husband Tobin walked onto the moor last autumn and did not come back. Brother Anselm, who has not opened the shrine in a month and rings the dusk bell anyway. Pell Greel, who trades everything and sells information to both sides. Bryn, who runs Greel's goods and is twelve and sees everything. Goodwife Alder, who has no title and runs the village from her kitchen. Old Sefa out on the moor, who tends the stone circle and counts under her breath.<\/p><p><b>The freezing nights.<\/b> Perhaps three times a year now, where it used to be once, the cold comes down off the hill with no wind behind it and the ford ices over. People who are outside on those nights sometimes do not come back. The village handles this by going indoors and not discussing it.<\/p><p><b>Your job.<\/b> Walk the round. Ring in at the posts so the village hears you are alive. Keep the lamp lit. And if you see something you do not understand, do not chase it: go and get Hett.<\/p><p>You will break that last one. Everyone does.<\/p>"}, {"title": "Appendix D: the night sheet", "h": "<p><i>Copy this onto anything.<\/i><\/p><p><b>THE DAWN TRACK<\/b><br>☐ ☐ ☐ ☐ ☐ ☐ ☐ ☐ ☐ ☐ ☐ ☐<\/p><p><b>LAMP OIL<\/b> (Ember 5 / Lantern 4 / Dark 3)<br>☐ ☐ ☐ ☐ ☐<\/p><p><span class=\"cw\">REKINDLE<\/span> (Ember 2 / Lantern 1 / Dark 0)<br>☐ ☐<\/p><p><b>WATCH LAMP TIER:<\/b> ....................................<\/p><p><b>POSTS RUNG IN<\/b> <i>(your first circuit; three of five)<\/i><br>☐ the Broken Wheel · ☐ the Shrine · ☐ Greel's Yard · ☐ the Square · ☐ the Broken Bridge<\/p><p><b>CRISES ANSWERED<\/b> <i>(the dead hours; two, or three on Ember)<\/i><br>☐ the Broken Wheel · ☐ the Shrine · ☐ the Square · ☐ the hill road<\/p><p><span class=\"cw\">CODEWORDS<\/span> <i>(the night grants at most twelve)<\/i><\/p><table><thead><tr><th><\/th><th><\/th><\/tr><\/thead><tbody><tr><td>☐ ICEBOUND<\/td><td>☐ DOORHELD<\/td><\/tr><tr><td>☐ VOUCHED<\/td><td>☐ RELIEVED<\/td><\/tr><tr><td>☐ MUGSET<\/td><td>☐ TOLLPAID<\/td><\/tr><tr><td>☐ HANDSIGN<\/td><td>☐ SHELTERED / TAKEN <i>(one or the other, never both)<\/i><\/td><\/tr><tr><td>☐ WITNESS<\/td><td><\/td><\/tr><tr><td>☐ BLACKNAIL<\/td><td><\/td><\/tr><tr><td>☐ LARDER<\/td><td><\/td><\/tr><tr><td>☐ BLOODED<\/td><td><\/td><\/tr><\/tbody><\/table><p><b>DAWN MARKS<\/b> <i>(the finale writes these; only the dawn reads them)<\/i><br>☐ SCARRED · ☐ CARRIED<\/p><p><b>NOTES ON THE NIGHT<\/b><\/p>"}, {"title": "A word from the Long Island Dungeon Master", "h": "<p>Thirty years behind a screen teaches you one thing above everything else: the table does not remember your plot. It remembers the moment somebody had to choose, out loud, in front of their friends, and could not have both.<\/p><p>This adventure is built out of that. There is no puzzle in it that a clever player unlocks. There is a night, and four things happening at once, and one of you. The whole design of it, from the Dawn Track to the two visits in the dead hours, exists to put you in front of a choice that costs something and then to remember, quietly, in a codeword, what you decided.<\/p><p>If you have never played alone before and this was your way in: welcome. There is a whole shelf of us out here.<\/p><p>If you have soloed for years and came to see whether a Dungeon Master could actually write one of these: I hope the prose earned its keep. In a solo book the writing is the Dungeon Master, and I have never once believed that a random table can do that job on its own.<\/p><p>Either way, tell me how the night went. I read all of it.<\/p><p><b>The Long Island Dungeon Master<\/b><br>longislanddungeonmaster.com<\/p><p><i>The Night Watchman is set in the Brackenford Starter Setting, which is free at longislanddungeonmaster.com and which this adventure treats as canon. The Wilderness Pack's tables pair well with Appendix A.<\/i><\/p><p><i>Compatible with the fifth edition of the world's most popular roleplaying game. Uses only SRD 5.2.1 content.<\/i><\/p>"}], "entries": {"001": {"act": 1, "region": "The Handoff", "blocks": [{"t": "p", "h": "<p>The bell has not rung yet, but the light is going.<\/p>"}, {"t": "p", "h": "<p>You stand at the ford with your boots in the mud and a borrowed tabard over your coat, and Hett Vance looks you over the way a man looks over a cart he is not sure will make the hill. He is a head taller than you and twenty years older and he has been the entire militia of Brackenford for longer than anyone says out loud.<\/p>"}, {"t": "p", "h": "<p>\"You came,\" he says. He sounds like he had a speech ready for if you didn't.<\/p>"}, {"t": "p", "h": "<p>He holds out a lantern. It is heavy, brass, scratched to hell, and already lit.<\/p>"}, {"t": "choice", "label": "Take it", "target": "002"}]}, "002": {"act": 1, "region": "The Handoff", "blocks": [{"t": "p", "h": "<p>\"Four rules,\" Hett says, and counts them on his fingers like he has done it before, to men who are not here anymore.<\/p>"}, {"t": "p", "h": "<p>\"One. The lamp stays lit. Two. You ring in at the posts, so the village hears you're alive. Three.\" He stops. Starts again. \"Three, if you see something you don't understand, you do not chase it. You come and get me.\"<\/p>"}, {"t": "p", "h": "<p>You wait. He does not give you a fourth.<\/p>"}, {"t": "p", "h": "<p>\"Four's the one I can't teach,\" he says. \"You'll know it when you need it.\"<\/p>"}, {"t": "p", "h": "<p>He puts the bell-clapper in your other hand, the striker you will ring the posts with. Brass, cold, the size of a spoon.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you are proficient in Insight:<\/i> he has given this speech before, in this order, in this spot, and the pause before the third rule is not him forgetting. It is him deciding, again, whether to say it to somebody new.<\/p>"}, {"t": "choice", "label": "Ask him something", "target": "003"}, {"t": "choice", "label": "Say nothing and start the circuit", "target": "007"}]}, "003": {"act": 1, "region": "The Handoff", "blocks": [{"t": "p", "h": "<p><i>Choose one. You may come back here and ask again until you leave.<\/i><\/p>"}, {"t": "choice", "label": "\"Why me?\"", "target": "004"}, {"t": "choice", "label": "\"What happened to the other watchmen?\"", "target": "005"}, {"t": "choice", "label": "\"What am I actually looking for?\"", "target": "006"}, {"t": "choice", "label": "That's enough. Start the circuit", "target": "007"}]}, "004": {"act": 1, "region": "The Handoff", "blocks": [{"t": "p", "h": "<p>\"Because you read the notice,\" he says. \"And because you're standing here.\"<\/p>"}, {"t": "p", "h": "<p>He is quiet a moment. Somewhere up the slope a shutter bangs closed, then another, and then a third further off, as if the news were walking uphill ahead of you.<\/p>"}, {"t": "p", "h": "<p>\"That's not nothing. People in this village have got clever at looking at a thing and deciding it's somebody else's. You looked at it and came down the hill.\" He straightens the tabard on your shoulder, tugs it flat, an old gesture from a man who used to have a row of them to straighten. \"So. You.\"<\/p>"}, {"t": "choice", "label": "Ask something else", "target": "003"}, {"t": "choice", "label": "Start the circuit", "target": "007"}]}, "005": {"act": 1, "region": "The Handoff", "blocks": [{"t": "p", "h": "<p>The answer takes long enough that you hear the river fill the gap.<\/p>"}, {"t": "p", "h": "<p>\"They went to Aldermere,\" Hett says. \"Errand for me. Six of them.\" He is watching the far bank while he says it. \"Long errand.\"<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If your passive Wisdom (Insight) is 13 or higher, or you make a DC 13 Wisdom (Insight) check:<\/i> he is not lying, and he is not telling the truth either. He sent them. Whatever the errand was, he invented it, and he is glad every day that they went.<\/p>"}, {"t": "p", "h": "<p>You do not know why yet. But you know it, and he knows you know, and he does not look at you.<\/p>"}, {"t": "p", "h": "<p><b>The night remembers: VOUCHED.<\/b><\/p>", "ops": [{"op": "grant", "words": ["VOUCHED"], "mark": false}]}, {"t": "choice", "label": "Ask something else", "target": "003"}, {"t": "choice", "label": "Start the circuit", "target": "007"}]}, "006": {"act": 1, "region": "The Handoff", "blocks": [{"t": "p", "h": "<p>\"Nothing,\" he says. \"That's the honest answer. Ninety nights in a hundred you walk the round, you get cold, you ring the bell, you go home.\"<\/p>"}, {"t": "p", "h": "<p>He rubs his jaw.<\/p>"}, {"t": "p", "h": "<p>\"The other ten, you'll know, because the village goes wrong. Dogs stop. Smoke goes straight up when there's a wind. Water does what water shouldn't.\" He nods at the ford, at the brown water sliding over the flat stones. \"That one especially. You watch the water.\"<\/p>"}, {"t": "choice", "label": "Ask something else", "target": "003"}, {"t": "choice", "label": "Start the circuit", "target": "007"}]}, "007": {"act": 1, "region": "The Handoff", "blocks": [{"t": "p", "h": "<p>Then the dusk bell rings.<\/p>"}, {"t": "p", "h": "<p>It comes from the shrine at the edge of the square, one clean stroke and then another, unhurried, exactly on time as it has been every dusk for a month from behind a door nobody has opened. Hett stops with his mouth half open and waits it out. So does the whole village. You can feel it happen, a few hundred people going still at once and then going on.<\/p>"}, {"t": "p", "h": "<p>When it finishes, Hett says, \"Right,\" and it is the most relieved you have ever heard a man sound about a bell.<\/p>"}, {"t": "p", "h": "<p>He walks away up the slope without looking back.<\/p>"}, {"t": "p", "h": "<p>You are the watch.<\/p>"}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b><\/p>", "ops": [{"op": "tick", "n": 1}]}, {"t": "choice", "label": "Walk to the water's edge and look, as he said", "target": "008"}, {"t": "choice", "label": "Get on with the circuit", "target": "009"}]}, "008": {"act": 1, "region": "The Handoff", "blocks": [{"t": "check", "dc": 12, "ability": "Wisdom", "skill": "Perception", "kind": "check", "h": "<p><i>Make a DC 12 Wisdom (Perception) check, with disadvantage if your lamp is not lit.<\/i><\/p>"}, {"t": "outcome", "which": "success", "blocks": [{"t": "p", "h": "<p>The brown water is sliding over the flat stones the way it always has, except at the edges, in the slack water behind the biggest rocks, where it has gone still and grey and slightly wrong, like a mirror breathed on. Thin ice is forming over the still patches. In autumn. In an hour it will be thick enough to hold a coin. By midnight it will hold a man's weight.<\/p>"}, {"t": "p", "h": "<p>The ford is icing, and you are the only person in Brackenford who knows it yet.<\/p>"}, {"t": "p", "h": "<p><b>The night remembers: ICEBOUND.<\/b><\/p>", "ops": [{"op": "grant", "words": ["ICEBOUND"], "mark": false}]}, {"t": "choice", "label": "Go and find Doran", "target": "010"}]}, {"t": "outcome", "which": "failure", "blocks": [{"t": "p", "h": "<p>The water looks like water. Cold, brown, ordinary, loud over the stones. You will feel a little stupid about this later.<\/p>"}, {"t": "choice", "label": "Get on with it", "target": "009"}]}], "own": {"010": "success", "009": "failure"}}, "009": {"act": 1, "region": "The Handoff", "blocks": [{"t": "p", "h": "<p>You turn your back on the river and start up the bank, and the cold comes with you.<\/p>"}, {"t": "p", "h": "<p>Not wind. There is no wind. Just the temperature going down a step at a time, the way a house cools when someone opens a door in another room.<\/p>"}, {"t": "cond", "kind": "nell", "h": "<p>The dog takes up her place half a stride ahead, ears up, tail swinging easy, entirely satisfied that the two of you are doing something normal. She has walked this village her whole life. She has never once done it in a tabard's company, and she approves.<\/p>"}, {"t": "p", "h": "<p>Doran Welk, who keeps the ford and takes its copper toll, is still in his chair at the near bank, which is unusual, because Doran goes in at dusk.<\/p>"}, {"t": "choice", "label": "Go to him", "target": "010"}]}, "010": {"act": 1, "region": "The Handoff", "blocks": [{"t": "p", "h": "<p>He has not gone in. He is sitting in the chair he carried out here himself with the strongbox between his boots, and he is not collecting anything, because there is nobody to collect from. He is just sitting, facing the water, with his cudgel across his knees and his coat buttoned to the throat.<\/p>"}, {"t": "p", "h": "<p>He hears your boots before he sees you, and when he turns and sees the tabard, something in his shoulders drops.<\/p>"}, {"t": "p", "h": "<p>\"Oh,\" he says. \"It's you. Vance found somebody.\"<\/p>"}, {"t": "p", "h": "<p>He takes a copper out of his own pocket and tests it against his teeth. Then he does it again.<\/p>"}, {"t": "choice", "label": "\"Why are you still out here?\"", "target": "011"}, {"t": "choice", "label": "\"The ford is freezing.\"", "target": "012", "req": "ICEBOUND"}, {"t": "choice", "label": "Leave him to it", "target": "020"}]}, "011": {"act": 1, "region": "The Handoff", "blocks": [{"t": "p", "h": "<p>\"Waiting,\" he says.<\/p>"}, {"t": "p", "h": "<p>\"For what?\"<\/p>"}, {"t": "p", "h": "<p>He looks at the water. He is a broad, tired man and up close he is more tired than broad.<\/p>"}, {"t": "p", "h": "<p>\"You're new, so I'll say it plain and then I'll not say it again. There are nights in this village when it is better to be somewhere with a door.\" He tests the copper against his teeth. \"I'm working out if this is one.\"<\/p>"}, {"t": "choice", "label": "\"How do you tell?\"", "target": "013"}, {"t": "choice", "label": "\"The ford is freezing.\"", "target": "012", "req": "ICEBOUND"}, {"t": "choice", "label": "Leave him to it", "target": "020"}]}, "012": {"act": 1, "region": "The Handoff", "blocks": [{"t": "p", "h": "<p>He does not ask you if you are sure. That is the part you will remember.<\/p>"}, {"t": "p", "h": "<p>He stands up so fast the chair goes over backward, and he picks up the strongbox, and for one moment, before he gets his face back, you see exactly how frightened a man can be in a village where people wave in the street.<\/p>"}, {"t": "p", "h": "<p>\"Then I'm to go up the hill,\" he says, mostly to himself. \"Tonight. All right. All right.\"<\/p>"}, {"t": "p", "h": "<p>\"Up the hill where?\"<\/p>"}, {"t": "p", "h": "<p>\"Do your round,\" Doran says. Not unkindly. He is already walking. \"Ring in at your posts. Stay off the far bank. And if you see me on the hill road later, watchman, you did not.\"<\/p>"}, {"t": "p", "h": "<p><b>The night remembers: VOUCHED.<\/b><\/p>", "ops": [{"op": "grant", "words": ["VOUCHED"], "mark": false}]}, {"t": "choice", "label": "Watch him go, then start the circuit", "target": "020"}]}, "013": {"act": 1, "region": "The Handoff", "blocks": [{"t": "p", "h": "<p>\"You don't, till it's on you,\" Doran says. \"That's the trick of it. That's why nobody's ever ready.\"<\/p>"}, {"t": "p", "h": "<p>He tests the copper against his teeth.<\/p>"}, {"t": "p", "h": "<p>\"Cold comes down off the hill, quiet. Water goes strange. Then it's a freezing night, and the village pays what it owes, and in the morning we all say wasn't that a cold one and we go about our business.\" He puts the copper away. \"You want a rule? Here's the only one worth the tabard. When it turns, get people behind doors. Not you. Them. You're the one outside. That's the job you took.\"<\/p>"}, {"t": "choice", "label": "\"The ford is freezing.\"", "target": "012", "req": "ICEBOUND"}, {"t": "choice", "label": "Leave him to it", "target": "020"}]}, "020": {"act": 1, "region": "The Circuit", "blocks": [{"t": "p", "h": "<p><b>The route.<\/b><\/p>"}, {"t": "p", "h": "<p>The watch runs a circle: up from the ford through the square, along the top of the village past the inn, down the back way by Greel's yard, and out to the broken bridge before it comes back to the water. Five posts with a bell-ring at each, and Hett's four rules, and about four hours of dark before midnight.<\/p>"}, {"t": "p", "h": "<p>You will not get to all five. You never do. That is what the bell is for: the village hears where you are, and where you are not.<\/p>"}, {"t": "p", "h": "<p><i>Choose a post you have not yet visited. When you return here, choose again.<\/i><\/p>"}, {"t": "choice", "label": "<b>The Broken Wheel<\/b>, the inn at the top of the square. Light in the windows", "target": "030"}, {"t": "choice", "label": "<b>The Shrine of the Quiet Hand<\/b>, at the square's edge. The door that does not open", "target": "040"}, {"t": "choice", "label": "<b>Greel's Yard<\/b>, between the square and the river. Somebody is still working", "target": "050"}, {"t": "choice", "label": "<b>The Square and the Well<\/b>, the heart of it, the notice board", "target": "060"}, {"t": "choice", "label": "<b>The Broken Bridge<\/b>, and past it, across the water, the Drowned Lane", "target": "070"}, {"t": "cond", "kind": "circuit2", "h": "<p><i>After your second post, do not choose a third. Go to <a class=\"eref\" data-go=\"090\">090<\/a>.<\/i>\n<i>After your third post, the round is walked. Go to <a class=\"eref\" data-go=\"100\">100<\/a>.<\/i><\/p>"}]}, "030": {"act": 1, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>You hear it before you see it, which is the nicest thing that will happen to you tonight: forty people being warm at each other through a wall.<\/p>"}, {"t": "p", "h": "<p>Inside, the common room is low and gold and full. Mara Tullamore is working the taps with her sleeves shoved up past the elbow, running an argument about sheep with three men at once and winning all three. Somebody is playing something badly. The fire is enormous.<\/p>"}, {"t": "p", "h": "<p>You are standing in the door in a wet tabard with a lantern, and the room notices, one table at a time, and goes quieter than a room that size should be able to.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you are a fighter, a barbarian, a monk, or a ranger:<\/i> you read the room without deciding to. Nobody in this room is carrying more than a belt knife, the fire is at your back and will ruin your night eyes if you step toward it, and the only way out is the door you are standing in. None of that is a threat. It is just the shape of a room, and you will never be able to stop seeing it.<\/p>"}, {"t": "choice", "label": "Ring the bell and go", "target": "031"}, {"t": "choice", "label": "Go in", "target": "032"}]}, "031": {"act": 1, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>You ring in from the step. The clapper on the brass plate by the door, twice, the way Hett showed you.<\/p>"}, {"t": "p", "h": "<p>Inside, the noise comes back up like water closing over a stone. Somebody laughs. The badly played thing resumes.<\/p>"}, {"t": "p", "h": "<p>You stand outside a warm room in the cold and understand the job you have taken better than you did an hour ago.<\/p>"}, {"t": "choice", "label": "Back to the route", "target": "020"}]}, "032": {"act": 1, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>Mara sees the tabard and something crosses her face that is not quite a smile.<\/p>"}, {"t": "p", "h": "<p>\"Well,\" she says. \"Hett got one.\"<\/p>"}, {"t": "p", "h": "<p>She pours you something without asking and sets it on the bar, and while she does it, without breaking stride or conversation, she takes a clean mug from the rail, walks it to the empty chair by the fire, and sets it down in front of nobody.<\/p>"}, {"t": "p", "h": "<p>Nobody at the tables reacts. They have watched her do it every dusk for a year.<\/p>"}, {"t": "p", "h": "<p>She looks once at your lantern, reaches under the bar, and stands a small stoppered flask next to your drink. Lamp oil. \"House rule,\" she says. \"The watch carries spare. The last one didn't.\"<\/p>"}, {"t": "p", "h": "<p><b>One unit of oil goes into your coat.<\/b><\/p>", "ops": [{"op": "oil", "d": 1}]}, {"t": "choice", "label": "Ask about the chair", "target": "033"}, {"t": "choice", "label": "Ask what the village is worried about tonight", "target": "035"}, {"t": "choice", "label": "Drink it, thank her, go", "target": "036"}]}, "033": {"act": 1, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>\"That's Tobin's,\" she says. \"My husband. He'll be along.\"<\/p>"}, {"t": "p", "h": "<p>She says it in exactly the voice she used for the sheep argument. Not brave. Not broken. Just a woman stating the arrangements.<\/p>"}, {"t": "p", "h": "<p>The three men at the bar find things to look at.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you press her, or make a DC 14 Charisma (Persuasion) check:<\/i> she puts both hands flat on the bar.<\/p>"}, {"t": "p", "h": "<p>\"He went out on the moor last autumn and he did not come back, and I know what everyone in this room thinks that means. But on the night the ford froze, I heard him at my door. I opened it.\" Her voice does not change at all. \"There was nothing there but his crook, stuck upright in the frost, and frost does not hold a crook up, watchman. Something stood it there.\"<\/p>"}, {"t": "p", "h": "<p><b>The night remembers: MUGSET.<\/b><\/p>", "ops": [{"op": "grant", "words": ["MUGSET"], "mark": false}]}, {"t": "choice", "label": "Ask what the village is worried about tonight", "target": "035"}, {"t": "choice", "label": "Let it be", "target": "036"}]}, "035": {"act": 1, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>\"Tonight?\" She wipes the bar. \"Tonight they're worried it's cold.\"<\/p>"}, {"t": "p", "h": "<p>She lets that sit for a second.<\/p>"}, {"t": "p", "h": "<p>\"You'll hear a lot of daft things in here and about one in ten of them is worth carrying. So carry this one. When it gets cold like this, quick, no wind, the sort where your teeth hurt? Get the old ones and the little ones behind a door and let the rest of us call you a fool in the morning.\" She takes your empty cup. \"Nobody in Brackenford has ever once been embarrassed about a door.\"<\/p>"}, {"t": "cond", "kind": "has", "h": "<p>You tell her the ford is skinning over. Mara stops moving. Then she turns to the room and calls last orders, two hours early, in a voice that does not invite discussion, and forty people look at her, and start putting their coats on. Nobody argues. That frightens you more than the water did.<\/p>", "arg": "ICEBOUND"}, {"t": "choice", "label": "Go", "target": "036"}]}, "036": {"act": 1, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>Outside, the cold has got worse while you were warm, which is the cost of being warm.<\/p>"}, {"t": "p", "h": "<p>You ring in at the plate by the door. The sound goes out over the roofs and comes back thin.<\/p>"}, {"t": "choice", "label": "Back to the route", "target": "020"}]}, "040": {"act": 1, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>The shrine is the oldest building on the square and it looks it: small, stone, squat, with a carved hand above the door, palm out, fingers together. <i>Stop. Wait. Be still.<\/i><\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you are a cleric or a paladin:<\/i> you know that hand. Palm out, fingers together, is not a blessing and never was. It is a sign set at a threshold, and it is aimed outward, at whatever comes up the road.<\/p>"}, {"t": "p", "h": "<p>The door has not opened in a month. There is a drift of dead leaves against it that has been rained on and frozen and rained on again until it is less a drift than a seal.<\/p>"}, {"t": "p", "h": "<p>There is candlelight through the shutter gap.<\/p>"}, {"t": "p", "h": "<p>An hour ago that bell rang, on time, from in there.<\/p>"}, {"t": "choice", "label": "Look through the gap", "target": "041"}, {"t": "choice", "label": "Knock", "target": "043"}, {"t": "choice", "label": "Ring in and leave. Rule three", "target": "047"}]}, "041": {"act": 1, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>You put your eye to the gap in the shutter.<\/p>"}, {"t": "p", "h": "<p>Candles. Dozens, most of them guttered to stubs and left where they died, on the floor, on the sill, in a rough line down the middle of the nave that lines up with nothing in the room. At the far end, past the altar, a shape sits upright in a chair facing the door with its hands on its knees.<\/p>"}, {"t": "p", "h": "<p>It is a man. He is awake. His eyes are open and they are pointed at the door, and the door is where you are.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you have darkvision:<\/i> the candles are not what shows you that room. Past them, in the corners the light gave up on an hour ago, there is nothing: no second chair, no one standing, no door open at the back. Only wax, and stone, and him, sitting where he can watch the way in.<\/p>"}, {"t": "check", "dc": 13, "ability": "Wisdom", "skill": null, "kind": "save", "h": "<p><i>Make a DC 13 Wisdom saving throw. On a failure, you step back from the shutter fast enough to scrape your lantern on the stone, and you take no damage, but the Dawn Track ticks: you stand in the cold getting your breath for longer than you would admit.<\/i><\/p>", "failTick": 1}, {"t": "choice", "label": "Knock", "target": "043"}, {"t": "choice", "label": "Ring in and go", "target": "047"}]}, "043": {"act": 1, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>You knock.<\/p>"}, {"t": "p", "h": "<p>It is a small sound to make on a square that size.<\/p>"}, {"t": "p", "h": "<p>Nothing. Then, from the other side of the door, close, at the height of a seated man, a voice like a page turning.<\/p>"}, {"t": "p", "h": "<p>\"The door stays shut.\"<\/p>"}, {"t": "choice", "label": "\"I'm the watch.\"", "target": "044"}, {"t": "choice", "label": "\"Are you all right in there?\"", "target": "045"}, {"t": "choice", "label": "Leave him to it", "target": "047"}]}, "044": {"act": 1, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>A long pause.<\/p>"}, {"t": "p", "h": "<p>\"Vance found someone.\" Something moves behind the wood. \"Good. That is good. Listen to me, watchman, because I will not open this door and you have somewhere to be.\"<\/p>"}, {"t": "p", "h": "<p>\"I'm listening.\"<\/p>"}, {"t": "p", "h": "<p>\"The bell rings at dusk and it rings at dawn and it has not missed in a month. That is the whole of it. The bell is a lock on this village, and the ringing is the key turning in it, twice a day, on time. As long as it turns, something stays out.\" The voice is patient in a way that is worse than raving. \"Do not ask me what stays out, because I do not know. Ask me instead what you will do if one evening you are out on your round and you hear nothing.\"<\/p>"}, {"t": "p", "h": "<p>You do not have an answer.<\/p>"}, {"t": "p", "h": "<p>\"Then get one,\" says Brother Anselm, \"before you need it.\"<\/p>"}, {"t": "p", "h": "<p><b>The night remembers: HANDSIGN.<\/b><\/p>", "ops": [{"op": "grant", "words": ["HANDSIGN"], "mark": false}]}, {"t": "choice", "label": "\"What happens if you stop?\"", "target": "046"}, {"t": "choice", "label": "Go", "target": "047"}]}, "045": {"act": 1, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>\"No,\" the voice says, without any self-pity at all. \"I am not. Thank you for asking. Nobody has asked.\"<\/p>"}, {"t": "p", "h": "<p>A dry sound that might once have been a laugh.<\/p>"}, {"t": "p", "h": "<p>\"I have not slept in thirty days. I am not certain any longer which of the things I have seen were in the room. I am certain of the bell, because the bell is brass and it is heavy and my hands know the weight of it, and a man can hold on to a weight when he cannot hold on to anything else.\"<\/p>"}, {"t": "p", "h": "<p><b>The night remembers: HANDSIGN.<\/b><\/p>", "ops": [{"op": "grant", "words": ["HANDSIGN"], "mark": false}]}, {"t": "choice", "label": "\"What happens if you stop?\"", "target": "046"}, {"t": "choice", "label": "Go", "target": "047"}]}, "046": {"act": 1, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>The silence behind the door goes on long enough that you wonder if he has died sitting up.<\/p>"}, {"t": "p", "h": "<p>\"I do not know,\" Anselm says at last. \"That is my whole sin, watchman. I have built a month of my life and possibly this entire village on a thing I cannot test, because the only way to test it is to stop.\" A shift of cloth. \"So I do not stop. And every dusk I ring it, and every dusk nothing terrible happens, and every dusk that proves precisely nothing, and I do it again.\"<\/p>"}, {"t": "p", "h": "<p>Then, quieter, and this is the part you will still be hearing at midnight:<\/p>"}, {"t": "p", "h": "<p>\"If it does not ring, do not come here. Go and get the children.\"<\/p>"}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b><\/p>", "ops": [{"op": "tick", "n": 1}]}, {"t": "choice", "label": "Go", "target": "047"}]}, "047": {"act": 1, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>You ring in at the post outside the shrine. The clapper on the plate, twice.<\/p>"}, {"t": "p", "h": "<p>From inside the shut door, faintly, a man's voice says amen.<\/p>"}, {"t": "choice", "label": "Back to the route", "target": "020"}]}, "050": {"act": 1, "region": "Greel's Yard", "blocks": [{"t": "p", "h": "<p>Greel's yard is a fenced acre of everything: pelts, iron, rope, dried fish, a wall of mismatched boots gone stiff in the cold. Pell Greel is not here. Pell Greel is at his supper, being warm.<\/p>"}, {"t": "p", "h": "<p>Bryn is here. The boy is twelve or so and he is stacking crates by lantern light with his coat sleeves pulled over his hands, working alone in a yard the size of a barn, an hour after he should have been let go.<\/p>"}, {"t": "p", "h": "<p>The goat is eating a hat.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you can speak with animals, even briefly:<\/i> the goat has a great deal to say and almost none of it is about tonight: the hat, the boy, the cold, the fence. Then it tells you it will not go in the far corner of the yard anymore. You ask why, and it looks at you, because a goat has no why.<\/p>"}, {"t": "choice", "label": "\"Does Greel know you're still here?\"", "target": "051"}, {"t": "choice", "label": "Help him stack", "target": "052"}, {"t": "choice", "label": "Ring in and go", "target": "056"}]}, "051": {"act": 1, "region": "Greel's Yard", "blocks": [{"t": "p", "h": "<p>\"He knows.\" Bryn does not stop stacking. \"There's a load.\"<\/p>"}, {"t": "p", "h": "<p>\"At this hour?\"<\/p>"}, {"t": "p", "h": "<p>\"There's a load,\" the boy says again, in the exact flat tone of somebody repeating the last thing an adult said to him.<\/p>"}, {"t": "choice", "label": "Help him stack", "target": "052"}, {"t": "choice", "label": "Ask about the load", "target": "053"}]}, "052": {"act": 1, "region": "Greel's Yard", "blocks": [{"t": "p", "h": "<p>You set the lantern on a barrel and take the other end of the crates.<\/p>"}, {"t": "p", "h": "<p>It is honest work and it goes fast with two, and after a while Bryn stops being careful around you, the way children do when an adult has proved they will actually lift something. He tells you the goat's name. He tells you which boots on the wall are the good ones. He tells you Pell Greel has never once written a number down and has never once been wrong, and that he is not sure this is a good thing.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you are proficient in Athletics:<\/i> you take the heavy end without being asked, and because you are not fighting the weight you have attention left over for the stack itself. These crates are not being stored. Nothing is chocked, nothing is lashed, and the aisle down the middle has been left clear at the width of a cart.<\/p>"}, {"t": "p", "h": "<p>Then he says, without any change in his voice, \"You're the watch, so you'll be out at midnight.\"<\/p>"}, {"t": "p", "h": "<p>\"I will.\"<\/p>"}, {"t": "p", "h": "<p>\"Then don't be by the water.\"<\/p>"}, {"t": "choice", "label": "\"Why not?\"", "target": "053"}]}, "053": {"act": 1, "region": "Greel's Yard", "blocks": [{"t": "p", "h": "<p>Bryn puts down the crate.<\/p>"}, {"t": "p", "h": "<p>He is a quick, watchful boy who goes everywhere in this village and is invisible doing it, and right now he is neither quick nor invisible. He is a child in a cold yard trying to say something.<\/p>"}, {"t": "p", "h": "<p>His mouth opens. Nothing comes out. He tries again, and you can see his mouth start to form the first word before it fails him.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you have a lit lamp and you crouch to his level, or you make a DC 12 Charisma (Persuasion) or Wisdom (Insight) check:<\/i> <a class=\"eref\" data-go=\"054\">054<\/a><\/p>", "target": "054"}, {"t": "cond", "kind": "else", "h": "<p><i>Or if you would rather not push a frightened child:<\/i> <a class=\"eref\" data-go=\"055\">055<\/a><\/p>", "chain": true, "target": "055"}]}, "054": {"act": 1, "region": "Greel's Yard", "blocks": [{"t": "p", "h": "<p>You crouch, so the lantern is between you and low, and you are not a tall shape in a tabard anymore.<\/p>"}, {"t": "p", "h": "<p>\"You don't have to say it,\" you tell him. \"Point.\"<\/p>"}, {"t": "p", "h": "<p>Bryn thinks about that for a long moment. Then he lifts his arm and points, straight and steady, past the fence, past the roofs, up the black slope of the hill behind the village to where Caer Brack, the ruined keep on the hilltop, sits against the last of the light.<\/p>"}, {"t": "p", "h": "<p>Then he points down. At the ground. At <i>under<\/i>.<\/p>"}, {"t": "p", "h": "<p>\"I went down,\" he says, and that comes out fine, all of it, every word, because it is not the thing itself. \"On a dare. Down the swept stair. And I came back up.\" He is shaking, and not from the cold. \"I've tried to tell. Four times. It won't come.\"<\/p>"}, {"t": "p", "h": "<p><b>The night remembers: WITNESS and BLACKNAIL.<\/b><\/p>", "ops": [{"op": "grant", "words": ["WITNESS", "BLACKNAIL"], "mark": false}]}, {"t": "choice", "label": "Continue", "target": "055"}]}, "055": {"act": 1, "region": "Greel's Yard", "blocks": [{"t": "p", "h": "<p>You send him home.<\/p>"}, {"t": "p", "h": "<p>He goes without arguing, which tells you something, and at the gate of the yard he turns around and says, \"The load goes up the hill road. That's all the loads. That's all of them, since before I started.\" And then he runs.<\/p>"}, {"t": "p", "h": "<p>The goat has finished the hat.<\/p>"}, {"t": "choice", "label": "Ring in and go", "target": "056"}]}, "056": {"act": 1, "region": "Greel's Yard", "blocks": [{"t": "p", "h": "<p>You ring in at the yard post. Two strokes, brass on brass, and the sound goes out flat across the crates and dies against the pelts.<\/p>"}, {"t": "p", "h": "<p>The cold has teeth in it now.<\/p>"}, {"t": "choice", "label": "Back to the route", "target": "020"}]}, "060": {"act": 1, "region": "The Square And The Well", "blocks": [{"t": "p", "h": "<p>The square is empty, which at this hour is right, and lit, which is not.<\/p>"}, {"t": "p", "h": "<p>Somebody has left a lantern burning on the lip of the dry well in the middle of the square. Not a candle in a window. A good brass lantern, full of oil, set deliberately on the stones, casting a wide clean circle of light around the wellhead and nothing else.<\/p>"}, {"t": "p", "h": "<p>The notice board stands at the edge of the light with its layers of paper going grey.<\/p>"}, {"t": "choice", "label": "Go to the well and the lantern", "target": "061"}, {"t": "choice", "label": "Read the notice board first", "target": "063"}, {"t": "choice", "label": "Ring in and go. Something about the light is wrong", "target": "066"}]}, "061": {"act": 1, "region": "The Square And The Well", "blocks": [{"t": "p", "h": "<p>You crouch over the wellhead with your own lamp turned up, because you want to see this properly, and seeing things properly costs light. <b>The lamp drinks a unit of oil.<\/b><\/p>", "ops": [{"op": "oil", "d": -1}]}, {"t": "p", "h": "<p>The lantern on the well is warm. It has been burning for about an hour, which means somebody set it here at the time the dusk bell rang.<\/p>"}, {"t": "p", "h": "<p>The well it stands on has been dry for years. There is a plank cover, warped, pushed aside by about a hand's width, and the gap is the kind of black that a lantern a foot away does not touch at all.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you are proficient with thieves' tools:<\/i> you have spent enough hours on hinges and hasps to know what iron leaves behind. There is no bite of a bar on the edge of the plank and no chock mark on the stone. Whatever shifted this cover used no tool at all.<\/p>"}, {"t": "check", "dc": 13, "ability": "Wisdom", "skill": "Perception", "kind": "check", "h": "<p><i>Make a DC 13 Wisdom (Perception) check.<\/i><\/p>"}, {"t": "outcome", "which": "success", "blocks": [{"t": "p", "h": "<p>The plank was pushed aside from <i>underneath<\/i>. The scrape marks on the stone lip are on the far side of the gap and they are fresh, pale against the weathered rock. Whatever moved this cover was in the well.<\/p>"}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b> → <a class=\"eref\" data-go=\"062\">062<\/a><\/p>", "ops": [{"op": "tick", "n": 1}]}]}, {"t": "outcome", "which": "failure", "blocks": [{"t": "p", "h": "<p>It is an open well and a left lantern and you are cold and new to this. → <a class=\"eref\" data-go=\"062\">062<\/a><\/p>"}]}]}, "062": {"act": 1, "region": "The Square And The Well", "blocks": [{"t": "p", "h": "<p>You do not go down the well.<\/p>"}, {"t": "p", "h": "<p>Write that down somewhere and be proud of it. Rule three. Hett Vance would shake your hand.<\/p>"}, {"t": "p", "h": "<p>You do slide the plank back over the gap with your boot, which takes both hands and a shoulder, and it is heavier than it looks, and the whole time you are doing it you are extremely aware of the width of the space it is covering.<\/p>"}, {"t": "p", "h": "<p>Then you leave the lantern burning, because whoever set it there set it there on purpose, and it is not your light to take.<\/p>"}, {"t": "choice", "label": "The notice board", "target": "063"}, {"t": "choice", "label": "Ring in and go", "target": "066"}]}, "063": {"act": 1, "region": "The Square And The Well", "blocks": [{"t": "p", "h": "<p>The board is a slab of weathered oak layered a finger thick with the village's business. A lottery winner from three seasons back. A lost dog, the ink run with rain. Hett's standing offer for the watch, the one you answered, with your own thumbprint still on the corner of it.<\/p>"}, {"t": "p", "h": "<p>And pinned over all of it, on a black-headed nail, a sheet that was not there this morning.<\/p>"}, {"t": "p", "h": "<p>The hand is careful. Nobody signed it.<\/p>"}, {"t": "choice", "label": "Read it", "target": "064"}]}, "064": {"act": 1, "region": "The Square And The Well", "blocks": [{"t": "p", "h": "<p>&gt; <i>The bell rings at dusk. Do not be on the far bank when it stops.<\/i><\/p>"}, {"t": "p", "h": "<p>That is all of it.<\/p>"}, {"t": "p", "h": "<p>The nail is black and square-headed and driven through four other notices to reach the wood.<\/p>"}, {"t": "cond", "kind": "has", "h": "<p>Anselm did not write this. You heard him an hour ago through a door: he speaks slowly and precisely, like a man reading a prayer, and there is nothing slow or precise about this sheet. This is somebody older, and in a hurry, and writing to be understood by whoever can read.<\/p>", "arg": "HANDSIGN"}, {"t": "cond", "kind": "has", "h": "<p>Bryn told you the loads go up the hill road, all of them, always. Somebody in this village has been managing this for a long time, and somebody else has been leaving warnings about it on a public board where anyone might read them.<\/p>", "arg": "WITNESS"}, {"t": "p", "h": "<p><b>The night remembers: BLACKNAIL.<\/b><\/p>", "ops": [{"op": "grant", "words": ["BLACKNAIL"], "mark": false}]}, {"t": "choice", "label": "Take it down", "target": "065"}, {"t": "choice", "label": "Leave it up. Someone meant it to be read", "target": "066"}]}, "065": {"act": 1, "region": "The Square And The Well", "blocks": [{"t": "p", "h": "<p>You work the black nail out of the oak with your thumbnail and it comes hard.<\/p>"}, {"t": "p", "h": "<p>The paper goes inside your coat, against your chest, and you will be aware of it there for the rest of the night like a hand on your sternum.<\/p>"}, {"t": "p", "h": "<p>Behind you, out past the roofs and down the slope, the river has stopped making the sound it makes over the flat stones.<\/p>"}, {"t": "p", "h": "<p>You did not hear it stop. You only notice that it has.<\/p>"}, {"t": "choice", "label": "Ring in and go", "target": "066"}]}, "066": {"act": 1, "region": "The Square And The Well", "blocks": [{"t": "p", "h": "<p>You ring in at the well post, in the middle of the empty square, standing in a circle of somebody else's light.<\/p>"}, {"t": "p", "h": "<p>The two strokes go out across the square and up the fronts of the houses. Nobody comes to a window.<\/p>"}, {"t": "choice", "label": "Back to the route", "target": "020"}]}, "070": {"act": 1, "region": "The Broken Bridge", "blocks": [{"t": "p", "h": "<p>The bridge is a ruin and has been since before your grandfather. The near arch still stands, solid enough to walk out on, and then it simply stops, forty feet up, over the water, with the far arch a broken stub on the other bank and a generation of air in between.<\/p>"}, {"t": "p", "h": "<p>Nobody repaired it. The ford is ten yards downstream, and crossing there costs nothing but Doran's copper toll. At least it did until tonight.<\/p>"}, {"t": "p", "h": "<p>You walk out to the end of the standing arch because the post is out there, and because you want to see the far bank, and those are two different reasons and only one of them is the job.<\/p>"}, {"t": "choice", "label": "Look at the far bank", "target": "071"}, {"t": "choice", "label": "Ring in and get off this bridge", "target": "078"}]}, "071": {"act": 1, "region": "The Broken Bridge", "blocks": [{"t": "p", "h": "<p>The Drowned Lane sits on the far side of the water: one row of houses half sunk in the bog, doors swollen shut, roofs caved, reeds growing up through the floors. It was part of Brackenford once, before the far arch came down the year the trouble started. It has been empty for a generation.<\/p>"}, {"t": "p", "h": "<p>There is a light in one of the windows.<\/p>"}, {"t": "p", "h": "<p>Not a fire. Not a lantern like the one on the well. A low, steady, cold-coloured glow, in the third house along, behind a window that has no glass in it.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you can cast a light cantrip:<\/i> you put the light on a stone and send it across, and for a few breaths the far bank is lit by something that is not your lantern. The reeds along the Drowned Lane are all bent the same way, toward the water, in a place with nothing down there to bend them.<\/p>"}, {"t": "check", "dc": 14, "ability": "Wisdom", "skill": "Perception", "kind": "check", "h": "<p><i>Make a DC 14 Wisdom (Perception) check.<\/i><\/p>"}, {"t": "outcome", "which": "success", "blocks": [{"t": "choice", "label": "Continue", "target": "072"}]}, {"t": "outcome", "which": "failure", "blocks": [{"t": "p", "h": "<p>You watch it for a long moment and it does not change and you cannot make anything more of it. → <a class=\"eref\" data-go=\"073\">073<\/a><\/p>"}]}], "own": {"072": "success", "073": "failure"}}, "072": {"act": 1, "region": "The Broken Bridge", "blocks": [{"t": "p", "h": "<p>The house at the dead end of the lane, the last one, furthest from the water, has a door.<\/p>"}, {"t": "p", "h": "<p>That is what is wrong with it. Every other door down there has rotted off its hinges or swollen shut in its frame decades ago. That one has a door, and the door has boards across it, and the boards are pale.<\/p>"}, {"t": "p", "h": "<p>New timber. Nailed from the outside. Somebody crossed the water to do that, and did it recently, and did it in daylight, because nobody in this village would be over there in the dark.<\/p>"}, {"t": "p", "h": "<p><b>The night remembers: LARDER.<\/b><\/p>", "ops": [{"op": "grant", "words": ["LARDER"], "mark": false}]}, {"t": "choice", "label": "Continue", "target": "073"}]}, "073": {"act": 1, "region": "The Broken Bridge", "blocks": [{"t": "p", "h": "<p>Below you and to the left, on the near bank where the reeds come down to the water, something has been at work.<\/p>"}, {"t": "p", "h": "<p>At first you take it for fishing stakes: reed-stems and old fence-posts standing out of the mud, something small on top of each.<\/p>"}, {"t": "p", "h": "<p>You lower the lantern.<\/p>"}, {"t": "p", "h": "<p>Voles. Six of them, and a rat, and a bird, each pushed down onto a point at even spacing, like a shelf in a larder. The nearest is not old.<\/p>"}, {"t": "p", "h": "<p>Two sets of tracks print the mud below, one heavier than the other, and they tell you how it was done: everything on those points was driven along the bank from one direction, toward something already waiting at the end of the run.<\/p>"}, {"t": "p", "h": "<p><b>The night remembers: LARDER.<\/b><\/p>", "ops": [{"op": "grant", "words": ["LARDER"], "mark": false}]}, {"t": "choice", "label": "Get off the bridge", "target": "078"}, {"t": "choice", "label": "Hold still and listen", "target": "074"}]}, "074": {"act": 1, "region": "The Broken Bridge", "blocks": [{"t": "p", "h": "<p>You hold still.<\/p>"}, {"t": "p", "h": "<p>The river is not making its sound. That is the thing your body worked out ten minutes ago and your head is only now catching up to. The Wend runs wide and shallow and loud over flat stones and it has run loud under this bridge every hour of your life, and it is not doing it now. It is going quiet under a skin of grey.<\/p>"}, {"t": "p", "h": "<p>And in the new quiet you can hear, from the reeds below, something breathing that is not you.<\/p>"}, {"t": "p", "h": "<p>It is not a call. Fen-shrikes make no call. That is how they live in a place where everything listens.<\/p>"}, {"t": "cond", "kind": "lamplit", "h": "<p><i>If you have a lit lamp, you may raise it and look. Go to <a class=\"eref\" data-go=\"075\">075<\/a>.<\/i><\/p>", "target": "075"}, {"t": "cond", "kind": "other", "h": "<p><i>If you would rather walk away right now, you may. Go to <a class=\"eref\" data-go=\"078\">078<\/a> (the night remembers: LARDER).<\/i><\/p>", "target": "078", "clickGrant": ["LARDER"]}]}, "075": {"act": 1, "region": "The Broken Bridge", "blocks": [{"t": "p", "h": "<p>You raise the lantern.<\/p>"}, {"t": "p", "h": "<p>It is standing in the reeds twenty feet below the arch: a moor bird the size of a wolfhound, grey as standing water, long-legged, its head level with your knees if it were up here, which in about two seconds it will be. The beak is not a beak. It is a spike with a bird behind it.<\/p>"}, {"t": "p", "h": "<p>It has been watching you for some time.<\/p>"}, {"t": "p", "h": "<p>Then the wings go, and there is no cry, just the enormous soft rush of them, and it is inside your reach.<\/p>"}, {"t": "choice", "label": "Continue", "target": "076"}]}, "076": {"act": 1, "region": "The Broken Bridge", "blocks": [{"t": "p", "h": "<p>It is inside your reach and you are on a broken arch with forty feet of air behind your back foot. This is a fight now. <b>Roll initiative.<\/b> Here is what has you.<\/p>"}, {"t": "p", "h": "<p><b>FEN-SHRIKE<\/b><\/p>", "card": true, "cre": true}, {"t": "p", "h": "<p>Medium beast. AC 13. Speed 30 ft., fly 50 ft.<br>STR 12 (+1) DEX 16 (+3) CON 13 (+1) INT 3 (-4) WIS 14 (+2) CHA 5 (-3)<\/p>", "card": true}, {"t": "p", "h": "<p><b>Beak.<\/b> Melee attack, +5 to hit, reach 5 ft. Hit: 1d8+3 piercing damage.<br><b>Silent Rush.<\/b> The shrike has advantage on its first attack roll against a creature that has not yet acted in combat.<\/p>", "card": true}, {"t": "p", "h": "<p><b>How it fights.<\/b><br>Round 1: the shrike attacks with Silent Rush, then does not stay. It flies twenty feet off and lands on the broken arch, out of reach, and looks at you.<br>Round 2 onward: it dives, attacks, and withdraws thirty feet on the same turn. It will not stand still and trade blows with you. It is trying to make you step backward, off a bridge, in the dark.<br>If reduced to half its hit points or fewer: it breaks and flies for the far bank. It does not come back tonight.<br>If you retreat toward the village: it follows for exactly one round, then returns to the larder. It is not hunting you. It is hunting <i>here<\/i>, and you are standing in the pantry.<\/p>", "card": true}, {"t": "cond", "kind": "nell", "h": "<p>She plants herself at the break of the arch and barks at the dark over the water with everything she has. While she stands with you, the shrike's dives lose Silent Rush. Nothing gets to be silent near Nell.<\/p>"}, {"t": "lamp", "ember": "14 HP, and it does not use Silent Rush; you hear the wings in time.", "lantern": "22 HP.", "dark": "22 HP, and if you are standing on the arch when it attacks, you must also make a DC 12 Dexterity saving throw or be pushed 5 feet toward the drop. Fall from the arch: 3d6 bludgeoning and you are in the freezing water. If that drops you to 0 hit points, follow the fail-forward below. Otherwise you get yourself out on the near bank, soaked through, and <b>your lamp is dark: mark off all your remaining oil<\/b>. Go to <a class=\"eref\" data-go=\"078\">078<\/a>."}, {"t": "cond", "kind": "other", "h": "<p><i>If you fight with a shield:<\/i> you set your back foot and put the rim up, because a shield in a narrow place is a wall and not a swatter, and the dive breaks on the boards instead of on your face. It does not stop coming. It only stops being a surprise.<\/p>"}, {"t": "p", "h": "<p><b>Fail-forward:<\/b> if you drop to 0 hit points here on Ember or Lantern, you do not die. The shrike wanted you off the arch and you are off it, and it does not come back down for you. You come to on the near bank with your lamp out and your hair frozen to the stone. Go to <a class=\"eref\" data-go=\"078\">078<\/a>. On Dark Watch, going down on that arch is a death: go to <a class=\"eref\" data-go=\"535\">535<\/a>.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you win:<\/i> → <a class=\"eref\" data-go=\"077\">077<\/a><\/p>", "target": "077"}, {"t": "cond", "kind": "other", "h": "<p><i>If you flee to the near bank:<\/i> → <a class=\"eref\" data-go=\"078\">078<\/a> (the night remembers: LARDER).<\/p>", "target": "078", "clickGrant": ["LARDER"]}], "failFwd": "078", "ffShared": true}, "077": {"act": 1, "region": "The Broken Bridge", "blocks": [{"t": "p", "h": "<p>It goes down in the reeds and does not get up, and the quiet comes back in over the top of it.<\/p>"}, {"t": "p", "h": "<p>You stand on a broken bridge over a river that has stopped talking, with your heart going, and you understand for the first time that the lamp in your hand is not for seeing. It is so that the village can see <i>you<\/i>: a small moving light on the round, at the hours, where it should be.<\/p>"}, {"t": "p", "h": "<p><b>The night remembers: BLOODED.<\/b><\/p>", "ops": [{"op": "grant", "words": ["BLOODED"], "mark": false}]}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b><\/p>", "ops": [{"op": "tick", "n": 1}]}, {"t": "choice", "label": "Get off the bridge", "target": "078"}]}, "078": {"act": 1, "region": "The Broken Bridge", "blocks": [{"t": "p", "h": "<p>You ring in at the bridge post.<\/p>"}, {"t": "p", "h": "<p>Two strokes. And out across the water, fro
