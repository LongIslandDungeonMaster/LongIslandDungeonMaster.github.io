m the empty houses of the Drowned Lane where nobody has lived in a generation, something rings twice back.<\/p>"}, {"t": "choice", "label": "Back to the route", "target": "020"}]}, "090": {"act": 1, "region": "The Cold Comes In", "blocks": [{"t": "p", "h": "<p>You are between posts when the night changes, and it does not do it gradually.<\/p>"}, {"t": "p", "h": "<p>The cold arrives all at once, the way it does when you step down into a cellar. Your breath goes to a plume and the water on the cobbles turns from wet to white. Up in the village a dog that has barked all evening stops in the middle of it.<\/p>"}, {"t": "p", "h": "<p>The smoke along the top of the street is going straight up. There is a wind on your face. The smoke goes straight up anyway.<\/p>"}, {"t": "p", "h": "<p>Dogs stop. Smoke goes straight up when there's a wind. Water does what water shouldn't.<\/p>"}, {"t": "p", "h": "<p>If Hett told you what to watch for, this is his list, all of it, arriving at once. If he did not, you are learning it now.<\/p>"}, {"t": "p", "h": "<p>Your lamp flame shrinks to a bead, steadies, and burns on, drinking hard against the cold. <b>The lamp drinks a unit of oil.<\/b><\/p>", "ops": [{"op": "oil", "d": -1}]}, {"t": "cond", "kind": "nell", "h": "<p>She has stopped. She is pressed against your shin, not trembling, not growling, not making any sound at all, and that is the wrongest thing yet, because until this moment she has had an opinion about everything.<\/p>"}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b><\/p>", "ops": [{"op": "tick", "n": 1}]}, {"t": "choice", "label": "Continue", "target": "091"}]}, "091": {"act": 1, "region": "The Cold Comes In", "blocks": [{"t": "p", "h": "<p>Down the slope, at the bottom of the street where it turns toward the ford, something crosses the road.<\/p>"}, {"t": "p", "h": "<p>It goes left to right through the gap between two houses, at the edge of what your lantern reaches, and it is on two legs, and it is the size of a man, and it is not walking like one. It is walking like someone doing an impression of walking who has only had it described to them.<\/p>"}, {"t": "p", "h": "<p>It does not look up at your light. Everything in this village looks at a light.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If your passive Wisdom (Perception) is 14 or higher, or you make a DC 14 Wisdom (Perception) check, with disadvantage if your lamp is dark:<\/i> you catch the part your eye wanted to skip. It crossed frozen cobbles at the pace of a walk and it made no sound doing it, and you have been listening to your own boots crack that same frost all night.<\/p>"}, {"t": "p", "h": "<p>It is gone in the space of a breath.<\/p>"}, {"t": "choice", "label": "Go after it. Rule three says no", "target": "092"}, {"t": "choice", "label": "Get to a door and warn somebody", "target": "094"}, {"t": "choice", "label": "Stand absolutely still and let it go", "target": "093"}]}, "092": {"act": 1, "region": "The Cold Comes In", "blocks": [{"t": "p", "h": "<p>You go after it only as far as the gap between the houses, at a fast walk you can still call watching rather than chasing. The alley behind the houses is empty, and there is nothing in it but frost.<\/p>"}, {"t": "p", "h": "<p>There are prints in the frost.<\/p>"}, {"t": "p", "h": "<p>They are bare feet. They go from the middle of the alley to the wall of the house at the end, and they stop, and the wall is a wall.<\/p>"}, {"t": "check", "dc": 13, "ability": "Wisdom", "skill": null, "kind": "save", "h": "<p><i>Make a DC 13 Wisdom saving throw.<\/i> <b>On a failure, you spend a long moment with your back against the opposite wall and your lantern held out in front of you like it is a weapon, and the Dawn Track ticks.<\/b><\/p>", "failTick": 1}, {"t": "p", "h": "<p><b>The night remembers: BLACKNAIL.<\/b> somebody in this village worked out what the quiet meant long before you did, and wrote it down where it could be read.<\/p>", "ops": [{"op": "grant", "words": ["BLACKNAIL"], "mark": false}]}, {"t": "choice", "label": "Continue", "target": "095"}]}, "093": {"act": 1, "region": "The Cold Comes In", "blocks": [{"t": "p", "h": "<p>You stand still with your lamp low and you let it go, and it goes.<\/p>"}, {"t": "p", "h": "<p>That is not cowardice. That is the fourth rule, the one Hett could not teach you, and it turns out the fourth rule is <i>know when the night is not about you, and let it pass.<\/i><\/p>"}, {"t": "choice", "label": "Continue", "target": "095"}]}, "094": {"act": 1, "region": "The Cold Comes In", "blocks": [{"t": "p", "h": "<p>You hammer on the nearest door.<\/p>"}, {"t": "p", "h": "<p>It opens on a chain, and a woman's face appears in the gap, and she takes in the tabard and the lantern and your expression in about half a second.<\/p>"}, {"t": "p", "h": "<p>You have a speech. You do not get to use any of it. She says, \"Right,\" and shuts the door, and you hear the bar go across, and then you hear her moving through the house calling two names.<\/p>"}, {"t": "p", "h": "<p>Nobody in Brackenford has ever once been embarrassed about a door.<\/p>"}, {"t": "choice", "label": "Continue", "target": "095"}]}, "095": {"act": 1, "region": "The Cold Comes In", "blocks": [{"t": "p", "h": "<p>The village is going dark around you as you stand there. Not sleeping. Closing. A shutter, then another, then a whole street of them, the sound moving away from you up the slope like something passing.<\/p>"}, {"t": "p", "h": "<p>In four hours of this you have started to learn what tonight is. The cold came down off the hill, quick and quiet, and whatever you have seen on your round, all of it points the same two ways: up the hill, and down at the water.<\/p>"}, {"t": "p", "h": "<p>You have one post left on the round and then it is midnight.<\/p>"}, {"t": "choice", "label": "Take your last post", "target": "020"}]}, "100": {"act": 1, "region": "Midnight", "blocks": [{"t": "p", "h": "<p>You come back down to the water at the end of the round because that is where the round ends.<\/p>"}, {"t": "p", "h": "<p>The ford is gone. Where the Wend ran wide and shallow and brown over the flat stones there is a grey floor, seamless from bank to bank, and the reeds at the edges are set in it like flies in amber. It is not the thin skin you saw at dusk. You could walk a horse over it.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you have Second Wind:<\/i> standing on the bank looking at a river that is now a floor, you take stock the way you were taught to: what is left in your legs, what is left in your lungs, what you have got in you once tonight and once only. It is a short list, and it is not empty.<\/p>"}, {"t": "p", "h": "<p>Doran's chair is where it fell over. Doran is not in it.<\/p>"}, {"t": "choice", "label": "Continue", "target": "101"}]}, "101": {"act": 1, "region": "Midnight", "blocks": [{"t": "p", "h": "<p><i>Count your codewords. This is what your first watch amounted to, and the night will remember every piece of it.<\/i><\/p>"}, {"t": "cond", "kind": "has", "h": "<p>You knew at dusk. You had four hours of knowing, and you spent them ringing a bell at posts, because that was the job you were given. You will think about that.<\/p>", "arg": "ICEBOUND"}, {"t": "cond", "kind": "has", "h": "<p>Somebody in this village trusted you tonight with something they should not have had to carry alone, and asked you, in so many words, to look the other way. You did. You are eight hours into this job and you are already keeping its secrets.<\/p>", "arg": "VOUCHED"}, {"t": "cond", "kind": "has", "h": "<p>There is a clean mug sitting in front of an empty chair in the warmest room in Brackenford, and a woman who has heard her husband at the door on a night exactly like this one.<\/p>", "arg": "MUGSET"}, {"t": "cond", "kind": "has", "h": "<p>A man who has not slept in thirty days is holding a door shut with a bell, and he spoke to you through it, and nothing he said has stopped being true since.<\/p>", "arg": "HANDSIGN"}, {"t": "cond", "kind": "has", "h": "<p>A twelve-year-old boy pointed up the hill, and then down, and could not make the words come.<\/p>", "arg": "WITNESS"}, {"t": "cond", "kind": "has", "h": "<p>Somebody warned this village once, in writing, on its own notice board: <i>do not be on the far bank when it stops.<\/i> However the warning reached you tonight, you know it now, and you know it was not poetry.<\/p>", "arg": "BLACKNAIL"}, {"t": "cond", "kind": "has", "h": "<p>Something keeps a pantry on the near bank of this river, and you have stood over it with a lantern and counted what was on the stakes.<\/p>", "arg": "LARDER"}, {"t": "cond", "kind": "has", "h": "<p>Your hands have stopped shaking. Mostly.<\/p>", "arg": "BLOODED"}, {"t": "choice", "label": "Continue", "target": "102"}]}, "102": {"act": 1, "region": "Midnight", "blocks": [{"t": "p", "h": "<p>Up on the slope behind you, a light is moving.<\/p>"}, {"t": "p", "h": "<p>It is coming down the hill road, and it is coming fast, faster than a careful man goes on a bad path in the dark, and it is swinging the way a lantern swings when somebody is running with it.<\/p>"}, {"t": "p", "h": "<p>You are the watch. You are the only person outside a door in this entire village.<\/p>"}, {"t": "choice", "label": "Go to meet it", "target": "103"}]}, "103": {"act": 1, "region": "Midnight", "blocks": [{"t": "p", "h": "<p>It is Hett Vance, and he has come down that hill road at a dead run in the dark, and when he sees your lantern he stops so hard he nearly goes over.<\/p>"}, {"t": "p", "h": "<p>For a second, before he gets his face back, he looks at you exactly the way Doran looked at the water.<\/p>"}, {"t": "p", "h": "<p>\"You're still out,\" he says.<\/p>"}, {"t": "p", "h": "<p>\"You said ring in at the posts.\"<\/p>"}, {"t": "p", "h": "<p>\"I did.\" He is trying to get his breath and failing. There is frost in his beard. \"Listen to me. I want you to go home. Not the round. Home, and bar it, and I will square it with anyone who asks and no one will.\"<\/p>"}, {"t": "choice", "label": "\"What's up the hill?\"", "target": "104"}, {"t": "choice", "label": "\"Where's Doran?\"", "target": "105"}, {"t": "choice", "label": "\"No.\"", "target": "106"}]}, "104": {"act": 1, "region": "Midnight", "blocks": [{"t": "p", "h": "<p>\"Nothing you can help with,\" Hett says. \"Nothing I can either, and I have had twenty years to work that out.\"<\/p>"}, {"t": "p", "h": "<p>He looks past you at the ford, at the grey floor where a river used to be, and you watch him work out what it means, and you can tell that he has worked it out before, on other nights like this one.<\/p>"}, {"t": "p", "h": "<p>\"That's the third one this year,\" he says quietly. \"It used to be one.\"<\/p>"}, {"t": "choice", "label": "Continue", "target": "107"}]}, "105": {"act": 1, "region": "Midnight", "blocks": [{"t": "p", "h": "<p>Hett does not answer that.<\/p>"}, {"t": "p", "h": "<p>He looks at the overturned chair on the bank, and the strongbox that is not beside it, and then at the hill road he has just come down at a run, and you understand that he knows exactly where Doran is, and that he has known for a year, and that this is why he sent six men away to Aldermere: so they would not be here on a night like this.<\/p>"}, {"t": "p", "h": "<p>\"Go home,\" he says. \"Please.\"<\/p>"}, {"t": "choice", "label": "Continue", "target": "107"}]}, "106": {"act": 1, "region": "Midnight", "blocks": [{"t": "p", "h": "<p>\"No,\" you say.<\/p>"}, {"t": "p", "h": "<p>You are as surprised as he is.<\/p>"}, {"t": "p", "h": "<p>Hett Vance looks at you for a long moment. He drills an empty yard every week. He announces the hour to an empty street. For a year he has been the whole of what stands between this village and the hill, and he has never once said so out loud.<\/p>"}, {"t": "p", "h": "<p>Something in his face gives out.<\/p>"}, {"t": "p", "h": "<p>\"All right,\" he says. \"All right. Then you'll want to know the fourth rule.\"<\/p>"}, {"t": "choice", "label": "Continue", "target": "107"}]}, "107": {"act": 1, "region": "Midnight", "blocks": [{"t": "p", "h": "<p>Behind you, from the shrine at the edge of the square, the bell begins to ring.<\/p>"}, {"t": "p", "h": "<p>It is midnight. It is not dusk and it is not dawn. In a month of a locked door and a careful, exhausted man keeping a schedule to the minute, the bell has rung twice a day and never once between.<\/p>"}, {"t": "p", "h": "<p>It is ringing now. It is ringing fast, and badly, and much too hard, the way a bell rings when the man on the rope has stopped counting strokes and is simply hauling.<\/p>"}, {"t": "p", "h": "<p>Hett Vance says, \"Oh, no.\"<\/p>"}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b><\/p>", "ops": [{"op": "tick", "n": 1}]}, {"t": "p", "h": "<p><b>END OF FIRST WATCH.<\/b><\/p>"}, {"t": "choice", "label": "Continue to <b>Act Two: Middle Watch<\/b>, entry", "target": "200"}]}, "200": {"act": 2, "region": "The Bell At The Wrong Hour", "blocks": [{"t": "p", "h": "<p>The bell does not stop.<\/p>"}, {"t": "p", "h": "<p>The rhythm of a dusk bell is one stroke, a pause the length of a breath, another, unhurried, like a man counting. This is not that. This is a rope being hauled back and forth violently by somebody who has stopped counting, strokes falling over each other, the clapper hitting on the backswing. It is the sound of a bell being rung by a man who has decided the only thing left that matters is that it be loud.<\/p>"}, {"t": "p", "h": "<p>All over Brackenford, shutters that closed an hour ago are opening again. Faces in gaps. The village listening to its own alarm and not knowing what it means, because the bell has never rung an alarm before tonight.<\/p>"}, {"t": "choice", "label": "Continue", "target": "201"}]}, "201": {"act": 2, "region": "The Bell At The Wrong Hour", "blocks": [{"t": "p", "h": "<p>Hett Vance takes about two seconds.<\/p>"}, {"t": "p", "h": "<p>You watch him work it out: one road, one ford, one bell, one recruit, and four places that all need somebody right now.<\/p>"}, {"t": "p", "h": "<p>\"Right,\" he says. \"I'm going up the hill. Doran went up there with the box and he hasn't come down and if the toll wasn't paid tonight then none of the rest of this matters.\"<\/p>"}, {"t": "p", "h": "<p>\"And me?\"<\/p>"}, {"t": "p", "h": "<p>\"You're the watch.\" He is already turning. \"The village is yours. I'm sorry. I'd give you six men if I had them.\"<\/p>"}, {"t": "cond", "kind": "has", "h": "<p>You have already learned tonight that this village runs on people quietly carrying things for it, and you are looking at the man who carries the most, and who is about to go up that hill alone.<\/p>", "arg": "VOUCHED"}, {"t": "choice", "label": "\"Then tell me the fourth rule.\"", "target": "202"}, {"t": "choice", "label": "\"What do I do about the bell?\"", "target": "203"}, {"t": "choice", "label": "Let him go", "target": "205"}]}, "202": {"act": 2, "region": "The Bell At The Wrong Hour", "blocks": [{"t": "p", "h": "<p>He stops.<\/p>"}, {"t": "p", "h": "<p>\"The fourth rule,\" Hett says, \"is that you will want to be the one who fixes it. Every man I ever put in that tabard wanted that. It's why they take the job.\"<\/p>"}, {"t": "p", "h": "<p>The bell hammers on behind him.<\/p>"}, {"t": "p", "h": "<p>\"And the job isn't that. The job is you're a light that moves on a schedule, so a village full of people asleep behind doors knows the night's still got somebody in it. That's all. You don't beat the dark, watchman. You just refuse to leave it on its own.\" He looks at you a moment longer. \"Now: you'll break that rule tonight, because everyone does. Just know which rule it is you're breaking when you do.\"<\/p>"}, {"t": "choice", "label": "Continue", "target": "205"}]}, "203": {"act": 2, "region": "The Bell At The Wrong Hour", "blocks": [{"t": "p", "h": "<p>\"Anselm's rung that bell twice a day for a month without missing,\" Hett says. \"If he's ringing it now, he's got a reason, and the reason is not that he wants company.\"<\/p>"}, {"t": "p", "h": "<p>\"Or somebody else is on the rope.\"<\/p>"}, {"t": "p", "h": "<p>Hett stops.<\/p>"}, {"t": "p", "h": "<p>\"Yes,\" he says slowly. \"Or that.\"<\/p>"}, {"t": "p", "h": "<p>He does not have an answer for it. That is somehow the worst part of the night so far: the captain of the militia standing in the frost with his mouth open, out of answers, in front of the new hire.<\/p>"}, {"t": "choice", "label": "\"Then tell me the fourth rule.\"", "target": "202"}, {"t": "choice", "label": "Let him go", "target": "205"}]}, "205": {"act": 2, "region": "The Bell At The Wrong Hour", "blocks": [{"t": "p", "h": "<p>He goes up the hill road at a run with his lantern swinging, and you stand at the bottom of a village that is waking up frightened, and you are the watch.<\/p>"}, {"t": "p", "h": "<p>Then, out on the ice, something moves.<\/p>"}, {"t": "choice", "label": "Continue", "target": "206"}]}, "206": {"act": 2, "region": "The Bell At The Wrong Hour", "blocks": [{"t": "p", "h": "<p>The ford is a grey floor from bank to bank and there is a man walking across it.<\/p>"}, {"t": "p", "h": "<p>He is coming from the far side, from the Drowned Lane, unhurried, on two legs, in the middle of the crossing where the water used to run deepest. He has no lantern. He is not carrying anything. His arms swing.<\/p>"}, {"t": "p", "h": "<p>He is walking like a man who has walked this crossing ten thousand times, which is the thing that stops your breath, because everyone in Brackenford walks the ford in the same careful hitching way, feeling for the flat stones with their feet, and he is not doing that, because there is nothing under him but ice and he knows it.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you have darkvision:<\/i> your lantern is not telling you anything your own eyes are not, out to the sixty feet they are good for. He is in grey and he is whole and his face is pleasant, and he is not watching the ice under him at all, which is the part you cannot make sense of, because everybody watches the ice.<\/p>"}, {"t": "choice", "label": "Raise the lantern and challenge him", "target": "207"}, {"t": "choice", "label": "Get off the bank and watch from cover", "target": "208"}, {"t": "choice", "label": "Run for the village ahead of him", "target": "210"}]}, "207": {"act": 2, "region": "The Bell At The Wrong Hour", "blocks": [{"t": "p", "h": "<p>\"Stand where you are!\"<\/p>"}, {"t": "p", "h": "<p>Your voice goes out across the ice and comes back off the far bank, and it sounds young.<\/p>"}, {"t": "p", "h": "<p>The man stops.<\/p>"}, {"t": "p", "h": "<p>He stands in the middle of the frozen river with his back to the moor and looks at you across forty feet of grey, and your lantern reaches him, just, at the far end of its throw.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you are a fighter, a barbarian, a monk, or a ranger:<\/i> he stopped the instant you told him to, and he stopped at forty feet, which is the distance a man picks when he wants to be looked at. His hands are empty and open and well away from his sides. He is standing on wet ice in the dead of winter and nothing in his weight is braced against it.<\/p>"}, {"t": "p", "h": "<p>He is a shepherd, forty-odd, a heavy coat, a beard going grey at the chin. There is frost in it. There is frost on his eyelashes and in the seams of his coat and packed white in the folds of his ears, the way frost forms on a thing that has been out all night and is the same temperature as the air.<\/p>"}, {"t": "p", "h": "<p>He says, \"Evening.\" His breath does not show.<\/p>"}, {"t": "choice", "label": "Continue", "target": "211"}]}, "208": {"act": 2, "region": "The Bell At The Wrong Hour", "blocks": [{"t": "p", "h": "<p>You get down behind the overturned chair on the bank and put the lantern behind you, and you watch him come.<\/p>"}, {"t": "p", "h": "<p>He walks up out of the ford and onto the near bank six feet from where you are crouched, and he does not look at you, and you are close enough to hear him.<\/p>"}, {"t": "p", "h": "<p>He is humming. Softly, tunelessly, the way a man does walking home late.<\/p>"}, {"t": "p", "h": "<p>There is frost packed white in the seams of his coat and in his beard, and it is not melting, and he passes you and goes up the slope toward the village and the lights.<\/p>"}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b><\/p>", "ops": [{"op": "tick", "n": 1}]}, {"t": "choice", "label": "Follow him", "target": "211"}]}, "210": {"act": 2, "region": "The Bell At The Wrong Hour", "blocks": [{"t": "p", "h": "<p>You go up the slope ahead of him with your heart going and your lantern swinging and you do not look back until you reach the top of the street, and when you do, he is at the bottom of it, coming up, unhurried, in no particular hurry at all, because he is going somewhere he is certain of.<\/p>"}, {"t": "p", "h": "<p>He is going to the top of the square. To the inn.<\/p>"}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b><\/p>", "ops": [{"op": "tick", "n": 1}]}, {"t": "choice", "label": "Continue", "target": "211"}]}, "211": {"act": 2, "region": "The Bell At The Wrong Hour", "blocks": [{"t": "p", "h": "<p>You know who it is before you let yourself know it.<\/p>"}, {"t": "p", "h": "<p>There is a woman at the top of this village who has set a clean mug in front of an empty chair every dusk for a year, in front of forty people, without breaking conversation, because she is not grieving at all. She is waiting. Once, on a night the ford froze, she heard him at her door.<\/p>"}, {"t": "p", "h": "<p>Tobin Tullamore has come home.<\/p>"}, {"t": "cond", "kind": "has", "h": "<p>She told you herself, with both hands flat on the bar, in the voice she uses for arguments about sheep, and you have been carrying it around ever since without knowing where to put it.<\/p>", "arg": "MUGSET"}, {"t": "choice", "label": "Continue", "target": "220"}]}, "220": {"act": 2, "region": "The Dead Hours", "blocks": [{"t": "p", "h": "<p><b>The dead hours.<\/b><\/p>"}, {"t": "p", "h": "<p>It is somewhere past midnight. The bell is still going. There is a man walking up your village who has been dead since last autumn, and he is going to knock on a door that will be opened.<\/p>"}, {"t": "p", "h": "<p>And there are four places in Brackenford that need the watch right now, and one of you.<\/p>"}, {"t": "p", "h": "<p><i>Choose where you go. When you return here, choose again, somewhere you have not yet been: the night does not offer the same crisis twice.<\/i><\/p>"}, {"t": "cond", "kind": "nell", "h": "<p>She looks down each of the four roads in turn, and then up at you, and waits. She has no advice. She is just not leaving.<\/p>"}, {"t": "choice", "label": "<b>The Broken Wheel.<\/b> Get there before he does", "target": "230"}, {"t": "choice", "label": "<b>The Shrine of the Quiet Hand.<\/b> Somebody is on that rope", "target": "250"}, {"t": "choice", "label": "<b>The Square.<\/b> Anselm told you: go and get the children", "target": "270"}, {"t": "choice", "label": "<b>The hill road.<\/b> After Hett, after Doran, after the answer", "target": "290"}, {"t": "lamp", "ember": "you may visit three of the four before the night moves on.", "lantern": "two.", "dark": "two."}, {"t": "p", "h": "<p><i>When you have used your visits, go to <a class=\"eref\" data-go=\"310\">310<\/a>.<\/i><\/p>"}]}, "230": {"act": 2, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>You come up into the square at a run and the inn is the only building in Brackenford with its shutters still open.<\/p>"}, {"t": "p", "h": "<p>Of course it is. Whatever else Mara Tullamore has barred in her life, she has spent a year keeping this door openable, because a man might come back to it.<\/p>"}, {"t": "p", "h": "<p>There is a light in the window. There is a clean mug on a table in front of an empty chair by a fire that has been kept up.<\/p>"}, {"t": "p", "h": "<p>And there is a knock.<\/p>"}, {"t": "choice", "label": "Continue", "target": "231"}]}, "231": {"act": 2, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>Three knocks. Not loud. The knock of a man who lives there and has lost his key.<\/p>"}, {"t": "p", "h": "<p>Then, through the door, in a voice with a smile in it:<\/p>"}, {"t": "p", "h": "<p>\"Mara. It's cold out here, love.\"<\/p>"}, {"t": "p", "h": "<p>Inside, something falls over. You hear her cross the room. You hear her stop.<\/p>"}, {"t": "p", "h": "<p>You are twenty feet away in the square with a lantern and a tabard and about four seconds.<\/p>"}, {"t": "choice", "label": "Get between him and the door", "target": "232"}, {"t": "choice", "label": "Shout to warn her", "target": "236"}, {"t": "choice", "label": "Go around the back and get in first", "target": "238"}]}, "232": {"act": 2, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>You put yourself on the step between Tobin Tullamore and his own front door, and up close, in lantern light, he is worse.<\/p>"}, {"t": "p", "h": "<p>He is not rotten. Nothing about him is rotten. He is a healthy shepherd of forty-odd with frost in his beard and colour in his cheeks and every single thing right about him except that he is not making breath in the cold, and his eyes track a half-beat late, the way a man's do when he is listening to a translation.<\/p>"}, {"t": "p", "h": "<p>\"You're new,\" he says pleasantly. \"Hett get you? Good lad, Hett. Would you mind? My wife's just inside.\"<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you can turn undead:<\/i> your hand goes to the symbol and stops there. You have raised it at the risen before and you know exactly how that begins, and nothing about this begins that way. He has colour in his cheeks and he is asking after his wife. You do not know what you would be putting it against.<\/p>"}, {"t": "choice", "label": "\"You've been gone a year.\"", "target": "233"}, {"t": "choice", "label": "\"What's your wife's name?\"", "target": "234"}, {"t": "choice", "label": "Say nothing. Stand there", "target": "235"}]}, "233": {"act": 2, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>\"I have,\" Tobin agrees. \"It's been a long one. I've walked a long way tonight, son, and I'd like to sit down.\"<\/p>"}, {"t": "p", "h": "<p>And he says it so exactly right, so tiredly and so warmly and so much like a man at the end of a hard road, that you feel the pull of it in your chest: the enormous, decent, human urge to step aside, because you are twenty-something and standing between a shepherd and his wife.<\/p>"}, {"t": "check", "dc": 14, "ability": "Wisdom", "skill": null, "kind": "save", "h": "<p><i>Make a DC 14 Wisdom saving throw.<\/i><\/p>"}, {"t": "outcome", "which": "success", "blocks": [{"t": "p", "h": "<p>You do not move. → <a class=\"eref\" data-go=\"235\">235<\/a><\/p>"}]}, {"t": "outcome", "which": "failure", "blocks": [{"t": "p", "h": "<p>You take half a step to the side before you catch yourself, and he is already moving, and your shoulder is against the door frame with your arm across it and it is nearly not enough. <b>The Dawn Track ticks.<\/b> → <a class=\"eref\" data-go=\"235\">235<\/a><\/p>", "ops": [{"op": "tick", "n": 1}]}]}]}, "234": {"act": 2, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>\"What's your wife's name?\"<\/p>"}, {"t": "p", "h": "<p>Tobin blinks. \"Mara,\" he says. \"Mara Tullamore. Ran the Wheel since her father. Sets a mug out.\"<\/p>"}, {"t": "p", "h": "<p>It is right. All of it is right, and he answers it easily, and it is the easiness that undoes you, because a thing that had to think about it would be less frightening than a thing that does not.<\/p>"}, {"t": "p", "h": "<p>Then, from the other side of the door, close, barely above a breath, at the height of a woman's mouth against the wood:<\/p>"}, {"t": "p", "h": "<p>\"Tobin. Say the other thing.\"<\/p>"}, {"t": "choice", "label": "Continue", "target": "235"}]}, "235": {"act": 2, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>The door does not open.<\/p>"}, {"t": "p", "h": "<p>There is a long silence on that step, the three of you, and the bell hammering away across the square, and then Mara Tullamore says, through her own front door, in a voice so level it takes you a moment to hear what it costs:<\/p>"}, {"t": "p", "h": "<p>\"You've not asked after the dog.\"<\/p>"}, {"t": "p", "h": "<p>Nothing on the step moves.<\/p>"}, {"t": "p", "h": "<p>\"He'd have asked after the dog,\" she says. \"First thing, before me, every time, thirty years. Where's the dog.\" A breath. \"You've not asked.\"<\/p>"}, {"t": "p", "h": "<p>And the thing on the doorstep stops smiling. Not angrily. It simply stops, the way a candle flame stops when it is snuffed, all at once and completely.<\/p>"}, {"t": "choice", "label": "Continue", "target": "240"}]}, "236": {"act": 2, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>You shout her name across the square.<\/p>"}, {"t": "p", "h": "<p>The door opens.<\/p>"}, {"t": "p", "h": "<p>It opens because a woman who has waited a year hears a shout outside and thinks <i>something is happening to him<\/i>, and she has her hand on the latch before the thought finishes, and this is not stupidity, this is what a year of hoping does to a person.<\/p>"}, {"t": "p", "h": "<p>Mara Tullamore stands in her own doorway in the light with her husband in front of her.<\/p>"}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b><\/p>", "ops": [{"op": "tick", "n": 1}]}, {"t": "choice", "label": "Continue", "target": "237"}]}, "237": {"act": 2, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>For a second nobody does anything.<\/p>"}, {"t": "p", "h": "<p>Mara looks at him. He looks at her. He says, \"Hello, love,\" and it is his voice, it is absolutely his voice, and you watch a year come apart in a woman's face.<\/p>"}, {"t": "p", "h": "<p>And then she looks at his beard, at the frost packed white in it, at the air in front of his mouth where his breath is not.<\/p>"}, {"t": "p", "h": "<p>She is a woman who has run a room of forty drunk men for thirty years, and you will never in your life forget how fast she moves. The door slams. The bar comes down. It happens in less than a second and it happens with her husband's hand on the frame, and the door catches his fingers, and he does not react to that at all.<\/p>"}, {"t": "choice", "label": "Continue", "target": "240"}]}, "238": {"act": 2, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>You go around the back through the yard, over the wall, in through the scullery where Mara has left the latch off the way she has left it off every night for a year.<\/p>"}, {"t": "p", "h": "<p>You come out into the common room behind her.<\/p>"}, {"t": "p", "h": "<p>She is standing at the door with her hand on the bar and her forehead against the wood and she is listening to her husband ask to be let in, and she has been standing like that for some time.<\/p>"}, {"t": "p", "h": "<p>She does not turn around. She says, \"Don't.\"<\/p>"}, {"t": "choice", "label": "\"Don't what?\"", "target": "239"}, {"t": "choice", "label": "Say nothing", "target": "239"}]}, "239": {"act": 2, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>\"Don't tell me,\" Mara says. \"I know. I've known since the second knock. He always did four.\"<\/p>"}, {"t": "p", "h": "<p>Her hand is still on the bar. She has not moved it and she has not lifted it.<\/p>"}, {"t": "p", "h": "<p>\"A year I've kept that mug.\" Her voice does not break, and that is the thing you will carry. \"And it came, and it's not him, and I have to be the one that keeps the door. Not you. Me. Or I'll spend the rest of my life wondering.\" She finally looks at you. \"So stand there and let me do it.\"<\/p>"}, {"t": "p", "h": "<p>You stand there.<\/p>"}, {"t": "p", "h": "<p>Outside, a voice with a smile in it says her name twice more, and then stops.<\/p>"}, {"t": "choice", "label": "Continue", "target": "240"}]}, "240": {"act": 2, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>The thing that is not Tobin Tullamore stands on the step for a while.<\/p>"}, {"t": "p", "h": "<p>Then it walks away, unhurried, back down the square toward the ford, and it does not look at the windows it passes, and the frost on the cobbles does not squeak under it.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you can cast detect magic:<\/i> you get it off before the thing reaches the corner, and the reading is worse than any reading would have been. There is nothing on it. No school, no residue, no working of any kind laid on a shepherd who has been dead since autumn. Nobody cast this.<\/p>"}, {"t": "p", "h": "<p>Inside, Mara sits down on the floor with her back against the door she has just kept, and she does not cry, and she says, \"Get out. Please. I'll be all right in the morning and I won't be able to look at you for a month.\"<\/p>"}, {"t": "p", "h": "<p><b>The night remembers: DOORHELD.<\/b><\/p>", "ops": [{"op": "grant", "words": ["DOORHELD"], "mark": false}]}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b><\/p>", "ops": [{"op": "tick", "n": 1}]}, {"t": "choice", "label": "Continue", "target": "241"}]}, "241": {"act": 2, "region": "The Broken Wheel", "blocks": [{"t": "p", "h": "<p>On the table by the fire, the clean mug is still there in front of the empty chair.<\/p>"}, {"t": "p", "h": "<p>Halfway to the door you stop, because you have understood something and it is too late to unknow it.<\/p>"}, {"t": "p", "h": "<p>It knew to come here. Of everything in this village, of every door with a light behind it, it came up the whole length of the square to the one door in Brackenford that was going to open.<\/p>"}, {"t": "p", "h": "<p>Something has been watching how this village grieves.<\/p>"}, {"t": "choice", "label": "Back to the dead hours", "target": "220"}]}, "250": {"act": 2, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>You go in with the lamp up, because whatever is on that rope, you want to see it. <b>The lamp drinks a unit of oil.<\/b><\/p>", "ops": [{"op": "oil", "d": -1}]}, {"t": "p", "h": "<p>The noise inside the shrine is enormous.<\/p>"}, {"t": "p", "h": "<p>You have heard this bell from across the village every dusk of your life and you have never heard it from six feet away, and it is not a sound anymore, it is a force you feel in your chest and in your teeth. The stone is shaking. The frozen leaves piled against the door are dancing on the step.<\/p>"}, {"t": "p", "h": "<p>The door has not opened in a month.<\/p>"}, {"t": "choice", "label": "Knock", "target": "251"}, {"t": "choice", "label": "Break it down", "target": "253"}, {"t": "choice", "label": "Try the door", "target": "252"}]}, "251": {"act": 2, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>You hammer on it with the side of your fist and you get nothing, because nothing could be heard in there, because there is a bell going off inside a stone box.<\/p>"}, {"t": "p", "h": "<p>You are going to have to open it.<\/p>"}, {"t": "choice", "label": "Break it down", "target": "253"}, {"t": "choice", "label": "Try the door", "target": "252"}]}, "252": {"act": 2, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>You try the latch first, because you are the sort of person who tries the latch first, and this is the second time tonight that being that sort of person has been worth something.<\/p>"}, {"t": "p", "h": "<p>It is not locked.<\/p>"}, {"t": "p", "h": "<p>It has not been locked all month. A man sat in a chair behind an unlocked door for thirty days and the entire village agreed, without ever discussing it, that the door was shut. You think about the leaves frozen against it. Nobody even tried.<\/p>"}, {"t": "choice", "label": "Go in", "target": "254"}]}, "253": {"act": 2, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "check", "dc": 13, "ability": "Strength", "skill": "Athletics", "kind": "check", "h": "<p><i>Make a DC 13 Strength (Athletics) check. On Dark Watch, the door is old oak swollen into a frozen frame: DC 15.<\/i><\/p>", "tdc": {"dark": 15}}, {"t": "outcome", "which": "success", "blocks": [{"t": "p", "h": "<p>You work out on the first try what the last watchman never did: it opens outward. You haul it wide and the noise comes out at you like weather. → <a class=\"eref\" data-go=\"254\">254<\/a><\/p>"}]}, {"t": "outcome", "which": "failure", "blocks": [{"t": "p", "h": "<p>You put your shoulder into a door that opens outward, twice, before you work out what is wrong with the situation. Take 1d4 bludgeoning damage, feel exactly as clever as you deserve, and <b>The Dawn Track ticks.<\/b>. → <a class=\"eref\" data-go=\"252\">252<\/a><\/p>", "ops": [{"op": "tick", "n": 1}]}]}], "own": {"254": "success", "252": "failure"}}, "254": {"act": 2, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>Inside is a forest of dead candles and a wall of sound.<\/p>"}, {"t": "p", "h": "<p>Brother Anselm is on the rope. He is a gaunt man in a robe that has not been off him in a month and he is hauling with both hands and the whole of his weight, over and over, badly, out of time, and he has been doing it long enough that his palms have opened up and there is blood on the rope in a band the width of a hand.<\/p>"}, {"t": "p", "h": "<p>He does not hear you. He does not hear anything. He is thirty days without sleep and long past the end of his strength, and he is ringing.<\/p>"}, {"t": "choice", "label": "Take the rope from him", "target": "255"}, {"t": "choice", "label": "Get in front of him where he can see you", "target": "256"}]}, "255": {"act": 2, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>You get a hand on the rope above his and take the weight, and for a moment he fights you for it, with surprising strength, the way a drowning man fights.<\/p>"}, {"t": "p", "h": "<p>Then he sees the tabard.<\/p>"}, {"t": "p", "h": "<p>Anselm lets go and steps back and stands swaying in the middle of his own shrine with his hands open in front of him, palms up, red, and looks at them as though they belong to somebody he used to know.<\/p>"}, {"t": "p", "h": "<p>The bell runs down. It takes a long time. The last few strokes come slower and slower and the silence that arrives afterward is the loudest thing that has happened tonight.<\/p>"}, {"t": "choice", "label": "Continue", "target": "257"}]}, "256": {"act": 2, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>You get in front of him and he looks straight through you for three full strokes before you resolve into a person.<\/p>"}, {"t": "p", "h": "<p>\"You,\" he says. He does not stop hauling. \"The watch. Good. Good.\"<\/p>"}, {"t": "p", "h": "<p>\"What are you doing?\"<\/p>"}, {"t": "p", "h": "<p>\"Waking them.\" Haul. \"Every soul in this village. Waking them.\" Haul. \"Because I have rung this bell on its exact schedule for thirty days, believing the schedule itself was the lock that kept the thing on the hill out, and I have just broken it on purpose, and now they will all know something is wrong, which is the only thing I have left that is worth anything.\"<\/p>"}, {"t": "choice", "label": "Take the rope from him", "target": "255"}]}, "257": {"act": 2, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>In the silence Anselm sits down on the step of his own altar, which is the first time he has sat anywhere but that chair in a month.<\/p>"}, {"t": "p", "h": "<p>\"It crossed the ford,\" he says. \"I watched it come down off the hill and across the ice. I have been watching that hill through a shutter for thirty days and tonight something walked off it.\"<\/p>"}, {"t": "p", "h": "<p>He looks at his hands.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you are proficient in Religion:<\/i> you know the rite he means. The dusk bell of the Quiet Hand is a courtesy to the dead and a call to the living, and in every liturgy you have ever read that is the whole of it. In every liturgy you have read that is all it is ever said to be. Whether it is also the other thing, no book you have ever read has claimed either way.<\/p>"}, {"t": "p", "h": "<p>\"So I rang. At midnight. Which I have never done.\" A small dry sound that might be a laugh. \"There. It is done. Thirty days of a lock I could not test, and I have broken it myself, on purpose, to make a noise.\"<\/p>"}, {"t": "choice", "label": "\"You did the right thing.\"", "target": "258"}, {"t": "choice", "label": "\"Was it the lock?\"", "target": "259"}, {"t": "choice", "label": "\"Can you stand?\"", "target": "260"}]}, "258": {"act": 2, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>\"I do not know that,\" Anselm says. \"That is what I am telling you. I have never known that.\"<\/p>"}, {"t": "p", "h": "<p>He looks up, and for the first time there is something in his face other than exhaustion.<\/p>"}, {"t": "p", "h": "<p>\"But there is somebody standing in my shrine at two in the morning in a tabard, which is more than this village has managed in a month, and I find I have stopped being able to do this alone.\" He works his ruined hands open and closed. \"So perhaps. Perhaps I did.\"<\/p>"}, {"t": "choice", "label": "\"Can you stand?\"", "target": "260"}]}, "259": {"act": 2, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>\"Ask me at dawn,\" he says.<\/p>"}, {"t": "p", "h": "<p>\"That's not an answer.\"<\/p>"}, {"t": "p", "h": "<p>\"No. It is the only honest one available and I have spent a month learning to live inside it.\" He tips his head back against the altar. \"Everything I have done since the harvest has been done on a belief I cannot test. So has everything Sefa does with her crusts on the stone. So has everything Goodwife Alder decided in her kitchen. Three of us, watchman, holding this village up with three different guesses, none of us speaking to the others, and it has <i>worked<\/i>, and not one of us knows which part is the part that works.\"<\/p>"}, {"t": "choice", "label": "\"Can you stand?\"", "target": "260"}]}, "260": {"act": 2, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>He can, barely, and he does not want to.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you get him up and out, or if you make a DC 12 Wisdom (Medicine) check to see how far gone he actually is:<\/i> thirty days without sleep has done what thirty days without sleep does. He is not mad. He is starved and frozen and hallucinating from exhaustion and he needs a warm room and eight hours, and he will not have them, because he will not go.<\/p>"}, {"t": "p", "h": "<p>\"The bell is rung,\" Anselm says. \"The village is awake. I have nothing else.\" Then, with his eyes already closing: \"Take it.\"<\/p>"}, {"t": "p", "h": "<p>\"Take what?\"<\/p>"}, {"t": "p", "h": "<p>\"The vigil.\" He is not being poetic. He is handing over a job. \"It is yours. You are the one who is outside.\"<\/p>"}, {"t": "p", "h": "<p><b>The night remembers: RELIEVED.<\/b><\/p>", "ops": [{"op": "grant", "words": ["RELIEVED"], "mark": false}]}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b><\/p>", "ops": [{"op": "tick", "n": 1}]}, {"t": "choice", "label": "Continue", "target": "261"}]}, "261": {"act": 2, "region": "The Shrine Of The Quiet Hand", "blocks": [{"t": "p", "h": "<p>You leave him wrapped in the altar cloth on the floor of his own shrine, asleep before you reach the door, for the first time in a month.<\/p>"}, {"t": "p", "h": "<p>The bell rope hangs in the dark with a band of blood on it at the height of a man's hands.<\/p>"}, {"t": "cond", "kind": "has", "h": "<p>He told you at dusk that the bell was the whole of the lock, and now you are the one holding the rope, and the lock is a job rather than a mystery.<\/p>", "arg": "HANDSIGN"}, {"t": "choice", "label": "Back to the dead hours", "target": "220"}]}, "270": {"act": 2, "region": "The Square", "blocks": [{"t": "p", "h": "<p><i>The children.<\/i><\/p>"}, {"t": "cond", "kind": "has", "h": "<p>Anselm said it at dusk, through a shut door, and you had no idea it was an instruction until now.<\/p>", "arg": "HANDSIGN"}, {"t": "cond", "kind": "else", "h": "<p><i>Nobody told you. You work it out yourself, standing in a square full of people in their nightclothes, counting the ones who are too small to be out here.<\/i><\/p>", "chain": true}, {"t": "p", "h": "<p>The square is not empty now. The bell has done what Anselm meant it to do: there are people in the doorways all around it, in coats over nightclothes, forty or fifty of them, looking at each other and at the shrine and at you, waiting for somebody to say the thing that turns a frightened crowd into a village doing something.<\/p>"}, {"t": "p", "h": "<p>Every face turns to the tabard.<\/p>"}, {"t": "choice", "label": "Continue", "target": "271"}]}, "271": {"act": 2, "region": "The Square", "blocks": [{"t": "p", "h": "<p>You have never spoken to fifty people in your life.<\/p>"}, {"t": "p", "h": "<p><i>Choose how you handle it. There is no wrong answer, but there is an honest one.<\/i><\/p>"}, {"t": "choice", "label": "Tell them the truth: the ford is frozen, something came across it, get inside", "target": "272"}, {"t": "choice", "label": "Tell them what to do and not why", "target": "273"}, {"t": "choice", "label": "Find Goodwife Alder and let her do it", "target": "274"}]}, "272": {"act": 2, "region": "The Square", "blocks": [{"t": "p", "h": "<p>You tell them, and it goes badly for about ten seconds.<\/p>"}, {"t": "p", "h": "<p>A woman starts crying. A man at the back says <i>the ford's froze<\/i> in the particular voice of somebody repeating a thing to make it smaller, and it does not get smaller, it gets around the square in about four seconds.<\/p>"}, {"t": "p", "h": "<p>Then a big man you do not know says, \"Right, whose kids are out?\" and the whole thing turns over, because the one thing a frightened village is genuinely excellent at is counting children.<\/p>"}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b><\/p>", "ops": [{"op": "tick", "n": 1}]}, {"t": "choice", "label": "Continue", "target": "275"}]}, "273": {"act": 2, "region": "The Square", "blocks": [{"t": "p", "h": "<p>\"Everyone inside. Bar the doors. Now.\"<\/p>"}, {"t": "p", "h": "<p>It is the tabard that does it, not you. Fifty people in a cold square hear an instruction in a uniform and about forty of them start moving, and it is going well right up until a woman at the front says, \"Where's Ada?\"<\/p>"}, {"t": "p", "h": "<p>And then it is not going well, because you have told them to get behind doors without telling them why, and now there is a child unaccounted for and no information in the square, and panic fills a vacuum faster than sense does.<\/p>"}, {"t": "p", "h": "<p><b>The Dawn Track ticks twice.<\/b><\/p>", "ops": [{"op": "tick", "n": 2}]}, {"t": "choice", "label": "Continue", "target": "275"}]}, "274": {"act": 2, "region": "The Square", "blocks": [{"t": "p", "h": "<p>Goodwife Alder is already in the square.<\/p>"}, {"t": "p", "h": "<p>She is a plump, gracious woman in a good coat over her nightdress and she is standing at the edge of the crowd being visibly nobody in particular, and when you go to her she looks at you with an expression you will not understand for another year.<\/p>"}, {"t": "p", "h": "<p>\"You'll want me to say it,\" she says.<\/p>"}, {"t": "p", "h": "<p>\"They'll listen to you.\"<\/p>"}, {"t": "p", "h": "<p>\"They will.\" She sighs, and it is the sigh of a woman who has been running this village from a kitchen table for a decade and would have liked, once, for it to have cost somebody else something. \"Help me up onto the well, dear. Nobody can hear me from level ground.\"<\/p>"}, {"t": "p", "h": "<p>She stands on the lip of the dry well and says eleven sentences and the square empties in under two minutes with every child accounted for.<\/p>"}, {"t": "choice", "label": "Continue", "target": "275"}]}, "275": {"act": 2, "region": "The Square", "blocks": [{"t": "p", "h": "<p>And then somebody screams from the far side of the square, and the count goes wrong.<\/p>"}, {"t": "p", "h": "<p>There is a child up on the wellhead. Six, maybe seven, in a nightshirt and somebody's boots, standing on the stone lip in the light of the lantern somebody left on the wellhead, and she is not screaming. Her mother is.<\/p>"}, {"t": "p", "h": "<p>The child is looking down at the plank cover.<\/p>"}, {"t": "p", "h": "<p>The plank cover is pushed aside about a hand's width, and it is moving.<\/p>"}, {"t": "choice", "label": "Continue", "target": "276"}]}, "276": {"act": 2, "region": "The Square", "blocks": [{"t": "p", "h": "<p>You get about four steps before the first one comes out.<\/p>"}, {"t": "p", "h": "<p>It comes up out of a dry well like something poured upward: long grey legs, a body the size of a wolfhound, wings that open with a sound like a sail filling. It makes no call. It lands on the wellhead beside the child, folds, and turns its head to look at the fifty people in the square with the flat interest of a thing deciding where to start.<\/p>"}, {"t": "p", "h": "<p>The second one is already out and standing on the notice board.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you are proficient in Animal Handling:<\/i> neither of them is angry, and that is the part that frightens you. Wild things puff and bluster and warn you off first. These two are quiet and loose and unhurried, and the one on the wellhead has not once looked down at the child beside it, because it does not need to. It already knows where she is.<\/p>"}, {"t": "cond", "kind": "has", "h": "<p>You know exactly what these are, and you know how they hunt: in pairs, one chasing the prey into a panic while the other waits where the running will end.<\/p>", "arg": "LARDER"}, {"t": "choice", "label": "Continue", "target": "277"}]}, "277": {"act": 2, "region": "The Square", "blocks": [{"t": "p", "h": "<p>The square empties around you in every direction at once: fifty people running for fifty doors, and two grey shapes owning the air above them, and one child standing still on the wellhead in a circle of lantern light. You are the only armed thing in Brackenford moving toward the well instead of away from it.<\/p>"}, {"t": "p", "h": "<p>This is a fight now. <b>Roll initiative.<\/b> Here is what you are fighting, and how it will behave.<\/p>"}, {"t": "p", "h": "<p><b>FEN-SHRIKE (two)<\/b><\/p>"}, {"t": "p", "h": "<p>Medium beast. AC 13. Speed 30 ft., fly 50 ft.<br>STR 12 (+1) DEX 16 (+3) CON 13 (+1) INT 3 (-4) WIS 14 (+2) CHA 5 (-3)<\/p>", "card": true}, {"t": "p", "h": "<p><b>Beak.<\/b> Melee attack, +5 to hit, reach 5 ft. Hit: 1d8+3 piercing damage.<br><b>Silent Rush.<\/b> Advantage on its first attack roll against a creature that has not yet acted in combat.<\/p>", "card": true}, {"t": "p", "h": "<p><b>How the pair fights.<\/b> They hunt like a team that has done this before, and each has a job.<br><b>The first shrike<\/b>, the one that landed on the notice board, is the chaser. On its turn it flies at the biggest cluster of running villagers to scatter them. It only attacks a person if nothing gets in its way.<br><b>The second shrike<\/b>, the one on the wellhead, is the catcher. It stays beside the child and attacks the first thing that comes within ten feet of the well. It chases nobody. It is waiting for what the chaser drives toward it.<br>Round 1: if you go for the child, the catcher attacks you with Silent Rush. If you go for the chaser instead, the catcher grabs the child.<br>If either shrike drops to half its hit points or fewer, it screams, the first sound either has made, and both fly for the far bank together.<br>If you get the child off the wellhead and behind a door, both leave within two rounds. They did not come here to fight you. They came here to hunt.<br><b>Getting her out:<\/b> the well is thirty feet from the nearest door. Reaching her takes your move; lifting her off the wellhead takes your action, and if the catcher is alive and within ten feet of the well, it gets one attack against you as you lift her. Carrying her, you move at half speed. Any door on that square opens for a child without being asked.<\/p>", "card": true}, {"t": "cond", "kind": "other", "h": "<p><i>If you fight with a shield:<\/i> you get the rim up over the both of you as you lift her, and you take the catcher on the boards instead of on your back. You carry her out one armed and half blind behind it, and your back will remember it for a week.<\/p>"}, {"t": "cond", "kind": "nell", "h": "<p>Send her to the wellhead and she goes, flat out, and stands over the child. The catcher will not go near her. A dog standing its ground over a child is nothing it has ever hunted, and it does not know what to do with one, so while Nell guards the child, the shrike attacks Nell instead of taking her.<\/p>"}, {"t": "lamp", "ember": "14 HP each, and the chaser circles the square before its first dive, which buys you a full round.", "lantern": "22 HP each.", "dark": "22 HP each, they act on the same initiative count, and the catcher grabs the child on round one unless you are already within reach of the well."}, {"t": "p", "h": "<p><b>If you retreat:<\/b> back away from the well and neither bird follows you. They are not hunting you and they never were. You will hear what happens behind you, and the square will hear that you heard it. Go to <a class=\"eref\" data-go=\"279\">279<\/a>.<\/p>"}, {"t": "p", "h": "<p><b>Fail-forward:<\/b> if you drop to 0 hit points here on Ember or Lantern, you do not die. They are not hunting you and they never were: they take what they came for and they go, and you wake on the cobbles with the square empty around you. Go to <a class=\"eref\" data-go=\"279\">279<\/a>. On Dark Watch, going down in the open with those two on the square is a death: go to <a class=\"eref\" data-go=\"535\">535<\/a>.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you drive them off or drop them:<\/i> → <a class=\"eref\" data-go=\"278\">278<\/a><\/p>", "target": "278"}, {"t": "cond", "kind": "other", "h": "<p><i>If the child is taken:<\/i> → <a class=\"eref\" data-go=\"279\">279<\/a><\/p>", "target": "279"}], "failFwd": "279", "ffShared": true}, "278": {"act": 2, "region": "The Square", "blocks": [{"t": "p", "h": "<p>They go over the roofs toward the water and they are gone.<\/p>"}, {"t": "p", "h": "<p>The child is handed down off the wellhead into about six pairs of arms at once and carried away shrieking, which is the best sound anybody in Brackenford has heard all night, and the square empties properly this time, fast and quiet and with the doors going in a rolling wave up the street.<\/p>"}, {"t": "p", "h": "<p>Somebody puts a hand on your shoulder from behind and is gone before you turn around.<\/p>"}, {"t": "p", "h": "<p><b>The night remembers: SHELTERED and BLOODED.<\/b><\/p>", "ops": [{"op": "grant", "words": ["SHELTERED", "BLOODED"], "mark": false}]}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b><\/p>", "ops": [{"op": "tick", "n": 1}]}, {"t": "choice", "label": "Continue", "target": "280"}]}, "279": {"act": 2, "region": "The Square", "blocks": [{"t": "p", "h": "<p>It takes her off the wellhead and out over the square, low, unhurried, and it is gone over the roofs before the sound reaches you.<\/p>"}, {"t": "p", "h": "<p>You are going to get her back. That is not optimism, that is the only thought available: it went northwest, toward the water, toward the far bank, toward a lane of half-sunk houses where something keeps a larder of small neat corpses on broken reeds.<\/p>"}, {"t": "p", "h": "<p>The square behind you makes a sound you have never heard a group of people make.<\/p>"}, {"t": "p", "h": "<p><b>The night remembers: TAKEN.<\/b><\/p>", "ops": [{"op": "grant", "words": ["TAKEN"], "mark": false}]}, {"t": "p", "h": "<p><b>The Dawn Track ticks twice.<\/b><\/p>", "ops": [{"op": "tick", "n": 2}]}, {"t": "choice", "label": "Continue", "target": "280"}]}, "280": {"act": 2, "region": "The Square", "blocks": [{"t": "p", "h": "<p>You slide the plank cover back over the well and this time you sit on it.<\/p>"}, {"t": "p", "h": "<p>The dry well. Years dry. And two moor birds came up out of it into the middle of a village that sits half a mile from the nearest fen.<\/p>"}, {"t": "p", "h": "<p>They did not fly in. They came <i>up<\/i>.<\/p>"}, {"t": "p", "h": "<p>There is something under Brackenford that connects to the wet country, and it has been under here the whole time, and tonight it is open.<\/p>"}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b><\/p>", "ops": [{"op": "tick", "n": 1}]}, {"t": "choice", "label": "Back to the dead hours", "target": "220"}]}, "290": {"act": 2, "region": "The Hill Road", "blocks": [{"t": "p", "h": "<p>Rule three: if you see something you don't understand, you do not chase it, you come and get me.<\/p>"}, {"t": "p", "h": "<p>The man who gave you that rule went up this road forty minutes ago and has not come back, and there is nobody left to get.<\/p>"}, {"t": "p", "h": "<p>The hill road leaves the back of the village and climbs, grown over but walkable, toward the square black shape of Caer Brack against a sky with too many stars in it. The frost on it is thick enough to hold a print.<\/p>"}, {"t": "choice", "label": "Go up", "target": "291"}, {"t": "choice", "label": "Turn around. This is the rule and it is the good rule", "target": "299"}]}, "291": {"act": 2, "region": "The Hill Road", "blocks": [{"t": "p", "h": "<p>There are prints in the frost and you can read them like a page.<\/p>"}, {"t": "p", "h": "<p>Hett's, going up, long strides, running. Doran's, going up earlier, heavier, one boot dragging slightly the way a man walks when he is carrying something in both arms.<\/p>"}, {"t": "p", "h": "<p>And a third set, coming down, over the top of both.<\/p>"}, {"t": "p", "h": "<p>Bare feet.<\/p>"}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b><\/p>", "ops": [{"op": "tick", "n": 1}]}, {"t": "choice", "label": "Keep going", "target": "292"}]}, "292": {"act": 2, "region": "The Hill Road", "blocks": [{"t": "p", "h": "<p>Halfway up, where the road bends around a shoulder of the hill and the whole village lays itself out below you in the dark, you find the strongbox.<\/p>"}, {"t": "p", "h": "<p>It is sitting in the middle of the road, upright, closed, neatly, on a patch of frost that has been swept clear around it in a rough circle about a yard across.<\/p>"}, {"t": "p", "h": "<p>It is not damaged. It has not been forced. It is simply sitting there in the road with the coins still in it, the way a thing is put down by somebody who has been handed it and found it did not interest them.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you are proficient in Investigation:<\/i> the swept circle around it is the wrong shape for wind and the wrong shape for a man with a broom. The frost was not brushed outward from the box. It was pushed back from something that stood where the box is standing.<\/p>"}, {"t": "cond", "kind": "has", "h": "<p>Doran Welk has carried this box up this road on freezing nights for a year, because the year he refused, his eldest did not come home.<\/p>", "arg": "VOUCHED"}, {"t": "choice", "label": "Open it", "target": "293"}, {"t": "choice", "label": "Leave it", "target": "294"}]}, "293": {"act": 2, "region": "The Hill Road", "blocks": [{"t": "p", "h": "<p>Coppers, mostly. A year of a village's crossings, counted and bagged in linen, and a few silver on the top, and a folded square of paper.<\/p>"}, {"t": "p", "h": "<p>The paper is a list of names in a careful hand. Eleven of them. Nine have been crossed out.<\/p>"}, {"t": "p", "h": "<p>Tobin Tullamore is the fourth name. It was crossed out last autumn.<\/p>"}, {"t": "p", "h": "<p>Two names are not crossed out. One is Doran Welk.<\/p>"}, {"t": "p", "h": "<p>The other is Hett Vance.<\/p>"}, {"t": "p", "h": "<p>You fold the paper again and put it inside your coat, against your chest, because it should not be sitting in a box in a road.<\/p>"}, {"t": "p", "h": "<p><b>The night remembers: TOLLPAID.<\/b><\/p>", "ops": [{"op": "grant", "words": ["TOLLPAID"], "mark": false}]}, {"t": "choice", "label": "Continue", "target": "294"}]}, "294": {"act": 2, "region": "The Hill Road", "blocks": [{"t": "p", "h": "<p>Fifty yards further up, at the place where the road levels out before the last climb to the gate of the keep, you find Doran.<\/p>"}, {"t": "p", "h": "<p>He is sitting with his back against the bank at the side of the road, in the position of a man who sat down for a moment to get his breath on a hard walk, and his hands are open in his lap, and there is frost on him, all over him, in the seams of his coat and packed white in his beard and in the folds of his ears.<\/p>"}, {"t": "p", "h": "<p>His eyes are open. They have frost on them too.<\/p>"}, {"t": "choice", "label": "Continue", "target": "295"}]}, "295": {"act": 2, "region": "The Hill Road", "blocks": [{"t": "p", "h": "<p>In this cold there is no way to tell how long he has been dead. But the ground under him is not thawed at all, and a living man sitting for even a minute melts the frost beneath him. Whatever happened to Doran happened the moment he sat down.<\/p>"}, {"t": "p", "h": "<p>There is no wound on him. Nothing took anything from him. He walked up this road with a box of coppers to pay a toll he hated on behalf of a village that resented him for collecting it, and something met him on the way, and looked at him, and did not want the box.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you have a healing spell or a healer's kit:<\/i> you try anyway. You are young and it is Doran and your hands do it before you decide to. Then they stop, because there is nothing under them to work on. You spend nothing. Nothing in this man is broken. He is whole. He is simply finished.<\/p>"}, {"t": "cond", "kind": "has", "h": "<p>You have spent tonight keeping this village's quiet things quiet, and here is where that ends up: a man who asked nothing of anybody, on a road nobody made him walk, with frost in his beard.<\/p>", "arg": "VOUCHED"}, {"t": "choice", "label": "Continue", "target": "296"}]}, "296": {"act": 2, "region": "The Hill Road", "blocks": [{"t": "p", "h": "<p>You are ninety yards from the gate of Caer Brack. From here you can see through it: the bailey, the waist-high gorse, and in the corner, the head of a stone stair going down.<\/p>"}, {"t": "p", "h": "<p>The stair is swept. Somebody keeps it clear of leaves. There is no reason for that to be true and it is true and it has been true for years.<\/p>"}, {"t": "p", "h": "<p>Cold comes off it in a slow steady pour, and it smells of wet rock and, faintly, of tallow.<\/p>"}, {"t": "p", "h": "<p>A candle is burning down there.<\/p>"}, {"t": "choice", "label": "Go through the gate", "target": "297"}, {"t": "choice", "label": "Take Doran home", "target": "298"}]}, "297": {"act": 2, "region": "The Hill Road", "blocks": [{"t": "p", "h": "<p>You get as far as the gateway.<\/p>"}, {"t": "p", "h": "<p>You stand in it with your lantern up, at the top of a stair going down into stone older than the keep on top of it, in a pour of cold air with a candle burning somewhere below, and you are alone, and it is two in the morning, and you have been the watch for eight hours.<\/p>"}, {"t": "check", "dc": 15, "ability": "Wisdom", "skill": null, "kind": "save", "h": "<p><i>Make a DC 15 Wisdom saving throw. Dark Watch: DC 17.<\/i><\/p>", "tdc": {"dark": 17}}, {"t": "outcome", "which": "success", "blocks": [{"t": "p", "h": "<p>You look at it for a long moment, and then you understand, completely and without any shame at all, that this is not tonight. → <a class=\"eref\" data-go=\"298\">298<\/a><\/p>"}]}, {"t": "outcome", "which": "failure", "blocks": [{"t": "p", "h": "<p>You take three steps down before you come back to yourself with no memory of deciding to, and you go back up much faster than you went down. Take 1d6 psychic damage and <b>The Dawn Track ticks.<\/b>. → <a class=\"eref\" data-go=\"298\">298<\/a><\/p>", "ops": [{"op": "tick", "n": 1}]}]}]}, "298": {"act": 2, "region": "The Hill Road", "blocks": [{"t": "p", "h": "<p>You get Doran Welk over your shoulder, because you are not leaving him on that road for whatever swept the stair. He is a broad man and it is the worst walk of your life.<\/p>"}, {"t": "p", "h": "<p>Halfway down you meet Hett Vance coming up. He stops dead when he sees what you are carrying and says nothing at all.<\/p>"}, {"t": "p", "h": "<p>You stop once at the strongbox. You lay Doran on the bank, open it, and read the paper by your lamp: eleven names, nine crossed out. The two that are not are Doran Welk and Hett Vance. The list goes in your coat.<\/p>"}, {"t": "p", "h": "<p>Then Hett takes half the weight without being asked, and the two of you bring the ford-keeper of Brackenford home, and behind you the candle keeps burning at the bottom of a swept stair.<\/p>"}, {"t": "p", "h": "<p><b>The night remembers: TOLLPAID.<\/b><\/p>", "ops": [{"op": "grant", "words": ["TOLLPAID"], "mark": false}]}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b><\/p>", "ops": [{"op": "tick", "n": 1}]}, {"t": "choice", "label": "Back to the dead hours", "target": "220"}]}, "299": {"act": 2, "region": "The Hill Road", "blocks": [{"t": "p", "h": "<p>You stand at the bottom of the hill road for a while and then you turn around, because rule three is the good rule and because there is a village behind you with its lights on and nobody in it but you.<\/p>"}, {"t": "p", "h": "<p>That is not cowardice. Somewhere up that road, a man who has spent twenty years being the only thing between Brackenford and the hill is finding that out for himself, the hard way, and he is doing it because he, too, wants to be the one who fixes it.<\/p>"}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b><\/p>", "ops": [{"op": "tick", "n": 1}]}, {"t": "choice", "label": "Back to the dead hours", "target": "220"}]}, "310": {"act": 2, "region": "The Turn", "blocks": [{"t": "p", "h": "<p><i>Play this entry when your visits are used up.<\/i><\/p>"}, {"t": "p", "h": "<p>You come back into the square somewhere in the deepest part of the night, in that hour when the cold stops being weather and starts being a place you live, and you stop, because something is different and it takes you a moment to find it.<\/p>"}, {"t": "p", "h": "<p>The bell is not ringing. That has been true for a while.<\/p>"}, {"t": "p", "h": "<p>The village is dark. Every shutter on the square, closed. Every door barred. Fifty people who were standing out here in their nightclothes an hour ago are behind wood, and the only light in Brackenford is the lantern somebody left burning on the wellhead, and yours.<\/p>"}, {"t": "cond", "kind": "has", "h": "<p>You did that. You stood in the middle of the square and got a village behind its doors, and they are inside, and you are not.<\/p>", "arg": "SHELTERED"}, {"t": "cond", "kind": "else", "h": "<p><i>The doors closed without you. Somebody in every house made the same decision tonight, one at a time, and the result is a shut village with one light moving in it, and the light is yours.<\/i><\/p>", "chain": true}, {"t": "p", "h": "<p>The deep cold has made the lamp burn its oil fast all night. <b>The lamp drinks a unit of oil.<\/b><\/p>", "ops": [{"op": "oil", "d": -1}]}, {"t": "cond", "kind": "lampdark", "h": "<p>The only light left in Brackenford is the one somebody set on the wellhead, and you are carrying a dead lantern through a shut village.<\/p>"}, {"t": "choice", "label": "Continue", "target": "311"}]}, "311": {"act": 2, "region": "The Turn", "blocks": [{"t": "p", "h": "<p><i>Count what the night has cost you and what you have.<\/i><\/p>"}, {"t": "cond", "kind": "has", "h": "<p>The Broken Wheel is shut and barred with Mara Tullamore alive behind it, and something walked away down the square that knew exactly which door in this village was going to open.<\/p>", "arg": "DOORHELD"}, {"t": "cond", "kind": "lacks", "h": "<p>You were not there. You do not know what happened at the inn, and there is a light still on up there, and its shutters are open.<\/p>", "arg": "DOORHELD"}, {"t": "cond", "kind": "has", "h": "<p>Brother Anselm is asleep on the floor of his shrine for the first time in thirty days, and the vigil is yours, and you did not know what you were agreeing to.<\/p>", "arg": "RELIEVED"}, {"t": "cond", "kind": "lacks", "h": "<p>The bell stopped ringing at some point while you were elsewhere. You do not know why it stopped.<\/p>", "arg": "RELIEVED"}, {"t": "cond", "kind": "has", "h": "<p>There is a child in a house on the square who will grow up telling this story wrong, and when the village saw you get her behind a door, every family on the square did the same. You could hear the bars dropping, door after door, all the way up the street.<\/p>", "arg": "SHELTERED"}, {"t": "cond", "kind": "has", "h": "<p>Something carried a six-year-old northwest over the roofs, and you have known where it went since the moment it happened, and you have not gone yet.<\/p>", "arg": "TAKEN"}, {"t": "cond", "kind": "has", "h": "<p>There is a list of eleven names in your coat with nine crossed out, and two that are not, and one of them is Hett Vance.<\/p>", "arg": "TOLLPAID"}, {"t": "choice", "label": "Continue", "target": "312"}]}, "312": {"act": 2, "region": "The Turn", "blocks": [{"t": "p", "h": "<p>Out on the ice, the sound starts.<\/p>"}, {"t": "p", "h": "<p>It is not loud. It is the sound a frozen pond makes when the weight comes off it in the morning, a long low complaining crack that travels, and it goes all the way across the Wend from the far bank to the near one and stops.<\/p>"}, {"t": "p", "h": "<p>Then it comes again.<\/p>"}, {"t": "p", "h": "<p>Something is walking back across the ford, and this time the ice is talking about it, which means this time it is heavier.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If your passive Wisdom (Perception) is 14 or higher, or you make a DC 14 Wisdom (Perception) check, with disadvantage if your lamp is dark:<\/i> you catch the spacing. The cracks come evenly, at the pace of a man walking who has nowhere he needs to be. It has not slipped once on that ice, and it has not stopped once to listen for you.<\/p>"}, {"t": "choice", "label": "Continue", "target": "313"}]}, "313": {"act": 2, "region": "The Turn", "blocks": [{"t": "p", "h": "<p>Hett Vance comes out of the dark at your shoulder with his lantern out and unlit.<\/p>"}, {"t": "p", "h": "<p>\"Don't,\" he says quietly, when you start to raise yours. \"Let it come up where we can see it. Don't let it see how many of us there are.\"<\/p>"}, {"t": "p", "h": "<p>\"There's two of us.\"<\/p>"}, {"t": "p", "h": "<p>\"Aye.\" His teeth are chattering and he is trying to hide it. \"So we'll want it dark.\"<\/p>"}, {"t": "p", "h": "<p>You stand together in the dead middle of the night at the top of the slope above the ford, a man in a tabard nobody granted him and a recruit of eight hours, and you watch the frozen river.<\/p>"}, {"t": "p", "h": "<p><b>The Dawn Track ticks.<\/b><\/p>", "ops": [{"op": "tick", "n": 1}]}, {"t": "choice", "label": "Continue", "target": "314"}]}, "314": {"act": 2, "region": "The Turn", "blocks": [{"t": "p", "h": "<p><i>Check your Dawn Track.<\/i><\/p>"}, {"t": "cond", "kind": "dawn", "h": "<p>It is perhaps three in the morning. There is a great deal of night left, and everything that is going to happen has time to happen slowly. Hett says, \"It'll be hours yet.\" He is right, and that turns out to be the bad news.<\/p>", "arg": "le5"}, {"t": "cond", "kind": "dawn", "h": "<p>It is past three. The sky over the moor is not lighter, but it has stopped getting darker, and both of you notice it at the same time and neither of you says so.<\/p>", "arg": "mid"}, {"t": "cond", "kind": "dawn", "h": "<p>You have spent this night thoroughly and it has nearly spent you. Dawn is close enough to be a real thing rather than an idea, and whatever is coming across that ice knows it too, and it has stopped bothering to be quiet.<\/p>", "arg": "ge10"}, {"t": "choice", "label": "Continue", "target": "315"}]}, "315": {"act": 2, "region": "The Turn", "blocks": [{"t": "p", "h": "<p>Whatever is out there reaches the near bank.<\/p>"}, {"t": "p", "h": "<p>You hear it come up out of the ford onto the stones, and you hear it stop, and then you hear the one thing neither of you was ready for, which is a voice from the bottom of the slope, perfectly clear in the cold, calling up to the village.<\/p>"}, {"t": "p", "h": "<p>It calls a name.<\/p>"}, {"t": "cond", "kind": "has", "h": "<p><i>It calls for Brother Anselm.<\/i><\/p>", "arg": "RELIEVED"}, {"t": "cond", "kind": "has", "h": "<p><i>It calls for Mara Tullamore.<\/i><\/p>", "arg": "DOORHELD", "chain": true}, {"t": "cond", "kind": "has", "h": "<p><i>It calls for Hett Vance, and the man beside you stops breathing.<\/i><\/p>", "arg": "TOLLPAID", "chain": true}, {"t": "cond", "kind": "else", "h": "<p><i>It calls for the watchman.<\/i><\/p>", "chain": true}, {"t": "p", "h": "<p>Beside you in the dark, Hett Vance says, \"Well. Now we know what it wants.\"<\/p>"}, {"t": "p", "h": "<p><b>END OF MIDDLE WATCH.<\/b><\/p>"}, {"t": "choice", "label": "Continue to <b>Act Three: Last Watch<\/b>, entry", "target": "400"}]}, "400": {"act": 3, "region": "The Thing At The Ford", "blocks": [{"t": "p", "h": "<p>It comes up the slope into your lantern light and stops at the edge of it, considerately, the way a caller stops at a gate.<\/p>"}, {"t": "p", "h": "<p>It is Doran Welk.<\/p>"}, {"t": "p", "h": "<p>He is wearing the coat he died in, and the frost is still on him in the seams of it and packed white in the folds of his ears, and there is not a mark on him anywhere. He is a broad tired man who went nowhere without his strongbox, and who carried his own chair out to the bank himself, and you brought him down that hill on your shoulder an hour ago, or you did not, and either way he is standing here now with his hands loose at his sides.<\/p>"}, {"t": "p", "h": "<p>\"Evening,\" it says, in his voice, kindly.<\/p>"}, {"t": "cond", "kind": "lampdark", "h": "<p>There is no edge of the light for it to stop at. It stops at arm's length instead, out of what appears to be courtesy, and you learn that its breath does not smell like anything at all.<\/p>"}, {"t": "cond", "kind": "nell", "h": "<p>She makes a sound you have never heard a dog make, once, and then she is pressed flat against the backs of your knees, and she stays there. She does not run. She will not look at it.<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you have darkvision:<\/i> inside the sixty feet your eyes are good for, the frost on the slope reads clear and grey and unbroken. It came up this hill and it left nothing behind, and you have been cracking that same frost with your own boots all night.<\/p>"}, {"t": "choice", "label": "Continue", "target": "401"}]}, "401": {"act": 3, "region": "The Thing At The Ford", "blocks": [{"t": "p", "h": "<p>Beside you, Hett Vance makes a sound that is not a word.<\/p>"}, {"t": "cond", "kind": "has", "h": "<p>You left Doran Welk sitting against the bank on the hill road, or you carried him down and laid him in his own house with a cloth over him. Either way you know exactly where his body was twenty minutes ago and it was not here.<\/p>", "arg": "TOLLPAID"}, {"t": "cond", "kind": "lacks", "h": "<p>You last saw Doran Welk at dusk, standing up so fast his chair went over, walking away with a strongbox and asking you not to have seen him.<\/p>", "arg": "TOLLPAID"}, {"t": "p", "h": "<p>\"You've had a long night, the pair of you,\" it says. \"Come down off there. It's cold.\"<\/p>"}, {"t": "choice", "label": "\"You're not him.\"", "target": "402"}, {"t": "choice", "label": "\"What are you?\"", "target": "403"}, {"t": "choice", "label": "\"What do you want?\"", "target": "405"}]}, "402": {"act": 3, "region": "The Thing At The Ford", "blocks": [{"t": "p", "h": "<p>\"No,\" it agrees, without any hesitation at all.<\/p>"}, {"t": "p", "h": "<p>That is the worst answer available and it gives it immediately, pleasantly, the way you would agree about the weather.<\/p>"}, {"t": "p", "h": "<p>\"He's in here, though,\" it says, and taps his chest with his own knuckles, twice. \"Most of him. Enough for the voice and the walk and knowing your name, watchman, which I do.\" It smiles with Doran's mouth. \"He liked you. He thought you'd not last the week. He liked you anyway.\"<\/p>"}, {"t": "check", "dc": 13, "ability": "Wisdom", "skill": null, "kind": "save", "h": "<p><i>Make a DC 13 Wisdom saving throw. On a failure, take 1d6 psychic damage: something in the way it said that gets in under your ribs and sits there.<\/i><\/p>"}, {"t": "p", "h": "<p><b>Fail-forward:<\/b> if that drops you to 0 hit points on Ember or Lantern, Hett Vance has you under the arms before your knees land, and the thing waits for you, politely, because it has nowhere to be. Take one level of exhaustion and go on to <a class=\"eref\" data-go=\"405\">405<\/a>. On Dark Watch, going down in front of it is a death: go to <a class=\"eref\" data-go=\"535\">535<\/a>.<\/p>"}, {"t": "choice", "label": "\"What do you want?\"", "target": "405"}], "failFwd": "405", "ffShared": true}, "403": {"act": 3, "region": "The Thing At The Ford", "blocks": [{"t": "p", "h": "<p>\"Cold,\" it says.<\/p>"}, {"t": "p", "h": "<p>It says it the way you would say <i>a farmer<\/i> or <i>a miller<\/i>. Not a description. An occupation.<\/p>"}, {"t": "p", "h": "<p>\"That's all. There's no more to me than that and there never was, and every one of you has spent a hundred years putting a face on it and a name to it and a bargain around it, and I have let you, because it makes you easier to talk to.\" It shrugs Doran's heavy shoulders. \"I come down the hill when it's cold enough. I take what's outside. If you'd all just stayed in, we'd never have met.\"<\/p>"}, {"t": "cond", "kind": "other", "h": "<p><i>If you can turn undead:<\/i> you raise your holy symbol and put your whole voice behind it, and it waits politely until you have finished. \"That is for the risen, and I have never once been in a grave,\" it says, with what sounds like real sympathy. You have learned what it is not, which is worth knowing, and you have learned that nothing you were taught was made for what it is.<\/p>"}, {"t": "choice", "label": "\"What do you want?\"", "target": "405"}]}, "405": {"act": 3, "region": "The Thing At The Ford", "blocks": [{"t": "p", "h": "<p>\"Eleven,\" it says. \"That was the arrangement. Eleven, over the years. The coin toll in the years between was a kindness, so that nobody in this village ever had to know the number.\"<\/p>"}, {"t": "p", "h": "<p>It looks past you, up the dark slope at the shuttered houses.<\/p>"}, {"t": "p", "h": "<p>\"Nine are done. Doran here is ten.\" A small movement of the borrowed head. \"And your captain is eleven, and then I am finished with Brackenford for a generation and the ford runs all winter and nobody freezes and everyone lives. That is the whole of the bargain. It is not even a bad one.\"<\/p>"}, {"t": "p", "h": "<p>Beside you, Hett Vance says, very quietly, \"Ah.\"<\/p>"}, {"t": "choice", "label": "Continue", "target": "406"}]}, "406": {"act": 3, "region": "The Thing At The Ford", "blocks": [{"t": "cond", "kind": "has", "h": "<p>You take the folded list out of your coat and you do not need to look at it. Eleven names in a careful hand. Nine crossed out. Doran Welk and Hett Vance not. You put it in Hett's hand, and he reads it by your lantern in about two seconds, and then he s
