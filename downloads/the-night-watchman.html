 </div>
 <div id="cwrow">${S.cw.map(w=>`<span class="chip">${w}</span>`).join("")}
   ${S.marks.map(w=>`<span class="chip mark">${w} &middot; dawn</span>`).join("")}
   ${S.cw.length+S.marks.length===0?'<span style="color:var(--cream-dim);font-size:13px">The night remembers nothing about you yet.</span>':""}</div>`;}
function adjHP(d){if(d<0&&S.thp>0){S.thp--;toast("Temporary hit point absorbed. "+S.thp+" remain.");save();render();return}
 S.hp=Math.max(0,Math.min(S.ch.hp,S.hp+d));
 if(S.hp>0&&(S.emberDown||S.darkDead)){S.emberDown=0;S.darkDead=0;
  toast("You are up. The night is not finished with you.");}
 if(S.hp===0){
  const ff=NW.entries[S.at]&&NW.entries[S.at].failFwd;
  if(ff&&S.tier!=="dark"){ // an authored fail-forward outranks the generic collapse
   toast("Down, but this scene wrote what happens next: follow the fail-forward line to "+ff+".");}
  else if(S.tier==="ember"){grant(["SCARRED"],true);S.emberDown=1;
   toast("0 HP. Ember Watch keeps its word: someone finds you and drags you to safety. The night goes on without you.");}
  else if(S.tier==="dark"){S.darkDead=1;
   toast("0 HP on Dark Watch. Death is death.");}
  else toast("0 HP. Death saves as normal; every dying moment here has a rescue that costs something. Follow the entry's own rescue line.");}
 save();render()}
function adjNell(d){S.nellHP=Math.max(0,Math.min(11,S.nellHP+d));
 if(S.nellHP===0)toast(S.tier==="ember"?"Nell yelps and bolts. She turns up at the ford at dawn, filthy and delighted.":"Nell is down.");save();render()}
function useRekindle(){if(S.rek<=0)return;
 const pick=prompt("Rekindle: (1) reroll the d20 you just rolled here, (2) stabilise at 0 HP, (3) refill one oil. Enter 1, 2 or 3.");
 if(!pick)return;
 // a token only spends on a use that can actually happen
 if(pick==="3"){
  if(S.oil>=S.oilMax){toast("Your lamp is already full. The token stays in your coat.");return}
  S.rek--;oil(1);}
 else if(pick==="2"){
  if(S.hp>0){toast("You are not dying. The token stays in your coat.");return}
  S.rek--;toast("You are stable at 0 HP. The night goes on.");}
 else if(pick==="1"){
  if(!S.lastRoll||!S.lastRoll.startsWith("roll"+S.at)||!S.acted[S.lastRoll]){
   toast("A Rekindle token only buys back the d20 you just rolled. Nothing here qualifies.");return}
  const rk=S.lastRoll;S.rek--;undoFailTick(rk);delete S.acted[rk];
  toast("The token burns. Roll again, and keep what comes.");}
 else{toast("That is not one of the token's three uses. It stays in your coat.");return}
 save();render()}

function postsUsed(){return ["030","040","050","060","070"].filter(p=>S.acted["post"+p]).length}
function condVisible(b){switch(b.kind){
 case "nell":return S.nell&&S.nellHP>0;
 case "lampdark":return S.oil===0;
 case "lamplit":return S.oil>0;
 case "has":return S.cw.includes(b.arg)||S.marks.includes(b.arg);
 case "lacks":return !(S.cw.includes(b.arg)||S.marks.includes(b.arg));
 case "tier":return S.tier===b.arg;
 case "dawn":return b.arg==="le5"?S.dawn<=5:b.arg==="mid"?(S.dawn>=6&&S.dawn<=9):S.dawn>=10;
 case "circuit2":return postsUsed()>=2&&!S.acted.cold;
 case "circuit3":return postsUsed()>=3;
 default:return true}}

function renderBlocks(blocks,eno,keyBase,active){
 if(active===undefined)active=true;
 let html="",chainMatched=false;
 blocks.forEach((b,idx)=>{const key=keyBase+"/"+idx;
  if(b.t==="p"){html+=b.card?`<div class="card">${b.cre?ico("feather","cardico"):""}${b.h}</div>`:`<div class="entry-p">${b.h}</div>`;
   if(b.ops&&active)queueOps(b.ops,key);
   if(b.end)html+=`<p style="margin-top:20px"><button class="primary" onclick="endNight()">The night is over &middot; see your dawn ledger</button></p>`;}
  else if(b.t==="cond"){
   let vis;
   if(b.chain){vis=(b.kind==="else")?!chainMatched:(!chainMatched&&condVisible(b));}
   else{vis=condVisible(b);chainMatched=false;}
   if(vis&&(b.chain||b.kind!=="other"))chainMatched=true;
   const asNav=b.target&&(vis||b.kind==="other");
   if(asNav){ // a conditional that IS a route: render as a gated choice button
    const gj=b.clickGrant?JSON.stringify(b.clickGrant).replace(/"/g,"&quot;"):"null";
    html+=`<button class="choice" onclick="condNav('${b.target}',${gj},'${key}')">
      <span class="arr">&rarr;</span><span>${b.h.replace(/^<p>|<\/p>$/g,"")}</span><span class="tno">${b.target}</span></button>`;}
   else if(b.kind==="other"){html+=`<div class="cond"><span class="condtag">${ico("mark","tagico")}your character may know</span>${b.h}</div>`;}
   else if(vis){html+=`<div class="cond"><span class="condtag">${ico(COND_ICON[b.kind]||"mark","tagico")}${condTag(b)}</span>${b.h}</div>`;
    if(b.ops&&active)queueOps(b.ops,key);}
  }
  else if(b.t==="check"){html+=renderCheck(b,eno,key);}
  else if(b.t==="outcome"){const r=S.acted["roll"+eno];
   const cls=r? (r.pass&&b.which==="success"||!r.pass&&b.which==="failure"?"hit":"dim"):"pending";
   html+=`<div class="outcome ${cls}"><span class="oc-h">${b.which==="success"?"On a success":"On a failure"}${cls==="pending"?" (roll first)":""}</span>`+
     renderBlocks(b.blocks,eno,key,active&&cls==="hit")+`</div>`;}
  else if(b.t==="lamp"){const mine=b[S.tier];
   const others=["ember","lantern","dark"].filter(k=>k!==S.tier&&b[k]).map(k=>`<b>${k[0].toUpperCase()+k.slice(1)}:</b> ${b[k]}`).join(" &middot; ");
   html+=`<div class="lampbox"><span class="tiername">Watch Lamp &middot; ${TIERS[S.tier].name}:</span> ${mine||"as written"}
    <div class="others"><details><summary style="cursor:pointer">the other lamps</summary>${others}</details></div></div>`;}
  else if(b.t==="choice"){/* collected later */}
 });
 return html;}
function condTag(b){return b.kind==="nell"?"because Nell is with you":b.kind==="lampdark"?"because your lamp is dark":
 b.kind==="has"?"because you have "+b.arg:b.kind==="lacks"?"because you do not have "+b.arg:
 b.kind==="tier"?"your Watch Lamp":b.kind==="dawn"?"the hour, by your Dawn Track ("+S.dawn+" of 12)":
 b.kind==="circuit2"||b.kind==="circuit3"?"the round":"the night notices"}
let opQueue=[];
function queueOps(ops,key){opQueue.push([ops,key])}
function flushOps(){const q=opQueue;opQueue=[];q.forEach(([o,k])=>applyOps(o,k))}

function checkDC(b){ // explicit tier overrides in the text win outright; else printed + tier dials
 if(b.tdc&&b.tdc[S.tier]!==undefined)return b.tdc[S.tier];
 return b.dc+TIERS[S.tier].dc+(S.tier==="dark"&&S.dawn>=9?2:0);}
function checkMod(b){const abl=ABIL[b.ability];const c=S.ch;let m=mod(c.abil[abl]);
 if(b.kind==="save"&&c.saves.includes(abl))m+=c.prof;
 if(b.kind==="check"&&b.skill&&c.skills.includes(b.skill))m+=c.prof;
 return m;}
function rollOut(r){return `<div class="rollout">${r.dice.map((d,i)=>`<span class="die ${r.dice.length>1&&i!==r.keep?"dim":""}">${d}</span>`).join(" ")}
  &nbsp;${sgn(r.m)} = <b>${r.total}</b> vs DC ${r.dc}
  &nbsp;<span class="verdict ${r.pass?"ok":"bad"}">${r.pass?"success":"failure"}</span></div>`;}
function renderCheck(b,eno,key){
 const m=checkMod(b),dc=checkDC(b),n=b.repeat||1;
 // darkness penalizes outdoor Wisdom (Perception) only; other checks are the player's call
 const dis=(S.oil===0&&b.skill==="Perception")?' checked':"";
 const hint=(!S.taught||!S.taught.check)?`<div style="font-size:13px;color:var(--ink-dim);margin-top:4px">The file rolls with your sheet's numbers and shows you the raw die. Once rolled, a result stands; only a Rekindle token buys a reroll. Failure always moves the night forward.</div>`:"";
 let rows="";
 for(let i=0;i<n;i++){
  const rk="roll"+eno+(n>1?"_"+i:"");
  const r=S.acted[rk];
  const prevDone=i===0||S.acted["roll"+eno+"_"+(i-1)];
  const label=n>1?["Hour one","Hour two","Hour three"][i]:"Roll d20 "+sgn(m);
  if(r){rows+=(n>1?`<div style="font-size:13px;color:var(--ink-dim)">${label}</div>`:"")+rollOut(r)
    +(S.rek>0&&rk===S.lastRoll?`<button style="font-size:12px;padding:2px 8px" onclick="rekReroll('${rk}')">Rekindle: reroll this</button>`:"");}
  else if(prevDone){rows+=`<div class="rollrow">
   <button class="primary" onclick="doRoll('${eno}',${i},${n})">${label} ${n>1?sgn(m):""}</button>
   <label style="width:auto;font-size:13px"><input type="checkbox" id="adv-${eno}" style="width:auto"> advantage</label>
   <label style="width:auto;font-size:13px"><input type="checkbox" id="dis-${eno}" style="width:auto"${dis}> disadvantage${dis?" (dark lamp)":""}</label>
   <span class="dcnote">DC ${dc}${b.tdc&&b.tdc[S.tier]!==undefined?" ("+TIERS[S.tier].name+", as written)":""}</span>
  </div>`;}
 }
 if(n>1){const rs=[0,1,2].map(i=>S.acted["roll"+eno+"_"+i]).filter(Boolean);
  if(rs.length===3){const fails=rs.filter(r=>!r.pass).length;
   rows+=`<div class="rollout"><b>${fails} failure${fails===1?"":"s"} of three.</b> ${fails===3?"You failed all three: follow that line below.":"You did not fail all three: follow the Otherwise line below."}</div>`;}}
 return `<div class="checkbox">${ico("d20","cardico")}${b.h}${hint}${rows}</div>`;}
function findCheck(eno){const bl=NW.entries[eno].blocks;return bl.find(b=>b.t==="check");}
function doRoll(eno,idx,n){
 const b=findCheck(eno);if(!b)return;
 const rk="roll"+eno+((n||1)>1?"_"+idx:"");
 if(S.acted[rk])return; // a result stands; reroll only through Rekindle
 const m=checkMod(b),dc=checkDC(b);
 const adv=$("#adv-"+eno)?.checked,dis=$("#dis-"+eno)?.checked;
 let dice=[d20()];if(adv!==dis)dice.push(d20());
 let keep=0;if(dice.length>1)keep=adv?(dice[0]>=dice[1]?0:1):(dice[0]<=dice[1]?0:1);
 const total=dice[keep]+m;const pass=total>=dc;
 S.acted[rk]={dice,keep,m,total,dc,pass};
 S.lastRoll=rk;
 if(!S.taught)S.taught={};S.taught.check=1;
 if(!pass&&b.failTick&&!S.opsDone.includes(rk+"/failtick")&&S.dawn<12){S.opsDone.push(rk+"/failtick");tick(b.failTick);}
 save();render();}
function undoFailTick(rk){ // a reroll un-charges the failed roll's cost; the new roll re-charges it honestly
 const ft=rk+"/failtick";const i=S.opsDone.indexOf(ft);
 if(i>=0){S.opsDone.splice(i,1);
  const eno=rk.replace(/^roll/,"").replace(/_\d$/,"");
  const b=findCheck(eno);
  if(b&&b.failTick)S.dawn=Math.max(0,S.dawn-b.failTick);}}
function rekReroll(rk){if(S.rek<=0)return;
 if(rk!==S.lastRoll){toast("A Rekindle token only buys back the d20 you just rolled, not history.");return}
 if(!confirm("Spend a Rekindle token to reroll this d20?"))return;
 S.rek--;undoFailTick(rk);delete S.acted[rk];
 toast("The token burns. Roll again, and keep what comes.");save();render();}
function condNav(target,grants,key){
 const why=navGuard(target);
 if(why){toast(why);return}
 if(grants){const k="condgrant/"+key;
  if(!S.opsDone.includes(k)){S.opsDone.push(k);grant(grants,false);}}
 goto(target);}

function renderPlay(app){const e=NW.entries[S.at];const t=TIERS[S.tier];
 opQueue=[];
 let choices=[];
 const collect=bl=>bl.forEach(b=>{if(b.t==="choice")choices.push(b);
   if(b.t==="outcome")/* choices inside outcomes render inside */0;});
 collect(e.blocks);
 const body=renderBlocks(e.blocks,S.at,S.at,true);
 // choices inside outcome blocks: locked until rolled, and only the earned side unlocks
 const r=S.acted["roll"+S.at];
 e.blocks.filter(b=>b.t==="outcome").forEach(b=>{
   const earned=r&&((r.pass&&b.which==="success")||(!r.pass&&b.which==="failure"));
   b.blocks.filter(x=>x.t==="choice").forEach(c=>choices.push({...c,
     gated:!r?"roll first":(earned?null:"not your result")}));});
 const hubMode=S.at==="220";
 const circuitMode=S.at==="020";
 const POSTS=["030","040","050","060","070"];
 const pc=postsUsed();
 // a required check gates every choice until its dice are thrown
 const chk=e.blocks.find(b=>b.t==="check");
 if(chk){const n=chk.repeat||1;
  const done=n>1?[0,1,2].every(i=>S.acted["roll"+S.at+"_"+i]):!!S.acted["roll"+S.at];
  if(!done)choices=choices.map(c=>c.gated?c:{...c,gated:"roll first"});}
 LAST_CHOICES=choices;
 const chtml=choices.map((c,i)=>{
  let locked=false,tag="";
  if(c.req&&!(S.cw.includes(c.req)||S.marks.includes(c.req))){locked=true;tag=`<span class="reqtag">requires ${c.req}</span>`;}
  if(hubMode&&["230","250","270","290"].includes(c.target)&&!S.acted["hub"+c.target]&&S.hubUsed>=t.visits){locked=true;tag=`<span class="reqtag">the night has moved on</span>`;}
  if(hubMode&&S.acted["hub"+c.target]){tag=`<span class="reqtag">visited</span>`;}
  if(circuitMode&&POSTS.includes(c.target)){
   if(S.acted["post"+c.target]){locked=true;tag=`<span class="reqtag">rung in</span>`;}
   else if(pc>=2&&!S.acted.cold){locked=true;tag=`<span class="reqtag">the night interrupts</span>`;}
   else if(pc>=3){locked=true;tag=`<span class="reqtag">it is midnight</span>`;}}
  if(hubMode&&S.acted["hub"+c.target]){locked=true;} // the night does not offer the same crisis twice
  if(c.gated){locked=true;tag=`<span class="reqtag">${c.gated}</span>`;}
  if(!locked&&navGuard(c.target)){locked=true;tag=tag||`<span class="reqtag">not your road</span>`;}
  const dimcls="";
  return `<button class="choice ${locked?"locked":dimcls}" ${locked?"disabled":""}
    onclick="clickChoice(${i})">
    <span class="arr">&rarr;</span><span>${c.label}${c.note?` <i style="font-size:14px">${c.note}</i>`:""}</span>${tag}<span class="tno">${c.target}</span></button>`;}).join("");
 app.innerHTML=`
  <div id="topbar"><span class="brand">The Night Watchman</span>
   <button onclick="openPanel('sheet')">Night Sheet</button>
   <button onclick="openPanel('map')">The Round</button>
   <button onclick="openPanel('primer')">How to play</button>
   <button onclick="openPanel('appendix')">Appendices</button>
   <button onclick="restartNight()" title="Bury this night and start again">New night</button></div>
  ${hudHTML()}
  ${S.darkDead?`<div style="border:1px solid var(--blood);border-radius:10px;padding:10px 14px;margin:8px 0;background:#a33c2f14">
    <b style="color:var(--blood)">The watchman is dead.</b> Dark Watch keeps its word:
    <button class="primary" style="margin-left:8px" onclick="S.darkDead=0;S.buried=1;save();goto('535')">Bury the watchman &rarr; 535</button></div>`:""}
  ${S.emberDown?`<div style="border:1px solid var(--ember);border-radius:10px;padding:10px 14px;margin:8px 0;background:#e0884014">
    <b style="color:var(--ember)">You are carried to safety.</b> The night finishes without its watchman, and the dawn reads what that cost:
    <button class="primary" style="margin-left:8px" onclick="S.emberDown=0;S.acted.emberFell=1;save();goto('520')">Sleep until the sun &rarr; the dawn</button></div>`:""}
  ${S.dawn>=12&&e.act<3?`<div style="border:1px solid var(--ember);border-radius:10px;padding:10px 14px;margin:8px 0;background:#e0884014">
    <b style="color:var(--ember)">Dawn is here.</b> Finish what you are doing on this ground. The moment you leave it,
    the night ends at the ford, and the file will take you there.</div>`:""}
  <div class="region">${ico(REGION_ICON[e.region]||"lantern","region")}${e.region} &middot; ${["","First Watch","Middle Watch","Last Watch"][e.act]}</div>
  <div class="eno">${S.at}</div>
  <div class="entry">${body}</div>
  ${hubMode?`<p style="color:var(--cream-dim);font-size:14px">Visits used: ${S.hubUsed} of ${t.visits}.
    ${S.hubUsed>=t.visits?'The night has moved on: go to <a class="eref" data-go="310">310</a>.':""}</p>`:""}
  ${circuitMode?`<p style="color:var(--cream-dim);font-size:14px">Posts rung in: ${pc} of 3 this night.
    ${pc>=2&&!S.acted.cold?'Something is wrong out there: go to <a class="eref" data-go="090">090</a>.':""}
    ${pc>=3?'It is midnight: go to <a class="eref" data-go="100">100</a>.':""}</p>`:""}
  <div class="choices">${chtml}</div>
  <p class="footnote">entry ${S.at} &middot; ${S.seen.length} of 186 entries seen this night &middot; autosaved</p>`;
 bindErefs();flushOps();}
let LAST_CHOICES=[];
function clickChoice(i){const c=LAST_CHOICES[i];if(!c)return;
 const why=navGuard(c.target); // every navigation surface passes the ONE gate
 if(why){toast(why);return}
 if(c.grant){const k="choice-grant/"+S.at+"/"+i;
  if(!S.opsDone.includes(k)){S.opsDone.push(k);grant(c.grant,false);}}
 if(S.at==="020"&&["030","040","050","060","070"].includes(c.target)&&!S.acted["post"+c.target]){
  S.acted["post"+c.target]=1;}
 if(S.at==="220")hubVisit(c.target);else goto(c.target);}
/* every navigation surface passes ONE gate: prose links obey the same rules as buttons */
function checkDone(eno){const b=NW.entries[eno].blocks.find(x=>x.t==="check");
 if(!b)return true;const n=b.repeat||1;
 return n>1?[0,1,2].every(i=>S.acted["roll"+eno+"_"+i]):!!S.acted["roll"+eno];}
function navGuard(target){
 const e=NW.entries[S.at];
 if(S.buried&&target!=="535")return "That watchman is buried. Start a new night from the menu.";
 // ORDER MATTERS. Death outranks every entry-level route, including authored
 // fail-forwards; then a downed watchman at a fail-forward scene may take that
 // route and NOTHING else; then a standing watchman may not claim it.
 if(S.darkDead)return "The watchman is dead. Dark Watch keeps its word: bury him.";
 const ff=e&&e.failFwd;
 // if the fail-forward points at an exit the entry also offers normally
 // (076->078 retreat, 277->279 the child taken, 483->486 walking out), it is a
 // SHARED exit: the collapse may use it, but so may anyone still standing.
 const ffShared=e&&e.ffShared;
 if(ff&&S.hp===0)
  return target===ff?null:"You are down. The only way out of this room is the fail-forward line to "+ff+".";
 if(ff&&target===ff&&S.hp>0&&!ffShared)return "You are still standing. That line is for a watchman who is not.";
 if(S.emberDown)return "The night goes on without you. Follow the dawn.";
 if(!e)return null;
 if(!checkDone(S.at))return "Roll first. The dice decide this one.";
 // RESULT ENTITLEMENT: a target owned by an outcome belongs only to that result
 if(e.own&&e.own[target]){
  const r=S.acted["roll"+S.at];
  if(r){const mine=r.pass?"success":"failure";
   if(e.own[target]!==mine)
    return "The dice already answered this one. Follow the "+mine+" line.";}}
 // TIER ENTITLEMENT: when a tier claims a route here, only that route is yours
 if(e.tierOwn){const claimed=Object.entries(e.tierOwn).find(([,t])=>t===S.tier);
  if(claimed&&target!==claimed[0])
   return "Your Watch Lamp takes a different road out of this one: "+claimed[0]+".";
  const otherTier=e.tierOwn[target];
  if(otherTier&&otherTier!==S.tier)
   return "That road belongs to "+TIERS[otherTier].name+".";}
 // multi-roll adjudication (the vigil): the tally, not the player, decides
 if(S.at==="444"){const fails=[0,1,2].filter(i=>!S.acted["roll444_"+i]?.pass).length;
  if(target==="446"&&fails<3)return "You did not fail all three. Follow the Otherwise line.";
  if(target==="447"&&fails===3)return "You failed all three. Follow that line.";}
 if(target==="535"&&S.tier!=="dark"&&!S.darkDead)
  return "That ending belongs to Dark Watch. Yours does not end here.";
 if(S.at==="220"){const CRISES=["230","250","270","290"];
  if(target==="310"&&S.hubUsed<(S.acted.hubCap||TIERS[S.tier].visits)&&S.dawn<12)
   return "The night is not done with you here: you have a visit left.";
  if(CRISES.includes(target)){
   if(S.acted["hub"+target])return "You have been there tonight. The night does not offer the same crisis twice.";
   if(S.hubUsed>=(S.acted.hubCap||TIERS[S.tier].visits))return "The night has moved on. Go to the square.";}}
 // the circuit's staging is a rule, not a suggestion — and it is enforced HERE,
 // not only by a disabled button (Codex r5 F1: render-only locks are not locks)
 if(S.at==="020"){const pc=postsUsed();const POSTS=["030","040","050","060","070"];
  if(POSTS.includes(target)){
   if(S.acted["post"+target])return "You have rung in there already tonight.";
   if(pc>=2&&!S.acted.cold)return "Not yet. Something is about to happen to this village.";
   if(pc>=3)return "The round is walked. It is midnight.";}
  if(target==="090"&&(pc<2||S.acted.cold))return S.acted.cold?"That is behind you now.":"The cold has not come for you yet.";
  if(target==="100"&&pc<3)return pc<2?"The round is barely begun. Walk your posts.":
   "The round is not walked yet: the cold first, then your third post.";}
 return null;}
function bindErefs(){document.querySelectorAll("#app .eref").forEach(a=>a.onclick=()=>{
 const why=navGuard(a.dataset.go);
 if(why){toast(why);return}
 goto(a.dataset.go)});}
function endNight(){openPanel("sheet");toast("Read your dawn. Then play it again: a different route, different company, somewhere else to stand.")}
function restartNight(){if(confirm("Bury this night and start a new one? The current run is erased."))
 {const keep=S.tier;S=defaultState();S.screen="setup";save();render();}}

/* ---------------- panels ---------------- */
function openPanel(which){let el=$("#panel");
 if(!el){el=document.createElement("div");el.id="panel";el.className="panel";document.body.appendChild(el);}
 let inner="";
 if(which==="primer")inner=NW.primer.map(s=>`<h3>${s.title}</h3>${s.h}`).join("");
 if(which==="appendix")inner=NW.appendices.map(s=>`<h3>${s.title}</h3>${s.h}`).join("")+oracleHTML();
 if(which==="sheet")inner=sheetHTML();
 if(which==="map")inner=mapHTML();
 el.innerHTML=`<div class="inner"><button class="close" onclick="closePanel()">close</button>${inner}</div>`;
 el.classList.add("open");
 if(which==="appendix")bindOracle();
 if(which==="sheet")bindSheet();}
function closePanel(){$("#panel").classList.remove("open")}
function sheetHTML(){if(!S.ch)return "<p>No night in progress.</p>";const c=S.ch;
 return `<h3>The Night Sheet</h3>
 <p><b>${c.name||"The watchman"}</b> &middot; ${c.cls||""} &middot; AC ${c.ac} &middot; HP ${S.hp}/${c.hp}${S.thp?` (+${S.thp} temp)`:""}</p>
 <p>${Object.entries(c.abil).map(([k,v])=>`<b>${k.toUpperCase()}</b> ${v} (${sgn(mod(v))})`).join(" &middot; ")}</p>
 <p>Saves: ${c.saves.map(s=>s.toUpperCase()).join(", ")||"none"} &middot; Skills: ${c.skills.join(", ")||"none"} &middot; Proficiency +${c.prof}</p>
 <p>Codewords: ${S.cw.map(w=>`<span class="cw">${w}</span>`).join(", ")||"none yet"}<br>
    Dawn marks: ${S.marks.map(w=>`<span class="cw">${w}</span>`).join(", ")||"none"}</p>
 <p>Dawn Track: ${S.dawn}/12 &middot; Oil: ${S.oil}/${S.oilMax} &middot; Rekindle: ${S.rek}/${S.rekMax}${S.nell?` &middot; Nell: ${S.nellHP>0?S.nellHP+" HP":"fled"}`:""}</p>
 <h4>Change your Watch Lamp (any rest, no penalty)</h4>
 <p>${Object.entries(TIERS).map(([k,t])=>`<button ${k===S.tier?'class="primary"':""} onclick="switchTier('${k}')">${t.name}</button>`).join(" ")}</p>
 <h4>The journal of the night</h4>
 <p style="font-size:13px;color:var(--cream-dim)">${S.journal.join(" &rarr; ")}</p>
 <p><button onclick="exportRun()">Export this night (file)</button></p>`;}
function bindSheet(){}
function switchTier(k){const nt=TIERS[k];if(k===S.tier)return;
 const e=NW.entries[S.at];
 // no changing the lamp mid-scene, and never while you are down: the tier that
 // was in play when you fell is the tier that adjudicates the fall
 if(S.hp===0||S.darkDead||S.emberDown){
  toast("You are on the floor. The lamp you were carrying when you went down is the lamp that decides this.");return}
 if(S.at==="220"||S.at==="020"){
  toast("Not here. A staged night does not let you re-cut its budget from inside it: change the lamp at a post or a scene.");return}
 if(e&&(e.failFwd||e.blocks.some(b=>b.t==="check"||b.card||b.cre))){
  toast("Not in the middle of a scene that is testing you. Change the lamp on quieter ground: any entry without a roll or a fight.");return}
 S.tier=k;S.oilMax=nt.oil;S.oil=Math.min(S.oil,nt.oil);
 S.rekMax=nt.rekindle;S.rek=Math.min(S.rek,nt.rekindle);
 S.thp=Math.min(S.thp,nt.thp(3)); // no free Resolve mid-act; refresh comes with the next watch
 toast("The lamp is turned: "+nt.name+". Oil, Rekindle, and temporary hit points clamp to the new lamp now; a fresh act grants its resources in full.");save();openPanel("sheet");render();}
function exportRun(){const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);
 a.download="night-watchman-run.json";a.click();}
function mapHTML(){
 const seen=new Set(S.seen.map(n=>NW.entries[n]?.region));
 const nodes={};Object.entries(REGION_NODES).forEach(([r,[x,y]])=>{const k=x+","+y;
  nodes[k]=nodes[k]||{x,y,names:[],seen:false};nodes[k].names.push(r);
  if(seen.has(r))nodes[k].seen=true;});
 const LABELS={"300,270":"The Ford","300,238":"The Round","210,60":"The Broken Wheel",
  "360,120":"The Shrine","210,170":"Greel's Yard","290,120":"The Square & Well",
  "440,210":"The Broken Bridge","470,290":"The Drowned Lane","150,40":"Caer Brack & the hill road"};
 let svg=`<h3>${ico("compass","region")}The Round</h3><p style="font-size:14px;color:var(--cream-dim)">The village reveals itself as you walk it. ${Object.values(nodes).filter(n=>n.seen).length} of ${Object.keys(nodes).length} grounds walked this night.</p>
 <div id="map"><svg viewBox="0 0 560 330">
 <path d="M20,300 C160,275 400,285 540,240" stroke="#3d5a66" stroke-width="26" fill="none" opacity=".5"/>
 <text x="30" y="322" class="mlabel">the River Wend</text>
 <path d="M300,270 L290,120 L210,60 M290,120 L360,120 M290,120 L210,170 M290,120 L440,210 M150,40 L210,60 M300,270 L470,290" stroke="#4a4232" stroke-width="2" fill="none" stroke-dasharray="4 5"/>`;
 Object.entries(nodes).forEach(([k,n])=>{const lbl=LABELS[k]||n.names[0];
  svg+=`<circle cx="${n.x}" cy="${n.y}" r="9" class="mnode ${n.seen?"seen":""}"/>
  <text x="${n.x+14}" y="${n.y+4}" class="mlabel ${n.seen?"seen":""}">${lbl}</text>`;});
 svg+=`</svg></div>`;return svg;}
function oracleHTML(){return `<h3>Ask the night (Appendix A, live)</h3>
 <p><button class="primary" onclick="rollOracle()">Roll the question (d6)</button>
 <button onclick="rollSurprise()">Roll a surprise (d8)</button></p><div id="oracle-out"></div>`;}
const ORACLE=["<b>No, and</b> something worse. Add a complication you did not expect.","<b>No.</b>",
 "<b>No, but</b> something small goes your way.","<b>Yes, but</b> it costs you.","<b>Yes.</b>","<b>Yes, and</b> more than you asked for."];
const SURPRISE=["Somebody who should be inside is outside.","A thing that was shut is open. Nobody will admit to opening it.",
 "An offering has been taken, and it was not the weather.","Somebody tells you the truth, at a bad moment, for their own reasons.",
 "The cold arrives early, and everything you had planned is now happening in it.",
 "A person you have written off turns out to have been doing something all along.",
 "Somebody asks you for a promise you should not make.","It is quiet. Genuinely quiet. Take the win and use the hour."];
function rollOracle(){const d=Math.floor(Math.random()*6)+1;
 $("#oracle-out").innerHTML=`<p><span class="die">${d}</span> &nbsp;${ORACLE[d-1]}</p>`;}
function rollSurprise(){const d=Math.floor(Math.random()*8)+1;
 $("#oracle-out").innerHTML=`<p><span class="die">${d}</span> &nbsp;${SURPRISE[d-1]}</p>`;}
function bindOracle(){}

/* ---------------- boot ---------------- */
load();
if(!S)S=defaultState();
if(S.screen==="play"&&!S.ch){S=defaultState();}
render();
</script></body></html>
